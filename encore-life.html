<title>앙코르 라이프</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="열 살에 처음 잡은 악기부터 마지막 앙코르까지, 밴드 뮤지션의 인생을 키우는 텍스트 라이프 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  /* Layout: backstage at night — laminate pass + mixing-desk faders on the left rail, setlist-paper feed and tabs on the right, tape-deck transport (▶ 1년 보내기) pinned to the bottom */
  --night:#141019;
  --wall:#1b1521;
  --panel:#221b29;
  --panel-2:#2c2335;
  --line:#3d3049;
  --ink:#f2edf5;
  --muted:#ab9fb8;
  --dim:#716582;
  --spot:#ffb23f;
  --spot-hi:#ffca73;
  --gel:#ff5a82;
  --paper:#ece6d8;
  --paper-ink:#221d28;
  --good:#62d69d;
  --bad:#ff6d6d;
  --info:#86bcff;
  --f-disp:'Gasoek One','Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --f-hand:'Nanum Pen Script','IBM Plex Sans KR',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{
  font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%;
  background:
    radial-gradient(900px 480px at 18% -160px, rgba(255,178,63,.10), transparent 70%),
    radial-gradient(700px 420px at 92% -120px, rgba(255,90,130,.07), transparent 70%),
    var(--night);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--spot);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.hand{font-family:var(--f-hand);font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== top bar ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font-family:var(--f-disp);font-size:21px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-ico{width:28px;height:28px;flex:none}
.brand b{color:var(--spot);font-weight:400}
.top-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip-led{font-family:var(--f-mono);font-size:15px;font-weight:600;line-height:1;padding:7px 10px 6px;border-radius:6px;background:#0b080e;color:var(--spot);border:1px solid #3a2a12;text-shadow:0 0 10px rgba(255,178,63,.45);white-space:nowrap}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:13px}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.settle{border-color:var(--spot);color:var(--spot)}
@media (max-width:440px){.chip-led{display:none}}
.ticker{display:flex;align-items:center;gap:10px;min-width:0;background:var(--wall);border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.ticker b{flex:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:#0b080e;background:var(--gel);border-radius:4px;padding:2px 6px}
.ticker span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:120px}
@media (min-width:940px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start}.rail{position:sticky;top:12px}}
.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.mainp{min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:939px){.rail{display:contents}.rail .pass{order:1}.rail .p-life{order:2}.mainp{order:3}.rail .p-mix{order:4}.rail .p-map{order:5}}

/* ===== laminate pass ===== */
.pass{position:relative;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(0,0,0,.85)}
.pass-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px 7px 44px;background:var(--spot);color:#1a1205;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;position:relative}
.pass-strip::before{content:"";position:absolute;left:14px;top:50%;width:20px;height:8px;margin-top:-4px;border-radius:4px;background:var(--night);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.pass-strip span:last-child{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.pass-top{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;padding:12px 14px 4px;align-items:end}
.pass-av{width:104px;height:113px;border-radius:10px;background:radial-gradient(circle at 50% 30%,#3b2c48,#1d1624 72%);display:block}
.pass-name{font-family:var(--f-disp);font-size:27px;line-height:1.12;word-break:keep-all;overflow-wrap:anywhere}
.pass-sub{font-size:13px;color:var(--muted)}
.inst-badge{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;padding:3px 7px 2px;border-radius:4px;border:1px solid var(--gel);color:var(--gel);margin-bottom:6px}
.pass-body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
.mus-row{display:flex;align-items:center;gap:14px}
.vinyl{width:78px;height:78px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;
  background:repeating-radial-gradient(circle at 50% 50%,#0d0a10 0 2px,#1a1520 2px 3px);box-shadow:0 0 0 1px #000,inset 0 0 0 1px rgba(255,255,255,.06)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 20%,rgba(255,255,255,.07) 25%,transparent 32% 70%,rgba(255,255,255,.05) 76%,transparent 82%)}
.vinyl span{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--spot);color:#1a1205;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:17px;line-height:1}
.vinyl small{font-size:7.5px;letter-spacing:.12em;margin-top:2px}
.mus-meta{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13px;color:var(--muted)}
.mus-meta strong{color:var(--ink);font-weight:700;word-break:keep-all}
.stars{color:var(--spot);letter-spacing:2px}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--panel-2)}
.trait.neg{border-color:rgba(255,109,109,.5)}
.trait.str{border-color:rgba(255,178,63,.5)}

/* ===== panels ===== */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.panel h3{margin:0 0 10px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 em{font-family:var(--f-body);font-style:normal;letter-spacing:0;font-weight:500;text-transform:none;color:var(--dim);font-size:12px}
.vus{display:flex;flex-direction:column;gap:8px}
.vu{display:grid;grid-template-columns:44px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.vu-track{position:relative;height:10px;border-radius:2px;background:#0d0a11;overflow:hidden}
.vu-track i{position:absolute;inset:0;background:linear-gradient(90deg,var(--good) 0 62%,var(--spot) 62% 84%,var(--gel) 84%)}
.vu-track i.low{background:linear-gradient(90deg,var(--bad) 0 30%,var(--spot) 30% 60%,var(--good) 60%)}
.vu-track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 5px,#0d0a11 5px 7px)}
.vu b{font-family:var(--f-mono);font-size:14px;color:var(--ink);text-align:right;font-weight:600}
.big-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.big-nums div{min-width:0}
.big-nums span{display:block;font-size:11.5px;color:var(--muted)}
.big-nums b{display:block;font-family:var(--f-mono);font-size:19px;line-height:1.2;color:var(--spot);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* mixer faders */
.mixer{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;background:#100c14;border:1px solid var(--line);border-radius:8px;padding:10px 6px 8px}
.ch{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ch label{font-size:11px;color:var(--muted);white-space:nowrap}
.slot{position:relative;width:100%;height:118px}
.slot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:#000;box-shadow:inset 0 0 0 1px #2a2131}
.slot .lvl{position:absolute;left:50%;bottom:0;width:4px;margin-left:-2px;border-radius:2px;background:var(--spot);opacity:.55}
.slot .capm{position:absolute;left:18%;right:18%;height:2px;background:var(--muted);opacity:.55}
.slot .knob{position:absolute;left:50%;width:26px;height:14px;margin:0 0 -7px -13px;border-radius:3px;background:linear-gradient(#57496a,#2c2236);border:1px solid #6b5b80;box-shadow:0 2px 4px rgba(0,0,0,.6)}
.slot .knob::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1px;background:var(--ink)}
.ch b{font-family:var(--f-mono);font-size:14px;font-weight:600}
.t-elite{color:var(--spot)} .t-good{color:var(--good)} .t-mid{color:var(--ink)} .t-low{color:var(--muted)}

/* ===== tabs ===== */
.tabs{display:flex;gap:4px;background:var(--wall);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-weight:700;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--spot)}
.tab .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--gel);color:#fff;font-size:11px;line-height:18px}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column}
.yr{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid rgba(61,48,73,.6)}
.yr:last-child{border-bottom:0}
.yr-age{font-family:var(--f-hand);font-size:34px;line-height:.85;color:var(--ink)}
.yr-age small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--dim);margin-top:4px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.yr li{position:relative;padding-left:14px;font-size:14px;color:#ddd5e4;word-break:keep-all;overflow-wrap:anywhere}
.yr li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--dim)}
.yr li.good::before{background:var(--good)} .yr li.bad::before{background:var(--bad)}
.yr li.news{color:var(--muted);font-size:13px}
.yr li.news::before{border-radius:1px;background:var(--gel)}
.yr li.major{color:var(--ink);font-weight:700}
.yr li.major::before{background:var(--spot);box-shadow:0 0 8px var(--spot)}

/* ===== activity cards ===== */
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.act{text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;transition:transform .12s ease,border-color .12s}
.act:hover:not(:disabled){border-color:var(--spot);transform:translateY(-1px)}
.act:disabled{opacity:.42}
.act strong{font-size:15px}
.act p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tags i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:4px;background:#17111c;color:var(--info)}
.tags i.mini{color:var(--gel)}
.act .cost{font-size:12px;color:var(--spot)}

/* ===== generic blocks ===== */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:var(--panel-2);border-radius:8px;padding:10px 12px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{display:block;font-size:15px;word-break:keep-all}
.kv b.num{font-size:21px;line-height:1.2;font-weight:600}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel-2);padding:8px 14px;border-radius:8px;font-size:13.5px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.42}
.btn.warn{border-color:rgba(255,109,109,.5);color:#ffb7b7}
.btn.hot{background:var(--spot);border-color:var(--spot);color:#1a1205}
.btn.hot:hover:not(:disabled){background:var(--spot-hi)}
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.sec-h h4{margin:0;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:.16em;color:var(--muted)}
.sec-h span{font-size:12px;color:var(--dim)}
.empty{color:var(--dim);font-size:13.5px;padding:6px 0}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}

/* band */
.band-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.band-name{font-family:var(--f-disp);font-size:30px;line-height:1.1;word-break:keep-all;overflow-wrap:anywhere}
.band-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
.pill.on{border-color:var(--good);color:var(--good)}
.pill.off{border-color:var(--bad);color:#ffb7b7}
.pill.gold{border-color:var(--spot);color:var(--spot)}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mem{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mem.me{border-color:var(--spot)}
.mem.away{opacity:.55}
.mem-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mem-top b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-top i{font-style:normal;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--gel);flex:none}
.mem small{font-size:12px;color:var(--muted)}
.mini-bar{height:5px;border-radius:3px;background:#0d0a11;overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:3px}
.mem-btns{display:flex;flex-wrap:wrap;gap:6px}
.mem-btns .btn{padding:5px 9px;font-size:12px}
.slots-empty{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--dim);font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* setlist paper — songs */
.paper-list{display:flex;flex-direction:column;gap:6px}
.song{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:6px 12px 6px 10px;box-shadow:0 1px 0 rgba(0,0,0,.4);position:relative}
.song .t{font-family:var(--f-hand);font-size:24px;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .m{font-size:11.5px;color:#5d5568;white-space:nowrap}
.song .g{font-family:var(--f-mono);font-weight:600;font-size:16px;color:var(--paper-ink);min-width:28px;text-align:center}
.song input{width:18px;height:18px;accent-color:#c8323b}
.song.rel{background:#d9d2c3}
.rel-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rel-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rel-top b{font-size:15px}
.rel-top span{font-size:12px;color:var(--muted)}
.rel-songs{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#d7cfde}
.rel-songs span em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--spot);margin-left:4px}
.rank-list{display:flex;flex-direction:column;gap:3px;counter-reset:rk}
.rank-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 8px;border-radius:6px;font-size:13.5px}
.rank-row:nth-child(odd){background:rgba(255,255,255,.025)}
.rank-row b{font-family:var(--f-mono);font-size:15px;color:var(--muted);text-align:right}
.rank-row.me{background:rgba(255,178,63,.12)}
.rank-row.me b,.rank-row.me span{color:var(--spot)}
.rank-row small{font-size:11.5px;color:var(--dim);white-space:nowrap}
.real{color:var(--info);font-size:10px;font-weight:700;letter-spacing:.06em;margin-left:5px}

/* people */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.person .who{min-width:0}
.person .who b{font-size:15px}
.person .who span{font-size:12px;color:var(--muted);margin-left:6px}
.person .mini-bar{max-width:220px;margin-top:5px}
.person .acts-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.person .acts-mini .btn{padding:6px 10px;font-size:12.5px}
@media (max-width:560px){.person{grid-template-columns:1fr}.person .acts-mini{justify-content:flex-start}}

/* economy */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.own-list{display:flex;flex-direction:column;gap:8px}
.own-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);border-radius:10px;padding:10px 12px}
.own-row>div:first-child{min-width:0;flex:1 1 200px}
.own-row b{display:block;font-size:14.5px}
.own-row small{display:block;font-size:12px;color:var(--muted);word-break:keep-all}
.own-btns{display:flex;flex-wrap:wrap;gap:6px}
.own-btns .btn{padding:6px 10px;font-size:12.5px}

/* routine */
.routine{background:#17111c;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.rt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rt-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.rt-slot{display:flex;align-items:center;gap:6px;min-width:0}
.rt-slot span{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--spot);width:14px;flex:none}
.rt-slot select{flex:1;min-width:0;background:var(--wall);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 6px;font:inherit;font-size:13px}
.rt-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rt-presets{display:flex;flex-wrap:wrap;gap:6px}
.rt-presets .btn{padding:6px 10px;font-size:12.5px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--muted);position:relative}
.switch b{color:var(--ink);font-size:15px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:38px;height:22px;border-radius:11px;background:#3a2d47;position:relative;flex:none;transition:background .15s}

const GEAR_CAP=[0,2,4,7];
function cap(s,k){
  const w=INST[s.inst].w[k]??0.04;
  let c=s.pot+(k==='stamina'?2:(w-0.12)*40);
  if(k==='vocal'&&has(s,'voice'))c+=8;
  if(k==='lyric'&&has(s,'poet'))c+=8;
  if(k==='stage'&&has(s,'stagey'))c+=8;
  if(k==='stamina'&&has(s,'iron'))c+=8;
  if(k==='compose'&&has(s,'pitch'))c+=5;
  if(k==='compose'&&has(s,'shy'))c+=6;
  if(k==='tech')c+=GEAR_CAP[s.gear||0];
  if(s.strengths&&s.strengths.includes(k))c+=6;
  return clamp(Math.round(c),25,99);
}

function lf(s,k,d){
  if(k==='insp'&&d>0){if(has(s,'poet'))d*=1.3;if(has(s,'wild'))d*=1.2;}
  if(k==='mental'&&d<0&&has(s,'shy'))d*=1.4;
  if(k==='health'&&d<0&&has(s,'iron'))d*=.7;
  s.life[k]=clamp(s.life[k]+d,0,100);
}
function at(s,k,d){s.attr[k]=clamp(s.attr[k]+d,1,99);}
function tr(s,k,base){
  const c=cap(s,k),v=s.attr[k];
  const room=clamp((c-v)/20,0.05,1.3);
  const am=s.age<13?.9:s.age<23?1.15:s.age<30?.9:s.age<40?.6:.4;
  let g=base*room*am*R(.75,1.25);
  if(has(s,'grinder'))g*=1.3;
  if(has(s,'lazy'))g*=.75;
  if(has(s,'pitch')&&['tech','vocal','rhythm'].includes(k))g*=1.2;
  if(s.life.health<30)g*=.7;
  s.attr[k]=Math.min(99,v+g);
  return g;
}
function boostAll(s,d){for(const k of ATTRS)at(s,k,d*R(.6,1.25));}
const fameIdx=s=>clamp(Math.log10(1+s.fans)*15.5,0,100);
function addFans(s,n){
  n=Math.round(n);
  if(n>0&&has(s,'charisma'))n=Math.round(n*1.4);
  if(n>0)n=Math.round(n/(1+s.fans/2.5e6));
  s.fans=Math.max(0,s.fans+n);s.peakFans=Math.max(s.peakFans||0,s.fans);
  return n;
}
function addRel(s,type,name,bond,age){
  s.flags.relId=(s.flags.relId||0)+1;
  const r={id:s.flags.relId,type,name,bond:clamp(bond,0,100),age:age??s.age};
  s.relations.push(r);return r;
}
const partner=s=>s.relations.find(r=>!r.dead&&(r.type==='연인'||r.type==='배우자'));
const parents=s=>s.relations.filter(r=>!r.dead&&(r.type==='아버지'||r.type==='어머니'));
function log(s,text,tone=''){
  s.log.push({age:s.age,year:s.year,text,tone});
  if(s.log.length>700)s.log.splice(0,s.log.length-700);
}
const famBudget=s=>s.flags.famBudget??0;
const wallet=s=>s.age<19?famBudget(s):s.money;
function spend(s,amt){
  if(amt<=0)return true;
  if(s.age<19){if(famBudget(s)<amt)return false;s.flags.famBudget-=amt;return true;}
  if(s.money<amt)return false;s.money-=amt;return true;
}

const genreOf=s=>s.band?s.band.genre:s.genre;

const demos=s=>s.songs.filter(x=>!x.rid);

function curPlace(s){
  if(s.stage==='army')return {city:'철원',label:s.flags.mband?'군악대 복무':'군 복무'};
  if(['high','college'].includes(s.stage)&&s.school)return {city:s.school.city,label:s.school.name};
  if(s.stage==='musician')return {city:s.flags.base||'서울',label:s.band?`${s.band.name} 합주실`:'작업실'};
  if(s.stage==='kid'||s.stage==='middle')return {city:s.home,label:s.school?.name||'고향'};
  return {city:s.flags.base||s.home,label:s.stage==='retired'?'은퇴 후의 집':'직장 근처'};
}
function trackPlace(s){
  s.places=s.places||[];const p=curPlace(s);const key=p.city+'|'+p.label;
  const last=s.places[s.places.length-1];
  if(!last||last.key!==key)s.places.push({key,city:p.city,label:p.label,age:s.age});
  if(s.places.length>40)s.places.splice(0,s.places.length-40);
}
function mapSVG(s){
  trackPlace(s);
  const land=KOR.map(([lo,la])=>prj(la,lo).join(',')).join(' ');
  const [jx,jy]=prj(33.38,126.55);
  const cur=s.places[s.places.length-1];
  const dots=Object.values(CITY).map(c=>{const [x,y]=prj(...c);return `<circle cx="${x}" cy="${y}" r="1.5" fill="#716582"/>`;}).join('');
  const home=CITY[s.home]?prj(...CITY[s.home]):null;
  let tour='';
  const T=s.lastTour;
  if(T&&s.year-T.year<=1){
    const base=prj(...CITY['서울']);
    const pts=[base,...T.stops.map(n=>CITY[n]?prj(...CITY[n]):ABROAD_PIN[n]).filter(Boolean)];
    tour=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff5a82" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity=".85"/>`+
      T.stops.map(n=>{const p=CITY[n]?prj(...CITY[n]):ABROAD_PIN[n];if(!p)return '';const ab=!CITY[n];return `<rect x="${p[0]-3.5}" y="${p[1]-3.5}" width="7" height="7" rx="1.5" fill="#ff5a82"/>${ab?`<text x="${clamp(p[0],14,226)}" y="${p[1]+(p[1]>200?-7:15)}" font-size="11" fill="#ffb7c8" text-anchor="middle" font-family="IBM Plex Sans KR,sans-serif">${n}</text>`:''}`;}).join('');
  }
  let mark='';
  if(cur&&CITY[cur.city]){const [x,y]=prj(...CITY[cur.city]);mark=`<circle class="pulse" cx="${x}" cy="${y}" r="9" fill="none" stroke="#ffca73" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#ffb23f" stroke="#fff" stroke-width="1.5"/>`;}
  return `<svg class="kmap" viewBox="0 0 240 400" role="img" aria-label="활동 지도">
    <polygon points="${land}" fill="#2c2335" stroke="#5a4870" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="${jx}" cy="${jy}" rx="22" ry="12" fill="#2c2335" stroke="#5a4870" stroke-width="1.5"/>
    ${dots}${tour}
    ${home?`<rect x="${home[0]-4}" y="${home[1]-4}" width="8" height="8" fill="none" stroke="#ffb23f" stroke-width="1.5" transform="rotate(45 ${home[0]} ${home[1]})"/>`:''}
    ${mark}
  </svg>`;
}
function mapPanelHTML(s){

/* ================= new game ================= */
function rollGenetics(){
  const keys=Object.keys(TRAITS),t=[];
  while(t.length<2){
    const k=pick(keys);if(t.includes(k))continue;
    if(CONFLICT.some(([a,b])=>(a===k&&t.includes(b))||(b===k&&t.includes(a))))continue;
    t.push(k);
  }
  let pot=Math.round(gauss(70,9));
  if(t.includes('genius'))pot+=7;if(t.includes('lazy'))pot+=6;
  return {traits:t,pot:clamp(pot,45,97),strengths:[]};
}
const FIRST_INST={vo:'노래방 마이크',gt:'삼촌이 물려준 통기타',ba:'중고 베이스',dr:'드럼 스틱 한 쌍',kb:'거실의 낡은 피아노'};

    age:START_AGE,year:START_YEAR,alive:true,attr:{},life:{happy:74,health:92,mental:62,insp:55,smarts:50},fans:0,peakFans:0,money:0,
    stage:'kid',school:null,band:null,contract:null,songs:[],releases:[],awards:[],relations:[],assets:[],log:[],news:[],
    trend:{},rivals:[],stats:{gigs:0,crowd:0,busk:0,tours:0,fests:0,covers:0},gear:0,
    flags:{yearly:{},relDone:{},famBudget:0,songId:0,relId:0,memId:0,recId:0,rate:1},legacy:0,musHist:[],career2:null,ap:3,apMax:3,
    home:o.home||'서울',look:o.look||randomLook(o.gender),places:[],routine:null,lastTour:null,invest:{dep:0,stock:0}};
  for(const k of ATTRS)s.attr[k]=8+R(0,6)+(INST[s.inst].w[k]||.04)*30;

  s.strengths.forEach(k=>s.attr[k]+=6);
  s.flags.famBudget=has(s,'rich')?3000:500;
  for(const k in GENRES)s.trend[k]=1;
  s.trend.bandpop=1.15;s.trend.modern=1.08;
  s.rivals=RIVALS.map(([n,g])=>({n,g,p:clamp(Math.round(gauss(60,10)),35,88),real:false}))
    .concat(REAL_BANDS.map(([n,g,p])=>({n,g,p,real:true})));
  s.school={name:pick(['햇살','푸른','새솔','다온','한빛','가람','누리'])+'초등학교',city:s.home};
  const dad=koName('m'),mom=koName('f');
  addRel(s,'아버지',dad,RI(60,85),RI(38,46));

  s.musHist.push({age:s.age,o:mus(s)});

const BAND_NAMES=['오후 네 시의 합주실','소란한 고양이','파란 신호등','구름 정거장','시월의 소년','레몬 사이다','밤산책','동네 오케스트라','종이 비행단','여름 정전','형광등 클럽','빈 방','보통의 날들','지붕 위의 개','유성우 예보','낮잠 클럽','모서리','새벽 두 시'];
function makeMember(s,inst,base,ageAround){
  s.flags.memId=(s.flags.memId||0)+1;
  const g=chance(.5)?'m':'f';
  const skill=clamp(Math.round(gauss(base,6)),10,95);
  return {id:s.flags.memId,name:koName(g),gender:g,inst,skill,pot:clamp(skill+RI(4,24),20,99),bond:RI(48,70),
    trait:pick(Object.keys(MTRAITS)),age:Math.max(12,Math.round(ageAround+R(-2,3))),joined:s.year,served:false,army:0};
}
function bandPower(s){
  if(!s.band)return mus(s)*.9;
  const ms=s.band.members.filter(m=>!m.army);
  const arr=[mus(s),...ms.map(m=>m.skill)];
  let p=arr.reduce((a,b)=>a+b,0)/arr.length;
  const have=new Set([s.inst,...ms.map(m=>m.inst)]);
  CORE.forEach(c=>{if(!have.has(c))p-=5;});
  p*=.86+s.band.chem/100*.28;
  return clamp(Math.round(p),1,99);
}
function missingInst(s){
  if(!s.band)return [];
  const have=new Set([s.inst,...s.band.members.map(m=>m.inst)]);
  return CORE.filter(c=>!have.has(c));
}
function memberLeave(s,m,why){
  s.band.members=s.band.members.filter(x=>x.id!==m.id);
  s.band.chem=clamp(s.band.chem-8,0,100);
  s.band.alumni=(s.band.alumni||[]).concat([{name:m.name,inst:m.inst,year:s.year}]);
  log(s,`${INST[m.inst].ko} ${J(m.name,'이/가')} 밴드를 떠났다. ${why||''}`.trim(),'bad');
}
function candPool(s,inst,n){
  const base=clamp(bandPower(s)*.8+fameIdx(s)*.25+(s.age<19?-6:0),14,90);
  return Array.from({length:n},()=>{const m=makeMember(s,inst,base+R(-8,10),s.age<19?s.age:clamp(s.age+R(-4,3),19,60));
    m.fee=s.age<19?0:Math.max(0,Math.round((m.skill-50)*35/10)*10);return m;});
}

function themeHot(s){return s.flags.hotTheme||'청춘';}
function songParts(s,p){
  const G=GENRES[genreOf(s)];
  const have=new Set([s.inst,...(s.band?s.band.members.filter(m=>!m.army).map(m=>m.inst):[])]);
  const fit={mood:G.mood.includes(p.mood),hook:G.hook.includes(p.hook),play:have.has(HOOKS[p.hook]?.inst),hot:p.theme===themeHot(s)};
  return fit;
}
function songQuality(s,p){
  const a=s.attr,f=songParts(s,p);
  let q=a.compose*.34+a.lyric*.22+a.arrange*.2+(s.inst==='vo'?a.vocal:a.tech)*.08+bandPower(s)*.06+s.life.insp*.14;
  if(f.mood)q+=5;if(f.hook)q+=5;q+=f.play?3:-4;if(f.hot)q+=4;
  if(hasItem(s,'home'))q+=3;if(hasItem(s,'studio'))q+=2;
  if(s.life.insp<20)q-=8;
  q+=gauss(0,6);
  return clamp(Math.round(q),5,99);
}
function makeSong(s,p,title){
  s.flags.songId=(s.flags.songId||0)+1;
  const q=songQuality(s,p);
  const catchy=clamp(Math.round(q+(['chant','riff'].includes(p.hook)?6:0)+(p.mood==='bright'?4:0)+R(-6,6)),1,99);
  const depth=clamp(Math.round(q+(s.attr.lyric-50)*.25+(['calm','tender'].includes(p.mood)?4:0)+R(-6,6)),1,99);
  const song={id:s.flags.songId,title:(title||'무제').slice(0,24),genre:genreOf(s),theme:p.theme,mood:p.mood,hook:p.hook,q,catchy,depth,year:s.year,age:s.age,rid:null,peak:null,yr:0,total:0,by:s.band?s.band.name:s.name};
  s.songs.push(song);
  lf(s,'insp',-16);tr(s,'compose',1.4);tr(s,'lyric',1.0);tr(s,'arrange',.6);
  return song;
}

function autoWrite(s){

/* ================= release & chart ================= */
const REL_KO={single:'싱글',ep:'EP',album:'정규 앨범'};
function relCost(s,type,mv){
  if(s.contract)return mv?0:0;
  const base={single:150,ep:600,album:1500}[type];
  return base+(mv?(type==='single'?300:500):0);
}
const promoOf=s=>s.contract?LABELS[s.contract.id].promo:0;
const shareOf=s=>s.contract?LABELS[s.contract.id].share:.9;
function powerToRank(p){const r=Math.round(100-(p-38)*1.75);return r>100?null:Math.max(1,r);}
function releaseNow(s,ids,type,title,mv){
  const songs=ids.map(id=>ownSong(s,id)).filter(Boolean).sort((a,b)=>b.q-a.q);
  s.flags.recId=(s.flags.recId||0)+1;
  const yearRel=s.releases.filter(r=>r.year===s.year).length;
  const L=s.contract?LABELS[s.contract.id]:null;
  const fi=fameIdx(s);
  const shortform=s.flags.shortform===s.year;
  let fans=0,best=null;
  songs.forEach((sg,i)=>{
    const title_=i===0;
    let p=sg.q*.55+fi*.45+(s.trend[sg.genre]-1)*30+promoOf(s)+(mv&&title_?5:0)+({single:0,ep:1,album:3}[type])+gauss(0,6)-yearRel*4-(title_?0:9);
    if(shortform)p+=(sg.catchy-60)*.12;
    p-=Math.max(0,s.age-34)*.6;
    if(s.flags.boom===s.year)p+=3;
    const rank=powerToRank(p);
    const pe=p>95?95+(p-95)*.4:p;
    const st=Math.round(Math.pow(10,pe/15)*12*(title_?1:.55)*R(.85,1.15));
    sg.rid=s.flags.recId;sg.peak=rank;sg.yr+=st;sg.total+=st;sg.relYear=s.year;
    fans+=st*.004;
    if(!best||(rank&&(!best.peak||rank<best.peak)))best=sg;
  });
  let review=null;
  if(type!=='single'){
    const avg=songs.reduce((a,b)=>a+b.depth*.6+b.q*.4,0)/songs.length;
    const coh=songs.filter(x=>x.genre===songs[0].genre).length/songs.length;
    review=clamp(Math.round(((avg-28)/12+coh*.6+(type==='album'?.3:0))*2)/2,1,5);
  }
  const rel={id:s.flags.recId,type,title:title||songs[0].title,year:s.year,age:s.age,songs:songs.map(x=>x.id),peak:best?.peak??null,review,mv:!!mv,label:L?L.name:'자체 제작',by:bandName(s)};
  s.releases.push(rel);
  const gained=addFans(s,fans+(review?Math.min(review*review*s.fans*.003,60000):0));
  const pk=rel.peak;
  const hits=s.flags.hits||0;
  if(pk===1){s.legacy+=hits?4:12;}else if(pk&&pk<=10)s.legacy+=hits>3?2:5;else if(pk&&pk<=50)s.legacy+=1.5;
  if(pk&&pk<=10)s.flags.hits=hits+1;
  if(review>=4.5)s.legacy+=6;else if(review>=4)s.legacy+=3;
  if(type==='album')s.legacy+=2;
  lf(s,'happy',pk&&pk<=20?10:4);lf(s,'insp',4);
  if(s.band)s.band.members.forEach(m=>m.bond=clamp(m.bond+(pk&&pk<=30?6:2),0,100));
  log(s,`${REL_KO[type]} 『${rel.title}』 발매. ${pk?`타이틀곡 「${best.title}」 차트 최고 ${pk}위.`:'차트 진입은 못 했다.'}${review?` 평론 ${review}점.`:''}`,pk&&pk<=10?'major':pk?'good':'');
  if(pk&&pk<=10)pushNews(s,`${bandName(s)} 「${best.title}」 ${pk}위… ${pk===1?'정상에 올랐다':'밴드 씬 새 얼굴'}`);
  return {rel,best,gained};
}
function releaseResultBody(s,r){
  const {rel,best,gained}=r;
  const rows=rel.songs.map(id=>ownSong(s,id));
  return `<div class="gig-board"><div class="gig-top"><div class="venue">『${esc(rel.title)}』</div><span class="cap">${REL_KO[rel.type]} · ${esc(rel.label)}</span></div>
    <div class="chart-res"><span class="rk">${rel.peak?rel.peak:'—'}<small>${rel.peak?'위':'차트 아웃'}</small></span><span class="sb-note">타이틀곡 「${esc(best.title)}」 첫 주 최고 순위</span></div>
    <div class="gig-stats"><div><b>${fmtN(rows.reduce((a,b)=>a+b.yr,0))}</b><span>첫 해 스트리밍</span></div><div><b>+${fmtN(gained)}</b><span>새 팬</span></div><div><b>${rel.review?rel.review.toFixed(1):'—'}</b><span>평론</span></div><div><b>${rows.length}</b><span>수록곡</span></div></div>
    ${rel.review?`<div class="review">${'★'.repeat(Math.floor(rel.review))}${rel.review%1?'½':''}</div>`:''}</div>
    <div class="paper-list">${rows.map(x=>`<div class="song rel"><span class="g">${gradeQ(x.q)}</span><span class="t">${esc(x.title)}</span><span class="m">${x.peak?x.peak+'위':'차트 밖'}</span></div>`).join('')}</div>`;
}
function releaseSpec(s,type,mv){
  const sel=UI.relSel.map(id=>ownSong(s,id)).filter(x=>x&&!x.rid);
  const title=($('#relTitle')?.value||'').trim();
  const cost=relCost(s,type,mv);
  if(!spend(s,cost))return null;
  s.ap=Math.max(0,s.ap-1);
  const r=releaseNow(s,sel.map(x=>x.id),type,title||sel.sort((a,b)=>b.q-a.q)[0].title,mv);
  UI.relSel=[];
  return {kicker:`${s.year} · 발매 첫 주`,title:`${REL_KO[type]} 발매`,body:releaseResultBody(s,r),choices:[{label:'계속',primary:true,act:()=>null}]};
}
function autoRelease(s){
  if(s.age<15||!musicOn(s))return;
  const d=demos(s).sort((a,b)=>b.q-a.q);if(!d.length)return;
  const lastAlbum=Math.max(-99,...s.releases.filter(r=>r.type==='album').map(r=>r.year));
  let type=null,pickIds=[];
  if(d.length>=7&&s.year-lastAlbum>=2){type='album';pickIds=d.slice(0,10).map(x=>x.id);}
  else if(d.length>=4){type='ep';pickIds=d.slice(0,5).map(x=>x.id);}
  else if(!s.releases.some(r=>r.year===s.year)&&d[0].q>=Math.max(35,(s.releases.length?55:0))){type='single';pickIds=[d[0].id];}
  if(!type)return;
  const cost=relCost(s,type,false);if(wallet(s)<cost+(s.age>=19?500:0))return;
  spend(s,cost);
  releaseNow(s,pickIds,type,ownSong(s,pickIds[0]).title,false);
}
function catalogYear(s){
  // 올해 스트리밍 정산 → 다음 해 스트리밍 예상치로 굴린다
  const rel=s.songs.filter(x=>x.rid);
  if(!rel.length)return;
  const sum=rel.reduce((a,b)=>a+b.yr,0);
  const mine=rel.filter(x=>!x.sold).reduce((a,b)=>a+b.yr,0);
  const pay=Math.round(mine*.0004*shareOf(s)*(s.flags.rate||1));
  if(pay>=1){s.money+=pay;s.flags.lastRoyalty=pay;if(pay>=300)log(s,`음원 수익 정산 ${fmtMoney(pay)} (올해 스트리밍 ${fmtN(sum)}회).`);}
  rel.forEach(x=>{
    let n=x.yr*R(.35,.5);
    if(x.q>=58&&s.year-x.relYear>=2&&chance(.012+(s.flags.shortform===s.year?.02:0))){
      n=Math.max(n,Math.pow(10,(x.q*.6+fameIdx(s)*.4+8)/15)*12*R(.8,1.3));
      const rk=powerToRank(x.q*.6+fameIdx(s)*.4+10);
      if(rk&&(!x.peak||rk<x.peak))x.peak=rk;
      addFans(s,n*.004);s.legacy+=4;lf(s,'happy',8);
      log(s,`${x.relYear}년에 낸 「${x.title}」이(가) 숏폼에서 퍼지며 역주행했다.${rk?` 차트 ${rk}위.`:''}`,'major');
      pushNews(s,`${bandName(s)} 「${x.title}」 역주행… 발매 ${s.year-x.relYear}년 만`);
    }
    x.yr=Math.round(n);x.total+=x.yr;
  });
}
function rankings(s){
  const me=fameIdx(s)*.85+(()=>{const r=s.releases.filter(x=>x.year>=s.year-1&&x.peak);return r.length?(101-Math.min(...r.map(x=>x.peak)))*.14:0;})();
  const rows=s.rivals.map(r=>({n:r.n,g:r.g,p:r.p,real:r.real}));
  if(s.band||s.releases.length)rows.push({n:bandName(s),g:genreOf(s),p:me,me:true});
  return rows.sort((a,b)=>b.p-a.p);
}

const ARMY_OK=['practice','rest','study','write','vocal','health'];
function actAvailable(s,a){
  if(a.band&&!bandOn(s))return false;
  if(a.stages&&!a.stages.includes(s.stage))return false;
  if(s.stage==='army'&&(!ARMY_OK.includes(a.id)||(a.id==='practice'&&!s.flags.mband)))return false;
  if(a.minAge&&s.age<a.minAge)return false;
  if(a.maxAge&&s.age>a.maxAge)return false;
  if(a.cond&&!a.cond(s))return false;
  return true;
}

/* ================= live shows ================= */
function pickShow(s,small){
  const g=genreOf(s);
  if(!small){
    const fs=FESTS.filter(f=>s.fans>=f.fans*.5&&f.gen.includes(g)&&!(f.abroad&&s.age<18));
    if(fs.length&&chance(.6)){
      const f=fs[fs.length-1],ratio=s.fans/f.fans;
      const slot=ratio>=12?'헤드라이너':ratio>=3?'서브 헤드라이너':'낮 무대';
      const crowd=Math.round((slot==='헤드라이너'?35000:slot==='서브 헤드라이너'?14000:3000)*R(.8,1.15));
      const fee=({'낮 무대':150,'서브 헤드라이너':1200,'헤드라이너':7000}[slot])*(f.abroad?2:1);
      return {kind:'fest',name:f.n,city:f.city,abroad:f.abroad,slot,crowd,cap:crowd,fee,tier:VENUES.length};
    }
    if(inSchool(s)&&s.fans<400)return {kind:'school',name:`${s.school?.name||'학교'} 축제`,crowd:RI(150,400),cap:400,price:0,tier:1};
  }
  let ti=0;VENUES.forEach((x,i)=>{if(s.fans>=x.fans)ti=i;});
  if(small)ti=Math.max(0,Math.min(ti,3));
  const v=VENUES[ti];
  const demand=Math.round(s.fans*R(.1,.16)*(small?.6:1)+R(12,40));
  return {kind:'venue',name:v.n,cap:v.cap,crowd:Math.min(v.cap,demand),price:v.price,tier:ti};
}
function showBoard(show,res){
  const sold=res?res.crowd:show.crowd;
  return `<div class="gig-board"><div class="gig-top"><div class="venue">${esc(show.name)}</div><span class="cap">${show.kind==='fest'?`${esc(show.slot)} · ${esc(show.abroad||show.city)}`:`수용 ${show.cap.toLocaleString('ko-KR')}석`}</span></div>
    ${res?`<div class="gig-stats"><div><b>${fmtN(sold)}</b><span>관객</span></div><div><b>+${fmtN(res.fans)}</b><span>새 팬</span></div><div><b>${res.money?fmtMoney(res.money).replace(' 원',''):'0'}</b><span>수익</span></div><div><b>${Math.round(res.score*100)}%</b><span>판정</span></div></div>`
      :`<div class="sb-note">예상 관객 ${fmtN(sold)}명${show.kind==='fest'?` · 출연료 ${fmtMoney(show.fee)}`:show.price?` · 티켓 ${show.price}만 원`:''}</div>`}
    ${res&&res.tags.length?`<div class="gig-awards">${res.tags.map(t=>`<i>${esc(t)}</i>`).join('')}</div>`:''}</div>`;
}
function rgWindow(s){
  let w=118+(s.attr.stage-50)*.5+(s.attr.rhythm-50)*.6+(s.gear||0)*5;
  if(has(s,'stagey'))w+=25;if(has(s,'shy'))w-=25;if(s.life.mental<30)w-=15;
  return clamp(Math.round(w),70,195);
}
function autoP(s){return clamp(.28+(mus(s)-50)*.012+(s.attr.stage-50)*.006+(s.band?(s.band.chem-50)*.003:0)+(has(s,'stagey')?.06:0)-(has(s,'shy')?.08:0),.08,.93);}
function autoScore(s){return clamp(gauss(autoP(s)*.9+.08,.12),.05,.99);}
function liveCfg(s,show,song,small){
  return {kicker:`${show.name} · LIVE`,title:song?`「${song.title}」`:'떼창 커버곡',board:showBoard(show),
    notes:small?8:11+Math.min(show.tier||0,7),bpm:song?GENRES[song.genre].bpm:122,win:rgWindow(s),p:autoP(s),
    hint:'노트가 노란 선에 닿을 때 누르기 · 스페이스바 또는 트랙을 탭',
    done:(q,score)=>{const r=liveResolve(s,show,song,score,small);return {text:r.text,board:showBoard(show,r),nolog:1};}};
}
function liveResolve(s,show,song,score,small){
  const bp=bandPower(s)/100,st=s.attr.stage/100;
  const perf=clamp(score*.55+bp*.3+st*.15,0,1);
  const crowd=show.crowd;
  const fanMul=show.kind==='fest'?1.6:show.kind==='school'?.6:small?.7:1;
  const sq=song?song.q/100:.45;
  const fans=addFans(s,crowd*(.04+perf*.22)*fanMul*(song?(.6+sq*.8):.7)+3);
  let money=0;
  if(show.kind==='fest')money=show.fee;
  else if(show.kind==='venue')money=Math.round(crowd*show.price*(s.contract?.4:.6)*(.7+perf*.5));
  if(s.band&&s.band.members.length)money=Math.round(money/(s.band.members.length+1)*1.6);
  earn(s,money);
  s.stats.gigs++;s.stats.crowd+=crowd;
  const tags=[];
  if(show.kind==='fest'){s.stats.fests++;if(show.slot==='헤드라이너'){s.legacy+=s.flags.headlined?3:10;s.flags.headlined=1;tags.push('헤드라이너');}else if(show.slot==='서브 헤드라이너'){s.legacy+=2;tags.push('서브 헤드라이너');}else s.legacy+=.5;}
  if(show.name==='KSPO DOME'&&!s.flags.kspo){s.flags.kspo=1;s.legacy+=8;tags.push('첫 체조경기장');}
  if(show.name==='고척스카이돔'&&!s.flags.dome){s.flags.dome=1;s.legacy+=12;tags.push('첫 돔 공연');}
  if(!small&&show.kind==='venue'&&crowd>=show.cap&&show.cap>=700){tags.push('전석 매진');s.legacy+=1;}
  lf(s,'mental',(perf-.5)*16);lf(s,'happy',perf*8);lf(s,'health',-3);lf(s,'insp',3);tr(s,'stage',small?.8:1.4);
  if(s.band)s.band.members.forEach(m=>m.bond=clamp(m.bond+(perf-.45)*12,0,100));
  if(score>=.9&&chance(.35)){const v=addFans(s,Math.min(s.fans*.05,30000)+200);tags.push('직캠 바이럴');log(s,`${show.name} 무대 직캠이 퍼졌다. 팬 ${fmtN(v)}명 증가.`,'good');}
  const rx=perf>=.8?'앵콜 함성이 그치지 않았다.':perf>=.62?'관객들이 끝까지 뛰었다. 좋은 공연이었다.':perf>=.45?'무난한 공연. 몇 군데 박자가 흔들렸다.':'실수가 이어졌다. 대기실이 조용했다.';
  const txt=`${show.name}${show.kind==='fest'?` ${show.slot}`:''}. ${song?`하이라이트 「${song.title}」. `:''}${rx}`;
  log(s,`${txt} 관객 ${fmtN(crowd)}명, 팬 +${fmtN(fans)}.`,show.kind==='fest'&&show.slot!=='낮 무대'||tags.some(t=>t.startsWith('첫'))?'major':perf>=.62?'good':perf<.45?'bad':'');
  s.flags.lastGig={name:show.name,year:s.year};
  return {text:txt,fans,money,crowd,score,tags};
}
function liveIntro(s){
  if(!musicOn(s)||s.age<14)return null;
  const show=pickShow(s);
  const songs=s.songs.slice().sort((a,b)=>b.q-a.q).slice(0,5);
  const top=songs.slice(0,3);
  const auto=()=>{const r=liveResolve(s,show,top[0]||null,autoScore(s));return {text:r.text,nolog:1};};
  if(s.flags.noLive===s.year)return null;
  if(s.routine?.on&&s.routine.liveAuto&&!UI.skip){const r=auto();toast('올해의 무대 · 자동',r.text,'');return null;}
  return {kicker:`${s.year} · 올해의 무대`,title:show.kind==='fest'?`페스티벌 ${show.slot} 섭외`:show.kind==='school'?'학교 축제 무대':`${bandName(s)} 단독 공연`,board:showBoard(show),
    body:`${songs.length?`<div class="setlist"><small>SETLIST · ${esc(bandName(s))}</small><ol>${songs.map(x=>`<li>${esc(x.title)}</li>`).join('')}</ol></div>`:'<p>아직 우리 곡이 없다. 커버곡으로 무대를 채운다.</p>'}
      <p class="sb-note">하이라이트 곡을 골라 직접 연주한다. 곡의 완성도가 높을수록 팬이 많이 늘고, BPM이 빠를수록 노트가 촘촘하다.</p>`,
    choices:[...top.map(x=>({label:`「${x.title}」`,sub:`${GENRES[x.genre].ko} · BPM ${GENRES[x.genre].bpm} · 완성도 ${gradeQ(x.q)}${x.rid?'':' · 미발매 신곡'}`,tag:gradeQ(x.q),act:()=>({rhythm:liveCfg(s,show,x)})})),
      {label:'떼창 커버곡',sub:'익숙한 노래라 분위기는 잡히지만 팬은 덜 는다',act:()=>({rhythm:liveCfg(s,show,null)})}],
    auto};
}
function gigSpec(s){
  const show=pickShow(s,true);
  const top=s.songs.slice().sort((a,b)=>b.q-a.q)[0]||null;
  return {kicker:`${s.year} · 클럽 공연`,title:show.name,board:showBoard(show),body:`<p>${top?`오늘의 마지막 곡은 「${esc(top.title)}」.`:'커버곡 세 곡으로 짧은 무대를 채운다.'}</p>`,
    choices:[{label:'무대에 오른다',primary:true,act:()=>({rhythm:liveCfg(s,show,top,true)})}],
    auto:()=>{const r=liveResolve(s,show,top,autoScore(s),true);return {text:r.text,nolog:1};}};
}

/* ================= tours ================= */
function tourCost(s,T){return Math.round(T.cost*(hasItem(s,'van')?.75:1)*(s.contract?.5:1));}
function tourGate(s,k){
  const T=TOURS[k];
  if(!bandOn(s)&&s.stage!=='musician')return '활동 중일 때만';
  if(s.age<18)return '18세 이상';
  if(s.flags.noLive===s.year)return '올해는 공연이 모두 중단됐다';
  if(s.fans<T.min)return `팬 ${fmtN(T.min)}명 필요`;
  if(s.flags.yearly.tour)return '올해 이미 투어를 돌았다';
  if(s.ap<T.ap)return `행동 ${T.ap} 필요`;
  if(wallet(s)<tourCost(s,T))return `경비 ${fmtMoney(tourCost(s,T))} 필요`;
  return '';
}
function tourSpec(s,k){
  const T=TOURS[k];const cost=tourCost(s,T);
  return {kicker:`${s.year} · 투어 기획`,title:T.n,
    body:`<p>${(T.cities||T.abroad).join(' → ')}</p><p class="sb-note">경비 ${fmtMoney(cost)} · 행동 ${T.ap} 소모 · 체력이 크게 깎인다. 관객 수는 팬 규모와 운에 달렸다.</p>`,
    choices:[{label:'투어를 떠난다',primary:true,act:()=>runTour(s,k)},{label:'다음에',act:()=>null}]};
}
function runTour(s,k){
  const T=TOURS[k];const cost=tourCost(s,T);
  if(!spend(s,cost))return '경비가 모자라다.';
  s.ap-=T.ap;s.flags.yearly.tour=1;
  const stops=(T.cities||T.abroad).slice();
  const capPer=k==='club'?600:k==='asia'?3000:k==='world'?12000:9000;
  let att=0;const rows=stops.map(n=>{const a=Math.round(Math.min(capPer,s.fans*T.fill*R(.55,1.25)+R(40,120)));att+=a;return [n,a];});
  const perf=clamp(bandPower(s)/100*.6+s.attr.stage/100*.4+R(-.1,.1),0,1);
  const gross=Math.round(att*T.price*(s.contract?.45:.65));
  earn(s,gross);
  const fans=addFans(s,att*(.12+perf*.2)*(T.abroad?1.4:1));
  s.stats.tours++;s.stats.crowd+=att;s.stats.gigs+=stops.length;
  const tk='tour_'+k;s.legacy+={club:1.5,arena:5,asia:4,world:10}[k]*(s.flags[tk]?.3:1);s.flags[tk]=1;
  lf(s,'health',-10);lf(s,'happy',6);lf(s,'insp',8);tr(s,'stage',2);tr(s,'stamina',1.2);
  if(s.band){s.band.chem=clamp(s.band.chem+(perf>.55?5:-6),0,100);s.band.members.forEach(m=>m.bond=clamp(m.bond+(perf>.55?4:-5),0,100));}
  s.lastTour={year:s.year,name:T.n,stops};
  const net=gross-cost;
  log(s,`${T.n} (${stops.join(', ')}) 완주. 관객 ${fmtN(att)}명, 순수익 ${fmtMoney(net)}.`,'major');
  return {text:`${stops.length}개 도시, 관객 ${fmtN(att)}명. ${net>=0?`순수익 ${fmtMoney(net)}.`:`적자 ${fmtMoney(-net)}. 그래도 팬은 늘었다.`} 새 팬 ${fmtN(fans)}명.`,nolog:1,
    board:`<div class="gig-board"><div class="gig-top"><div class="venue">${esc(T.n)}</div><span class="cap">${stops.length} CITIES</span></div>
      <div class="gig-stats" style="grid-template-columns:repeat(${Math.min(rows.length,3)},minmax(0,1fr))">${rows.map(([n,a])=>`<div><b>${fmtN(a)}</b><span>${esc(n)}</span></div>`).join('')}</div></div>`};
}

/* ================= labels ================= */
function makeOffer(s,id,resign){
  const L=LABELS[id];
  const adv=Math.round(R(L.adv[0],L.adv[1])*(.7+fameIdx(s)/150)*(resign?1.15:1)/10)*10;
  return {id,adv,years:RI(2,4),resign:!!resign};
}
function genOffers(s){
  const ok=Object.keys(LABELS).filter(id=>s.fans>=LABELS[id].min*R(.75,1.1)&&!(LABELS[id].abroad&&s.age<20));
  return shuffle(ok).sort((a,b)=>LABELS[b].tier-LABELS[a].tier).slice(0,3).map(id=>makeOffer(s,id));
}
function signLabel(s,o){
  const L=LABELS[o.id];
  s.contract={id:o.id,years:o.years,adv:o.adv,since:s.year};
  const got=earn(s,o.adv);
  lf(s,'happy',8);if(L.tier===3)s.legacy+=2;

  return `${L.name}. 사무실 벽에 우리 밴드 포스터가 붙었다.${L.control?' 다만 첫 미팅부터 콘셉트 회의가 길었다.':''}`;
}
function offerSpec(s,offers,why){
  const head=why==='expire'?'레이블 계약이 끝났다.':why==='pitch'?'데모를 들은 레이블에서 연락이 왔다.':'레이블들이 연락해 왔다.';
  return {kicker:`${s.year} · 레이블`,title:why==='expire'?'재계약 시즌':'계약 제안',
    body:`<p>${head}</p><p class="sb-note">수익 배분은 음원·공연 수익 중 우리 몫. 홍보력이 높을수록 차트 성적이 오른다. 계약하면 녹음·뮤직비디오 비용은 레이블이 낸다.</p>`,
    choices:[...offers.map(o=>{const L=LABELS[o.id];return {label:`${L.name}${o.resign?' · 재계약':''}`,
      sub:`계약금 ${fmtMoney(o.adv)} · ${o.years}년 · 우리 몫 ${Math.round(L.share*100)}% · 홍보력 ${'●'.repeat(L.tier)}${'○'.repeat(3-L.tier)}${L.control?' · 콘셉트 간섭':''}${L.abroad?` · ${L.abroad} 진출`:''}`,
      act:()=>signLabel(s,o)};}),

function pitchChance(s,id){
  const L=LABELS[id];const best=Math.max(0,...s.songs.map(x=>x.q));

function pitchSpec(s){

function newsYear(s,quiet){
  for(const g in s.trend)s.trend[g]=clamp(s.trend[g]*R(.9,1.1)+(1-s.trend[g])*.12,.65,1.6);
  s.flags.hotTheme=pick(Object.keys(THEMES));
  s.rivals.forEach(r=>{r.p=clamp(r.p+(r.real?(s.year>2029?-R(.4,2):R(-1,1)):gauss(0,3)+(s.trend[r.g]-1)*4),20,99);});
  const top=Object.keys(s.trend).sort((a,b)=>s.trend[b]-s.trend[a])[0];
  if(top!==s.flags.topGenre){s.flags.topGenre=top;pushNews(s,`올해 음원 차트는 ${GENRES[top].ko} 강세`);}
  const fict=s.rivals.filter(r=>!r.real);
  if(chance(.85))pushNews(s,pick(NEWS_RIVAL)(pick(fict).n));
  if(chance(.5))pushNews(s,pick(NEWS_IND));
  const dead=fict.find(r=>r.p<28);
  if(dead){const used=new Set(s.rivals.map(r=>r.n));const pool=['파란 수요일','금요일 밤 셔틀','하울링 키즈','두 번째 여름','먼지 낀 별','깊은 우물','펭귄 레코드','도시 정전','은하 철도 클럽','새벽 세 시 반'].filter(n=>!used.has(n));
    pushNews(s,`${dead.n}, 해체 발표`);if(pool.length){dead.n=pick(pool);dead.p=RI(45,62);dead.g=pick(Object.keys(GENRES));pushNews(s,`신인 밴드 ${dead.n} 데뷔`);}}
  if(s.year<=START_YEAR+1||!chance(.14))return null;
  const ev=pick(BIG_NEWS.filter(b=>!b.cond||b.cond(s)));
  if(!ev)return null;
  ev.apply(s);
  const extra=s.flags.tmpNews||'';s.flags.tmpNews='';

  return {kicker:`${s.year} · 뉴스 속보`,title:ev.title,body:`<p>${ev.body}</p>${extra?`<p>${extra}</p>`:''}`,choices:[{label:'확인',primary:true,act:()=>null}]};

/* ================= awards ================= */
function awardsCheck(s,yr){
  const rels=s.releases.filter(r=>r.year===yr);if(!rels.length)return [];
  const out=[];const songs=rels.flatMap(r=>r.songs.map(id=>ownSong(s,id))).filter(Boolean);
  const best=songs.slice().sort((a,b)=>b.q-a.q)[0];
  const pk=Math.min(...songs.map(x=>x.peak||999));
  const first=!s.releases.some(r=>r.year<yr);
  if(first&&(best.q>=62||pk<=40)&&chance(.45+(best.q-62)*.02))out.push({key:'rookie',name:`${yr} 올해의 신인`,leg:6});
  if(best.q>=78&&chance(clamp((best.q-74)*.05,.05,.7)))out.push({key:'song',name:`${yr} 올해의 노래 「${best.title}」`,leg:10});
  rels.filter(r=>r.review>=4&&r.type!=='single').forEach(r=>{if(chance((r.review-3.6)*.8))out.push({key:'album',name:`${yr} 올해의 앨범 『${r.title}』`,leg:12});});
  if((pk===1||(s.fans>=150000&&pk<=5))&&chance(.5))out.push({key:'artist',name:`${yr} 올해의 아티스트`,leg:14});
  return out;
}
function awardsSpec(s,list,yr){
  list.forEach(a=>{const rep=s.awards.filter(x=>x.key===a.key).length;s.awards.push({year:yr,key:a.key,name:a.name});s.legacy+=a.leg*(rep?rep>=3?.3:.5:1);});
  log(s,`밴드 뮤직 어워즈 ${list.map(a=>a.name.replace(/^\d+ /,'')).join(', ')} 수상.`,'major');
  lf(s,'happy',12);lf(s,'mental',6);
  return {kicker:`${yr} 밴드 뮤직 어워즈`,title:list.length>1?`${list.length}관왕`:'수상',
    body:`<div class="gig-awards" style="margin-bottom:10px">${list.map(a=>`<i>${esc(a.name)}</i>`).join('')}</div><p>무대 조명이 이쪽을 비췄다. 트로피가 생각보다 무겁다. 마이크 앞에서 무슨 말을 할까.</p>`,
    choices:[{label:'멤버들에게 공을 돌린다',act:()=>{if(s.band)s.band.members.forEach(m=>m.bond=clamp(m.bond+8,0,100));return '"이 상은 합주실 형광등 아래서 같이 버틴 우리 거예요."';}},

function eligible(s,e){
  if(e.once&&s.flags['ev_'+e.id])return false;
  if(e.age&&(s.age<e.age[0]||s.age>e.age[1]))return false;
  if(e.stages&&!e.stages.includes(s.stage))return false;
  if(s.stage==='army'&&!['crush','parents_ill','enlist_think','trip','cat'].includes(e.id))return false;
  try{if(e.cond&&!e.cond(s))return false;}catch(err){return false;}
  return true;
}
function pickEvents(s,n){
  const pool=EVENTS.filter(e=>eligible(s,e)),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,e)=>a+(e.w||1),0);let r=rnd()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w||1;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
function eventSpec(s,e){
  if(!eligible(s,e))return null;
  if(e.pre)e.pre(s);
  if(e.once)s.flags['ev_'+e.id]=1;
  return {kicker:`${s.year} · ${s.age}세`,title:e.title,body:`<p>${typeof e.body==='function'?e.body(s):e.body}</p>`,
    choices:e.choices.map(c=>({label:c.t,sub:c.sub,disabled:!!(c.cond&&!c.cond(s)),reason:c.sub,act:()=>c.f(s)}))};
}

function moveAway(s,city){if(city&&city!==s.home){lf(s,'happy',-3);parents(s).forEach(p=>p.bond=clamp(p.bond-4,0,100));return ' 고향을 떠나 자취를 시작했다.';}return '';}
function highSpec(s){
  const m=mus(s);
  const req={normal:[0,0],music:[26,200],art:[32,400]};
  const KD={normal:'일반고 밴드부. 공부와 병행',music:'실용음악 특성화고. 연습 시간이 두 배',art:'예술고. 무대 경험이 많다'};
  const rows=HIGHS.slice().sort((a,b)=>(b[1]===s.home)-(a[1]===s.home)||(b[2]!=='normal')-(a[2]!=='normal'));
  return {kicker:`${s.year} · 고등학교 진학`,title:'어느 고등학교로 갈까',
    body:`<p>전국 어디든 지원할 수 있다. 실용음악고와 예술고는 실기 기준(음악성)과 등록금이 있다. 지금 음악성 <b class="num">${m}</b>.</p>`,
    choices:rows.map(([n,c,k])=>{const [cut,fee]=req[k];const ok=m>=cut&&famBudget(s)>=fee;
      return {label:n,sub:`${c}${c===s.home?' · 고향':''} · ${KD[k]}${fee?` · 등록금 ${fmtMoney(fee)}`:''}`,disabled:!ok,reason:`${c} · ${m<cut?`음악성 ${cut} 필요`:`등록금 ${fmtMoney(fee)} 필요`}`,
        act:()=>{spend(s,fee);s.school={name:n,city:c,kind:k};s.stage='high';const mv=moveAway(s,c);
          if(k!=='normal')s.flags.musicHigh=1;log(s,`${n} 입학.${mv}`,'major');
          if(s.band&&c!==s.home&&chance(.5)){const ms=s.band.members.slice();ms.forEach(x=>{if(chance(.6))memberLeave(s,x,'학교가 갈리면서.');});}
          return `${n}.${mv}${k!=='normal'?' 복도마다 누군가 연습하는 소리가 들린다.':''}`;}};})};
}
function crossroadSpec(s){

        act:()=>({rhythm:{kicker:`${n} · 실기 시험`,title:'실기 시험',notes:12,bpm:GENRES[genreOf(s)].bpm,win:rgWindow(s),p:autoP(s),body:'심사위원 셋. 지정곡 한 곡, 자유곡 한 곡.',
          done:(q,sc)=>{const pts=m+sc*16-8;

}
function skipSlots(s){
  if(s.stage==='army')return s.flags.mband?['practice','write']:['rest','study'];
  if(s.age<13)return ['practice','dig','rest'];
  if(['civil','retired'].includes(s.stage))return bandOn(s)?['jam','practice','rest']:['rest','dig','practice'];
  if(bandOn(s))return ['write','jam','practice','gig','write'];
  return ['practice','write','dig','busk','rest'];
}
function autoResolve(spec){
  if(spec.auto){let r;try{r=spec.auto();}catch(e){console.error(e);r=null;}return absorb(spec,r);}
  const ch=spec.choices.filter(c=>!c.disabled);
  if(ch.length!==1)return false;
  let r;try{r=ch[0].act();}catch(e){console.error(e);r=null;}
  return absorb(spec,r);
}
function absorb(spec,r){
  if(r==null)return true;
  if(typeof r==='string'){log(S,`${spec.title}: ${r}`);return true;}
  if(r.rhythm){const c=r.rhythm;let rr;try{rr=c.done(chance(c.p??.5)?'good':'miss',clamp(gauss((c.p??.5),.12),0,1),true);}catch(e){console.error(e);rr=null;}return absorb(c,rr);}
  if(r.spec){queue.unshift(()=>r.spec);return true;}
  if(r.text){if(!r.nolog)log(S,`${spec.title}: ${r.text}`);if(r.next)queue.unshift(()=>r.next);return true;}
  return true;
}
function skipSummarySpec(s,st,why){
  const yrs=s.age-st.age;
  const aw=s.awards.filter(a=>a.year>=st.year).map(a=>a.name);
  const majors=s.log.filter(e=>e.year>=st.year&&e.tone==='major').slice(-12);
  const d=(a,b,f=x=>Math.round(x))=>`<b class="num">${f(a)} → ${f(b)}</b>`;
  return {kicker:`${yrs}년 건너뛰기 · ${st.year} → ${s.year}`,title:why==='decision'?'중요한 결정 앞에서 멈췄다':'건너뛰기 완료',
    body:`<div class="kv" style="margin-bottom:10px"><div><span>나이</span>${d(st.age,s.age)}</div><div><span>음악성</span>${d(st.o,mus(s))}</div>
      <div><span>팬</span>${d(st.fans,s.fans,fmtN)}</div><div><span>순자산</span><b class="num">${fmtMoney(st.money).replace(' 원','')} → ${fmtMoney(netWorth(s)).replace(' 원','')}</b></div></div>
      ${aw.length?`<div class="gig-awards" style="margin-bottom:10px">${aw.map(a=>`<i>${esc(a)}</i>`).join('')}</div>`:''}
      ${majors.length?`<div class="feed">${majors.map(e=>`<div class="yr" style="padding:6px 0"><div class="yr-age" style="font-size:26px">${e.age}세</div><ul><li class="major">${esc(e.text)}</li></ul></div>`).join('')}</div>`:'<p class="sb-note">큰 사건 없이 시간이 흘렀다.</p>'}`,
    choices:[{label:'계속',primary:true,act:()=>null}]};
}

function slotLabel(d){if(!d||!d.S)return '빈 슬롯';const s=d.S;return `${s.name} · ${s.age}세 · ${s.alive?(s.band&&!s.band.disbanded?s.band.name:STAGE_KO[s.stage]):'생애 종료'}`;}

function exportCode(st){return 'ENC1:'+btoa(unescape(encodeURIComponent(JSON.stringify(st))));}
function importCode(t){t=(t||'').trim().replace(/\s+/g,'');if(!t.startsWith('ENC1:'))throw new Error('형식');const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));if(!o||!o.name||!o.attr||!o.life)throw new Error('내용');return o;}
function loadState(o,from){S=o;queue=[];UI.skip=null;UI.tab='feed';closeModal();save();render();toast('불러오기',`${from}: ${o.name} · ${o.age}세 시점으로 돌아왔다.`,'');}

const SNAP_LIFE={happy:'행복',health:'건강',mental:'멘탈',insp:'영감',smarts:'학업'};
function snap(s){const o={'음악성':mus(s),'팬':s.fans};for(const k in SNAP_LIFE)o[SNAP_LIFE[k]]=s.life[k];for(const k of ATTRS)o[ATTR_KO[k]]=s.attr[k];o['돈']=s.money;o['가족 예산']=famBudget(s);if(s.band)o['밴드 합']=s.band.chem;return o;}
function deltas(a,b){
  const out=[];
  for(const k in a){
    if(!(k in b))continue;
    const d=b[k]-a[k];
    if(k==='돈'||k==='가족 예산'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">${k} ${d>0?'+':'-'}${fmtMoney(Math.abs(d))}</i>`);continue;}
    if(k==='팬'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">팬 ${d>0?'+':'-'}${fmtN(Math.abs(d))}</i>`);continue;}
    const r=Math.round(d);
    if(r!==0)out.push(`<i class="${r<0?'neg':''}">${k} ${r>0?'+':''}${r}</i>`);
  }
  return out.length?`<div class="deltas">${out.join('')}</div>`:'';
}
function nextModal(){
  while(queue.length){
    if(!S.alive)break;
    let spec=null;
    try{spec=queue.shift()();}catch(e){console.error(e);}
    if(!spec)continue;
    if(UI.skip){
      if(autoResolve(spec))continue;
      const st=UI.skip.start;UI.skip=null;queue.unshift(()=>spec);save();
      showModal(skipSummarySpec(S,st,'decision'));return;
    }
    showModal(spec);return;
  }
  closeModal();
  save();render();
  if(UI.skip){
    if(!S||!S.alive){UI.skip=null;return;}
    if(UI.skip.left>0){UI.skip.left--;toast('시간 건너뛰는 중',`${S.age}세 · ${S.year}년`,'');setTimeout(()=>ageUp(true),15);}
    else{const st=UI.skip.start;UI.skip=null;showModal(skipSummarySpec(S,st,'done'));}
  }
}
function stopRG(){if(RG.active||RG.raf){RG.active=false;cancelAnimationFrame(RG.raf);RG.raf=0;}if(RG.key){window.removeEventListener('keydown',RG.key);RG.key=null;}}
function showModal(spec){
  stopRG();UI.modalOpen=true;
  const m=$('#modal');m.hidden=false;
  $('#mKicker').textContent=spec.kicker||'';
  $('#mTitle').textContent=spec.title||'';
  $('#mBody').innerHTML=(spec.board||'')+(spec.body||'');
  const box=$('#mChoices');box.innerHTML='';
  spec.choices.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice '+(c.primary?'primary ':'');
    b.disabled=!!c.disabled;
    if(c.primary)b.textContent=c.label;
    else b.innerHTML=`<span class="c-main"><strong>${esc(c.label)}</strong>${c.disabled&&c.reason?`<small>${esc(c.reason)}</small>`:c.sub?`<small>${esc(c.sub)}</small>`:''}</span>${c.tag?`<span class="c-tag">${esc(c.tag)}</span>`:''}`;
    b.onclick=()=>{const before=snap(S);let r;try{r=c.act();}catch(e){console.error(e);r=null;}handleResult(spec,r,before);};
    box.appendChild(b);
  });
  render();
  if(spec.onShow)spec.onShow();
  $('#modal').scrollTop=0;
  setTimeout(()=>{const f=box.querySelector('button:not(:disabled)');f&&f.focus({preventScroll:true});},30);
}
function handleResult(spec,r,before){
  const d=deltas(before,snap(S));
  render();
  if(r==null){nextModal();return;}
  if(typeof r==='string'){log(S,`${spec.title}: ${r}`);resultView(spec,r,d,null);return;}
  if(r.rhythm){showRhythm(r.rhythm,before);return;}
  if(r.spec){showModal(r.spec);return;}
  if(r.text){if(!r.nolog)log(S,`${spec.title}: ${r.text}`);resultView(spec,r.text,d,r.next||null,r.board);return;}
  nextModal();
}
function resultView(spec,text,d,next,board){
  $('#mBody').innerHTML=`${board||''}<div class="result">${esc(text)}</div>${d}`;
  const box=$('#mChoices');box.innerHTML='';
  const b=document.createElement('button');b.className='choice primary';b.textContent='계속';
  b.onclick=()=>{if(next)showModal(next);else nextModal();};

}
function closeModal(){stopRG();UI.modalOpen=false;$('#modal').hidden=true;}

/* ---- rhythm game ---- */
const RG={raf:0,active:false,key:null};
function showRhythm(cfg,before){
  stopRG();UI.modalOpen=true;$('#modal').hidden=false;
  $('#mKicker').textContent=cfg.kicker||'';
  $('#mTitle').textContent=cfg.title||'';
  const n=cfg.notes||10,beat=60000/(cfg.bpm||120);
  const unit=beat<420?beat*2:beat;
  const times=[];let t=1600;
  for(let i=0;i<n;i++){times.push(t);t+=Math.max(230,unit*pick([1,1,1,.5,1.5,2]));}
  const travel=clamp(1900-(cfg.bpm||120)*3.2,1150,1650);
  const win=cfg.win||120,perfW=Math.max(45,win*.42);
  $('#mBody').innerHTML=`${cfg.board||''}${cfg.body?`<p>${cfg.body}</p>`:''}
    <div class="rg"><div class="rg-row"><span>BPM <b>${cfg.bpm||120}</b> · 노트 <b>${n}</b></span><span>PERFECT <b id="rgP">0</b> · GOOD <b id="rgG">0</b> · MISS <b id="rgM">0</b></span></div>
    <div class="rg-track" id="rgTrack" aria-label="리듬 트랙"><div class="rg-hit" id="rgHit"></div>${times.map((_,i)=>`<div class="rg-note" data-i="${i}" style="left:110%"></div>`).join('')}</div>
    <div class="rg-fb" id="rgFb">READY</div><p class="sb-note" style="text-align:center;margin:0">${esc(cfg.hint||'노트가 노란 선에 닿을 때 누르기 · 스페이스바 또는 트랙을 탭')}</p></div>`;
  const box=$('#mChoices');box.innerHTML='';
  const go=document.createElement('button');go.className='choice primary rg-go';go.textContent='연주 시작';
  const auto=document.createElement('button');auto.className='choice';auto.innerHTML=`<span class="c-main"><strong>감에 맡기기</strong><small>미니게임 없이 실력으로 판정</small></span><span class="c-tag">${Math.round((cfg.p??.5)*100)}%</span>`;
  box.append(go,auto);
  const notes=[...document.querySelectorAll('.rg-note')];
  const judged=new Array(n).fill(null);const cnt={perfect:0,good:0,miss:0};
  let t0=0,started=false;const HIT=.12;
  const fb=(q)=>{const el=$('#rgFb');el.textContent=q.toUpperCase();el.className='rg-fb '+q;const h=$('#rgHit');h.classList.add('flash');setTimeout(()=>h.classList.remove('flash'),90);};
  const upd=()=>{$('#rgP').textContent=cnt.perfect;$('#rgG').textContent=cnt.good;$('#rgM').textContent=cnt.miss;};
  const judge=(i,q)=>{judged[i]=q;cnt[q]++;notes[i].classList.add(q==='miss'?'missed':'done');upd();fb(q);};
  const finish=()=>{
    RG.active=false;cancelAnimationFrame(RG.raf);window.removeEventListener('keydown',RG.key);
    const score=(cnt.perfect+cnt.good*.6)/n;
    const q=score>=.85?'perfect':score>=.55?'good':'miss';
    const el=$('#rgFb');el.textContent=`${Math.round(score*100)}%`;el.className='rg-fb '+q;
    go.disabled=true;auto.disabled=true;
    setTimeout(()=>{let r;try{r=cfg.done(q,score,false);}catch(e){console.error(e);r=null;}handleResult(cfg,r,before);},700);
  };
  const tick=now=>{
    if(!RG.active)return;
    if(!document.body.contains(notes[0])){stopRG();return;}
    const el=now-t0;
    for(let i=0;i<n;i++){
      const dt=times[i]-el;
      notes[i].style.left=((HIT+dt/travel*(1-HIT+.05))*100)+'%';
      if(!judged[i]&&dt<-win)judge(i,'miss');
    }
    if(el>times[n-1]+win+400){finish();return;}
    RG.raf=requestAnimationFrame(tick);
  };
  const press=()=>{
    if(!RG.active)return;
    const el=performance.now()-t0;let bi=-1,bd=1e9;
    for(let i=0;i<n;i++){if(judged[i])continue;const d=Math.abs(times[i]-el);if(d<bd){bd=d;bi=i;}}
    if(bi<0||bd>win+60)return;
    judge(bi,bd<=perfW?'perfect':bd<=win?'good':'miss');
  };
  const begin=()=>{if(started)return;started=true;RG.active=true;t0=performance.now();go.textContent='HIT!';$('#rgFb').textContent='';RG.raf=requestAnimationFrame(tick);};
  go.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)begin();else press();});
  go.addEventListener('click',e=>{if(e.detail===0){if(!started)begin();}});
  $('#rgTrack').addEventListener('pointerdown',e=>{e.preventDefault();if(!started)begin();else press();});
  auto.onclick=()=>{if(started&&!RG.active)return;RG.active=false;cancelAnimationFrame(RG.raf);window.removeEventListener('keydown',RG.key);go.disabled=true;auto.disabled=true;
    const sc=clamp(gauss(cfg.p??.5,.1),0,1);let r;try{r=cfg.done(sc>=.85?'perfect':sc>=.55?'good':'miss',sc,true);}catch(e){console.error(e);r=null;}handleResult(cfg,r,before);};
  RG.key=e=>{if(e.code==='Space'||e.key===' '||e.key==='j'||e.key==='f'){e.preventDefault();if(e.repeat)return;if(!started)begin();else press();}};
  window.addEventListener('keydown',RG.key);
  setTimeout(()=>go.focus({preventScroll:true}),30);
}

let toastT=null;
function toast(title,text,d){const t=$('#toast');t.innerHTML=`<b>${esc(title)}</b><p>${esc(text)}</p>${d||''}`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}
const PRESETS={
  grind:{n:'연습 위주',slots:['practice','vocal','jam','practice','rest']},
  writer:{n:'작곡가',slots:['write','dig','write','record','rest']},
  live:{n:'라이브',slots:['gig','busk','jam','practice','rest']},
  sns:{n:'인플루언서',slots:['cover','gig','cover','write','rest']},
  money:{n:'생계형',slots:['job','session','practice','write','rest']},
};
function routineOf(s){if(!s.routine)s.routine={on:false,slots:PRESETS.grind.slots.slice(),liveAuto:false,autoRel:false};return s.routine;}
function actUsable(s,a){if(!a||!actAvailable(s,a))return false;if(a.yearly&&s.flags.yearly?.[a.id])return false;const c=a.cost?a.cost(s):0;if(c&&wallet(s)<c)return false;return true;}
function performAct(s,a,manual){
  const cost=a.cost?a.cost(s):0;
  if(cost&&!spend(s,cost))return null;
  s.ap--;if(a.yearly)s.flags.yearly[a.id]=1;
  if(a.id==='write')return manual?{spec:composeSpec(s)}:autoWrite(s);
  if(a.id==='gig'){if(manual)return {spec:gigSpec(s)};const sp=gigSpec(s);return sp.auto().text;}
  return a.run(s);
}
function runRoutine(s,showToast,slots){
  const r=routineOf(s);const list=(slots||r.slots).slice(0,s.ap);const done=[];const before=snap(s);
  for(let i=0;i<list.length&&s.ap>0;i++){
    let a=ACTS.find(x=>x.id===list[i]);
    if(!actUsable(s,a))a=ACTS.find(x=>x.id==='rest');
    if(!actUsable(s,a))break;
    const res=performAct(s,a,false);
    if(typeof res==='string'){done.push(a.name);log(s,`${a.name}: ${res}`);}
  }
  if(showToast&&done.length)toast('자동 루틴',done.join(' · '),deltas(before,snap(s)));
}
function doAct(id){
  if(UI.modalOpen||!S||S.ap<=0)return;
  const a=ACTS.find(x=>x.id===id);if(!actUsable(S,a))return;
  const before=snap(S);
  const r=performAct(S,a,true);
  if(r==null){render();return;}
  if(typeof r==='string'){log(S,`${a.name}: ${r}`);save();render();toast(a.name,r,deltas(before,snap(S)));return;}
  if(r.spec){queue=[];showModal(r.spec);}
}

const REL_ACTS={
  talk:{n:'대화',f:(s,r)=>{r.bond=clamp(r.bond+RI(4,8),0,100);lf(s,'happy',2);return `${J(r.name,'과/와')} 오래 이야기했다.`;}},
  gift:{n:'선물',cost:s=>s.age<19?20:80,f:(s,r)=>{r.bond=clamp(r.bond+RI(8,14),0,100);return `${r.name}에게 선물을 건넸다.`;}},
  date:{n:'데이트',types:['연인','배우자'],cost:s=>s.age<19?10:50,f:(s,r)=>{r.bond=clamp(r.bond+RI(6,12),0,100);lf(s,'happy',6);lf(s,'insp',5);return '공연이 없는 저녁, 둘이 한강을 걸었다.';}},
  propose:{n:'청혼',types:['연인'],cond:(s,r)=>r.bond>=75&&s.age>=24,f:(s,r)=>{if(chance(r.bond/105)){r.type='배우자';lf(s,'happy',18);s.money-=s.age>=19?1500:0;log(s,`${J(r.name,'과/와')} 결혼했다. 축가는 직접 불렀다.`,'major');return '반지 대신 직접 쓴 노래를 건넸다. "응."';}r.bond-=15;lf(s,'mental',-8);return '"조금만 더 생각해 볼게."';}},
  pet:{n:'놀아 주기',types:['반려묘'],f:(s,r)=>{r.bond=clamp(r.bond+8,0,100);lf(s,'happy',5);return `${J(r.name,'이/가')} 앰프 위에서 골골거렸다.`;}},
};
function relAct(rid,aid){
  if(UI.modalOpen||!S)return;
  const s=S,r=s.relations.find(x=>x.id===rid),A=REL_ACTS[aid];if(!r||!A)return;
  if(s.flags.relDone[rid]){toast('인간관계','올해는 이미 시간을 보냈다.','');return;}
  const c=A.cost?A.cost(s):0;if(c&&!spend(s,c)){toast('인간관계','돈이 부족하다.','');return;}
  const before=snap(s);const t=A.f(s,r);s.flags.relDone[rid]=1;log(s,t);save();render();toast(r.name,t,deltas(before,snap(s)));
}
function findLove(){
  if(UI.modalOpen||!S||partner(S)||S.age<16)return;
  if(S.flags.yearly.love){toast('새 인연','올해는 인연이 닿지 않았다.','');return;}
  S.flags.yearly.love=1;
  if(chance(.45+fameIdx(S)*.003)){const n=koName(S.gender==='m'?'f':S.gender==='f'?'m':null);addRel(S,'연인',n,58,S.age+RI(-3,3));lf(S,'happy',8);log(S,`${J(n,'과/와')} 만나기 시작했다.`,'good');toast('새 인연',`${n}. 공연장 뒤편에서 처음 만났다.`,'');}
  else toast('새 인연','소개팅은 어색하게 끝났다.','');
  save();render();
}

function itemReq(s,it){
  if(it.minAge&&s.age<it.minAge)return `${it.minAge}세 이상`;
  if(!it.repeat&&hasItem(s,it.id))return '보유 중';
  if(it.gear&&(s.gear||0)>=it.gear)return '더 좋은 악기가 있다';
  if(wallet(s)<it.cost)return '돈이 부족하다';
  return '';
}
function buyItem(id){
  if(UI.modalOpen||!S)return;
  const s=S,it=ITEMS.find(x=>x.id===id);if(!it||itemReq(s,it))return;
  spend(s,it.cost);
  if(it.gear){s.gear=it.gear;if(it.id==='gear3')at(s,'stage',4);}
  if(it.id==='pedal'){at(s,'stage',3);lf(s,'insp',8);}
  if(it.id==='officetel'||it.id==='house')lf(s,'happy',it.id==='house'?14:8);
  if(it.id==='fund'){s.legacy+=20;lf(s,'happy',10);log(s,'청소년 음악 장학재단을 세웠다.','major');}
  if(it.id==='donate'){s.legacy+=2;lf(s,'happy',4);}
  if(it.id==='mylabel'){s.legacy+=6;log(s,'인디 레이블을 설립했다.','major');}
  if(it.id==='bar'){s.legacy+=3;log(s,'라이브 바를 열었다.','major');}
  if(!it.repeat)s.assets.push({id:it.id,name:it.name,value:it.value||Math.round(it.cost*.4),bought:s.year});
  log(s,`${it.name} 구입 (${fmtMoney(it.cost)}).`);
  save();render();toast('구입',it.name,'');
}
function sellAsset(i){
  if(UI.modalOpen||!S)return;
  const a=S.assets[i];if(!a)return;
  const v=Math.round((a.value||0)*R(.85,1.05));S.money+=v;S.assets.splice(i,1);
  if(a.id.startsWith('gear'))S.gear=Math.max(0,...S.assets.filter(x=>x.id.startsWith('gear')).map(x=>+x.id.slice(4)));
  log(S,`${a.name}을(를) ${fmtMoney(v)}에 처분했다.`);save();render();
}
function financeYear(s){
  const iv=s.invest;
  if(iv.dep>0)iv.dep=Math.round(iv.dep*1.03);
  if(iv.stock>0){const r=gauss(.06,.2);iv.stock=Math.max(0,Math.round(iv.stock*(1+r)));if(Math.abs(r)>.25)log(s,`주식 ${r>0?'대박':'폭락'}: ${Math.round(r*100)}%.`,r>0?'good':'bad');}
  s.assets.forEach(a=>{
    const it=ITEMS.find(x=>x.id===a.id);if(!it)return;
    if(it.upkeep)s.money-=it.upkeep;
    if(it.income){const m=Math.round(R(it.income[0],it.income[1]));s.money+=m;if(a.id==='bar')s.legacy+=.6;if(a.id==='mylabel')s.legacy+=1.2;}
    if(a.id==='officetel'||a.id==='house')a.value=Math.round(a.value*R(.98,1.06));
  });
}
function finMove(kind,amt){
  if(UI.modalOpen||!S)return;
  const s=S;
  if(kind==='dep'||kind==='stock'){if(s.money<amt)return;s.money-=amt;s.invest[kind]+=amt;}
  else{const k=kind.slice(4);s.money+=s.invest[k];s.invest[k]=0;}
  save();render();
}
const catalogValue=s=>{const ls=s.songs.filter(x=>x.rid&&!x.sold);return {n:ls.length,lump:Math.round(ls.reduce((a,b)=>a+b.yr,0)*.0004*shareOf(s)*(s.flags.rate||1)*1.6)};};
function sellCatalog(){
  if(UI.modalOpen||!S)return;
  const s=S;const {n,lump}=catalogValue(s);
  if(lump<100||s.age<19)return;
  if(UI.arm!=='catalog'){UI.arm='catalog';render();return;}
  UI.arm=null;s.money+=lump;s.songs.forEach(x=>{if(x.rid)x.sold=true;});log(s,`발매곡 ${n}곡의 저작권을 음악 펀드에 팔았다. ${fmtMoney(lump)}.`,'major');save();render();toast('저작권 매각',`${fmtMoney(lump)}을 한 번에 받았다. 판 곡의 음원 수익은 이제 들어오지 않는다.`,'');
}

function bandBtn(kind,arg){
  if(UI.modalOpen||!S)return;
  const s=S;queue=[];
  if(kind==='form'){showModal(formBandSpec(s));return;}
  if(kind==='recruit'){showModal(recruitSpec(s,arg));return;}
  if(kind==='pitch'){if(s.flags.yearly.pitch)return;showModal(pitchSpec(s));return;}
  if(kind==='tour'){if(tourGate(s,arg))return;showModal(tourSpec(s,arg));return;}
  if(kind==='quit'){showModal(quitSpec(s));return;}
  if(kind==='talk'){const m=s.band.members.find(x=>x.id===arg);if(!m||s.flags.relDone['m'+m.id])return;s.flags.relDone['m'+m.id]=1;m.bond=clamp(m.bond+RI(6,11),0,100);const t=`${J(m.name,'과/와')} 합주 끝나고 밤새 이야기했다.`;log(s,t);save();render();toast(m.name,t,'');return;}
  if(kind==='kick'){if(UI.arm!=='kick'+arg){UI.arm='kick'+arg;render();return;}UI.arm=null;const m=s.band.members.find(x=>x.id===arg);if(m){memberLeave(s,m,'내가 내보냈다.');s.band.members.forEach(x=>x.bond=clamp(x.bond-6,0,100));}save();render();return;}
  if(kind==='hiatus'){s.band.hiatus=s.band.hiatus?null:'break';log(s,s.band.hiatus?`${s.band.name} 활동 중단.`:`${s.band.name} 활동 재개.`,s.band.hiatus?'bad':'good');save();render();return;}
  if(kind==='disband'){if(UI.arm!=='disband'){UI.arm='disband';render();return;}UI.arm=null;s.band.disbanded=true;s.band.hiatus='disband';s.band.members.forEach(m=>m.bond=clamp(m.bond-10,0,100));log(s,`${s.band.name} 해체. 이제 솔로로 간다.`,'major');save();render();return;}
  if(kind==='genre'){s.band.genre=arg;s.band.chem=clamp(s.band.chem-8,0,100);log(s,`${s.band.name}의 장르를 ${GENRES[arg].ko}(으)로 바꿨다.`);save();render();return;}
  if(kind==='breakc'){if(UI.arm!=='breakc'){UI.arm='breakc';render();return;}UI.arm=null;const pen=Math.round(s.contract.adv*.6);s.money-=pen;log(s,`${LABELS[s.contract.id].name} 계약 해지. 위약금 ${fmtMoney(pen)}.`,'bad');s.contract=null;save();render();return;}
}
function doRelease(type){
  if(UI.modalOpen||!S)return;
  const s=S;const mv=$('#relMv')?.checked;
  const sel=UI.relSel.map(id=>ownSong(s,id)).filter(x=>x&&!x.rid);
  const need={single:[1,1],ep:[3,6],album:[7,14]}[type];
  if(sel.length<need[0]||sel.length>need[1]||s.ap<1)return;
  const cost=relCost(s,type,mv);if(wallet(s)<cost){toast('발매','제작비가 부족하다.','');return;}
  queue=[];const before=snap(s);const spec=releaseSpec(s,type,mv);if(spec){showModal(spec);}
}

function tabHTML(s){
  if(UI.tab==='act')return actHTML(s);
  if(UI.tab==='band')return bandHTML(s);
  if(UI.tab==='music')return musicHTML(s);
  if(UI.tab==='people')return peopleHTML(s);
  if(UI.tab==='money')return moneyHTML(s);
  return feedHTML(s);
}
function feedHTML(s){
  const groups=[];let cur=null;
  for(let i=s.log.length-1;i>=0;i--){const e=s.log[i];if(!cur||cur.age!==e.age){cur={age:e.age,year:e.year,items:[]};groups.push(cur);}cur.items.push(e);}
  return `<div class="feed">${groups.slice(0,60).map(g=>`<div class="yr"><div class="yr-age">${g.age}세<small>${g.year}</small></div><ul>${g.items.map(e=>`<li class="${e.tone}">${esc(e.text)}</li>`).join('')}</ul></div>`).join('')}</div>`;
}
function routineHTML(s){
  const r=routineOf(s),n=Math.min(s.apMax,5);
  const opts=id=>`<option value="none" ${id==='none'?'selected':''}>— 비워 둠 —</option>`+ACTS.map(a=>`<option value="${a.id}" ${a.id===id?'selected':''}>${a.name}${actAvailable(s,a)?'':' (지금은 불가)'}</option>`).join('');
  return `<div class="routine">
    <div class="rt-head"><label class="switch"><input type="checkbox" id="rtOn" ${r.on?'checked':''}><span></span><b>자동 루틴</b></label>
      <span class="sb-note">${r.on?'1년 보내기를 누르면 남은 행동을 아래 순서대로 실행':'켜면 매년 아래 순서대로 행동을 자동 실행'}</span></div>
