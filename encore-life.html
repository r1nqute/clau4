:root{
  /* Layout: retro RPG screen — status window with the pixel sprite on the left, an orange command row of tabs over a white-framed main window, dialogue boxes for every event, and the year command bar fixed at the bottom */
  --bg:#000;
  --fg:#fff;
  --dim:#a0a0a0;
  --mute:#5e5e5e;
  --orange:#ff9c1a;
  --yellow:#ffe600;
  --red:#ff2a2a;
  --green:#36e070;
  --cyan:#45d0ff;
  --pink:#ff74b4;
  --f:'Galmuri14','Galmuri11',ui-monospace,monospace;
  --fs:'Galmuri11','Galmuri14',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f);font-size:15px;line-height:24px;min-height:100%;-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-smooth:never;letter-spacing:0}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:2px dashed var(--yellow);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.small{font-family:var(--fs);font-size:12px;line-height:18px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spr{display:block;image-rendering:pixelated}
.neg{color:var(--red)}
/* pick cursor */
.pick-cur{display:inline-block;width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%);flex:none}

/* ===== boxes ===== */
.box,.panel{border:4px solid var(--fg);background:var(--bg);padding:12px 14px;min-width:0}
.panel h3,.box h3{margin:0 0 8px;font-family:var(--fs);font-size:12px;line-height:18px;font-weight:400;color:var(--dim);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 em,.box h3 em{font-style:normal;color:var(--mute)}

/* ===== top ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;white-space:nowrap}
.brand-ico{width:24px;height:24px}
.brand b{font-weight:400;color:var(--yellow)}
.top-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.yr-chip{font-size:15px;color:var(--yellow);padding:0 6px}
.ghost{border:2px solid var(--fg);padding:2px 10px;font-family:var(--fs);font-size:12px;line-height:20px;color:var(--fg)}
.ghost:hover,.ghost:focus-visible{border-color:var(--yellow);color:var(--yellow)}
.ghost.warn{border-color:var(--orange);color:var(--orange)}
.ticker{border:2px solid var(--fg);padding:4px 10px;margin-bottom:12px;display:flex;gap:8px;min-width:0;font-family:var(--fs);font-size:12px;line-height:20px}
.ticker b{flex:none;color:var(--cyan);font-weight:400}
.ticker span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== grid ===== */
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:110px}
@media (min-width:940px){.grid{grid-template-columns:340px minmax(0,1fr);align-items:start}.rail{position:sticky;top:12px}}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.mainp{min-width:0;display:flex;flex-direction:column;gap:12px}
@media (max-width:939px){.rail{display:contents}.rail .status{order:1}.rail .p-life{order:2}.mainp{order:3}.rail .p-stat{order:4}.rail .p-map{order:5}}

/* status window */
.st-top{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.st-spr{width:96px;height:120px}
.st-spr .spr{width:96px;height:120px;animation:bob 1.2s steps(1) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.st-name{display:block;font-size:15px;color:var(--yellow);word-break:keep-all;overflow-wrap:anywhere}
.st-line{display:block;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim);word-break:keep-all}
.st-line b{font-weight:400;color:var(--fg)}
.lv{display:flex;gap:14px;margin:4px 0 2px}
.lv span{font-size:15px}
.hp-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:4px}
.hp-row>span{font-family:var(--fs);font-size:12px;line-height:18px}
.hp{position:relative;height:14px;background:var(--red)}
.hp i{position:absolute;left:0;top:0;bottom:0;background:var(--yellow)}
.hp.cool{background:#2a2a2a}.hp.cool i{background:var(--fg)}
.st-meta{margin-top:10px;border-top:2px solid var(--fg);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.traits{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-family:var(--fs);font-size:12px;line-height:18px}
.trait{color:var(--fg)}
.trait.neg{color:var(--red)}
.trait.str{color:var(--yellow)}
.stars{color:var(--yellow);letter-spacing:1px}

/* condition */
.meters{display:flex;flex-direction:column;gap:6px}
.meter{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;gap:8px;align-items:center;font-family:var(--fs);font-size:12px;line-height:18px}
.meter b{font-weight:400;text-align:right;font-family:var(--f);font-size:15px}
.kvs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;border-top:2px solid var(--fg);margin-top:10px;padding-top:8px}
.kvs div{display:flex;justify-content:space-between;gap:6px;min-width:0}
.kvs span{font-family:var(--fs);font-size:12px;color:var(--dim)}
.kvs b{font-weight:400;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* stats */
.stats{display:flex;flex-direction:column;gap:5px}
.stat{display:grid;grid-template-columns:36px minmax(0,1fr) 26px;gap:8px;align-items:center}
.stat label{font-family:var(--fs);font-size:12px;color:var(--dim)}
.sbar{position:relative;height:12px;border:2px solid var(--fg)}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg)}
.sbar i.hi{background:var(--yellow)}
.sbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--orange);text-decoration:none}
.stat b{font-weight:400;text-align:right}
.t-elite{color:var(--yellow)}.t-good{color:var(--green)}.t-mid{color:var(--fg)}.t-low{color:var(--dim)}

/* map */
.map-wrap{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.kmap{width:110px;height:auto;display:block}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s steps(4) infinite}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.7);opacity:0}}
.map-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.map-city{font-size:15px;color:var(--yellow)}
.map-info>span{font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim);word-break:keep-all}
.map-info>span.tour-line{color:var(--orange)}
.trail{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:2px solid var(--fg);display:flex;flex-direction:column;gap:2px;font-family:var(--fs);font-size:12px;line-height:18px}
.trail i{font-style:normal;color:var(--yellow);margin-right:6px}

/* ===== command tabs ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--orange);color:var(--orange);padding:5px 12px;white-space:nowrap}
.tab:hover{color:var(--yellow);border-color:var(--yellow)}
.tab[aria-selected="true"]{color:var(--yellow);border-color:var(--yellow)}
.tab[aria-selected="true"]::before{content:"";width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.tab .dot{font-family:var(--fs);font-size:12px;color:var(--fg)}

/* ===== feed ===== */
.feed{display:flex;flex-direction:column;gap:10px}
.yr-h{font-family:var(--fs);font-size:12px;color:var(--yellow);display:flex;align-items:center;gap:8px}
.yr-h::after{content:"";flex:1;height:2px;background:var(--mute)}
.yr ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.yr li{padding-left:16px;text-indent:-16px;word-break:keep-all;overflow-wrap:anywhere}
.yr li::before{content:"* ";color:var(--dim)}
.yr li.good{color:var(--green)}
.yr li.bad{color:#ff8080}
.yr li.major{color:var(--yellow)}
.yr li.news{color:var(--cyan);font-family:var(--fs);font-size:12px;line-height:20px}
.yr li.news::before{content:"[뉴스] ";color:var(--cyan)}

/* ===== activities ===== */
.ap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-family:var(--fs);font-size:12px;color:var(--dim)}
.ap-head b{font-weight:400;color:var(--yellow);font-family:var(--f);font-size:15px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.act{text-align:left;border:2px solid var(--fg);padding:8px 10px;display:flex;flex-direction:column;gap:4px;position:relative}
.act strong{font-weight:400}
.act p{margin:0;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.act:hover:not(:disabled),.act:focus-visible{border-color:var(--yellow);outline:none}
.act:hover:not(:disabled) strong,.act:focus-visible strong{color:var(--yellow)}
.act:hover:not(:disabled)::after,.act:focus-visible::after{content:"";position:absolute;right:8px;top:10px;width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.act:disabled{border-color:var(--mute);color:var(--mute)}
.act:disabled p{color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:2px 8px;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--cyan)}
.tags i{font-style:normal}
.tags i::before{content:"["}.tags i::after{content:"]"}
.tags i.mini{color:var(--pink)}
.act .cost{font-family:var(--fs);font-size:12px;color:var(--yellow)}

/* ===== generic ===== */
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.sec-h h4{margin:0;font-weight:400;font-size:15px;color:var(--yellow)}
.sec-h span{font-family:var(--fs);font-size:12px;color:var(--dim)}
.empty,.note{font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim);margin:6px 0 0}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:2px solid var(--fg);padding:3px 10px;line-height:22px;color:var(--fg);text-align:center}
.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--yellow);color:var(--yellow)}
.btn:disabled{border-color:var(--mute);color:var(--mute)}
.btn.hot{border-color:var(--orange);color:var(--orange)}
.btn.hot:hover:not(:disabled){border-color:var(--yellow);color:var(--yellow)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.sm{padding:1px 8px;font-family:var(--fs);font-size:12px;line-height:20px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv div{border:2px solid var(--fg);padding:6px 10px;min-width:0}
.kv span{display:block;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.kv b{display:block;font-weight:400;word-break:keep-all}
.kv b.num{color:var(--yellow)}

/* band */
.band-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.band-name{font-size:30px;line-height:36px;color:var(--yellow);word-break:keep-all;overflow-wrap:anywhere}
.band-tags{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-family:var(--fs);font-size:12px}
.pill::before{content:"["}.pill::after{content:"]"}
.pill.on{color:var(--green)}.pill.off{color:var(--red)}.pill.gold{color:var(--yellow)}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mem{border:2px solid var(--fg);padding:8px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;min-width:0}
.mem.me{border-color:var(--yellow)}
.mem.away{border-color:var(--mute);color:var(--dim)}
.mem .spr{width:64px;height:80px}
.mem-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.mem-top{display:flex;justify-content:space-between;gap:8px}
.mem-top b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-top i{font-style:normal;font-family:var(--fs);font-size:12px;color:var(--orange);flex:none}
.mem small{font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.hearts{color:var(--red);font-size:12px;letter-spacing:1px;font-family:var(--fs)}
.hearts s{text-decoration:none;color:var(--mute)}
.mem-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.slots-empty{border:2px dashed var(--mute);padding:8px 10px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--fs);font-size:12px}
.app{border:2px solid var(--cyan);padding:8px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.app .spr{width:64px;height:80px}
.app q{display:block;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--fg);quotes:none}
.app q::before{content:"* "}
.post{display:flex;flex-wrap:wrap;gap:6px}

/* songs */
.paper-list{display:flex;flex-direction:column;gap:4px}
.song{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;border:2px solid var(--fg);padding:4px 10px;cursor:pointer}
.song:hover{border-color:var(--yellow)}
.song .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .m{font-family:var(--fs);font-size:12px;color:var(--dim);white-space:nowrap}
.song .g{color:var(--yellow)}
.song input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid var(--fg);margin:0;background:var(--bg);flex:none}
.song input:checked{background:var(--yellow);border-color:var(--yellow)}
.song.rel{cursor:default}
.rel-card{border:2px solid var(--fg);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.rel-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.rel-top b{font-weight:400;color:var(--yellow)}
.rel-top span{font-family:var(--fs);font-size:12px;color:var(--dim)}
.rel-songs{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--fs);font-size:12px}
.rel-songs em{font-style:normal;color:var(--orange);margin-left:4px}
.rank-list{display:flex;flex-direction:column}
.rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 4px;border-bottom:2px dotted var(--mute)}
.rank-row b{font-weight:400;color:var(--dim);text-align:right}
.rank-row.me,.rank-row.me b{color:var(--yellow)}
.rank-row small{font-family:var(--fs);font-size:12px;color:var(--dim);white-space:nowrap}
.real{color:var(--cyan);font-family:var(--fs);font-size:12px;margin-left:6px}

/* people */
.people{display:flex;flex-direction:column;gap:8px}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--fg);padding:8px 10px}
.person .who b{font-weight:400}
.person .who span{font-family:var(--fs);font-size:12px;color:var(--dim);margin-left:6px}
.person .acts-mini{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:560px){.person{grid-template-columns:1fr}.person .acts-mini{justify-content:flex-start}}

/* economy */
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.own-list{display:flex;flex-direction:column;gap:6px}
.own-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--fg);padding:6px 10px}
.own-row>div:first-child{min-width:0;flex:1 1 200px}
.own-row b{display:block;font-weight:400}
.own-row small{display:block;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim);word-break:keep-all}
.own-btns{display:flex;flex-wrap:wrap;gap:6px}

/* routine */
.routine{border:2px solid var(--cyan);padding:10px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.rt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.rt-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.rt-slot{display:flex;align-items:center;gap:6px;min-width:0}
.rt-slot span{color:var(--yellow);width:14px;flex:none}
.rt-slot select{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:2px solid var(--fg);border-radius:0;padding:3px 4px;font-family:var(--fs);font-size:12px}
.rt-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.rt-presets{display:flex;flex-wrap:wrap;gap:6px}
.switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--fs);font-size:12px;color:var(--dim);position:relative}
.switch b{font-weight:400;color:var(--fg);font-family:var(--f);font-size:15px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:16px;height:16px;border:2px solid var(--fg);flex:none}
.switch input:checked+span{background:var(--yellow);border-color:var(--yellow)}
.switch input:focus-visible+span{outline:2px dashed var(--yellow);outline-offset:2px}

/* ===== bottom command bar ===== */
.bar-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:4px solid var(--fg);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar-inner{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pips{display:flex;align-items:center;gap:5px;font-family:var(--fs);font-size:12px;color:var(--dim);min-width:0}
.pips em{font-style:normal;color:var(--fg);margin-right:2px}
.pip{width:12px;height:12px;border:2px solid var(--fg);flex:none}
.pip.on{background:var(--yellow);border-color:var(--yellow)}
.cmd{display:flex;align-items:center;gap:8px;border:3px solid var(--orange);color:var(--orange);padding:6px 14px;white-space:nowrap}
.cmd:hover:not(:disabled),.cmd:focus-visible{border-color:var(--yellow);color:var(--yellow);outline:none}
.cmd:hover:not(:disabled)::before,.cmd:focus-visible::before{content:"";width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.cmd:disabled{border-color:var(--mute);color:var(--mute)}
.cmd .sub{font-family:var(--fs);font-size:12px;color:var(--dim)}
.cmd.go{font-size:15px}
@media (max-width:520px){.brand span{display:none}.pips>span:not(.pip){display:none}.cmd{padding:5px 9px;gap:6px}.cmd .sub{display:none}}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);opacity:0;pointer-events:none;z-index:30;width:min(520px,calc(100% - 32px));background:var(--bg);border:3px solid var(--fg);padding:8px 12px;transition:opacity .15s steps(2),transform .15s steps(2)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast b{display:block;font-weight:400;color:var(--yellow)}
.toast p{margin:2px 0 6px;font-family:var(--fs);font-size:12px;line-height:18px}
.toast p::before{content:"* "}
.deltas{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--fs);font-size:12px;line-height:18px}
.deltas i{font-style:normal;color:var(--green)}
.deltas i.neg{color:var(--red)}

/* ===== dialogue (modal) ===== */
.modal{position:fixed;inset:0;z-index:50;display:flex;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.82);overflow-y:auto}
.sheet{margin:auto;width:min(660px,100%);background:var(--bg);border:4px solid var(--fg);animation:pop .16s steps(3)}
@keyframes pop{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
.m-head{display:flex;justify-content:flex-end;padding:6px 12px 0;font-family:var(--fs);font-size:12px;color:var(--dim)}
.m-in{padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.m-top{display:flex;gap:14px;align-items:flex-start}
.m-face{flex:none;border:2px solid var(--fg);padding:4px}
.m-face .spr{width:88px;height:110px}
.m-main{min-width:0;flex:1}
.sheet h2{margin:0 0 6px;font-weight:400;font-size:15px;color:var(--yellow);word-break:keep-all}
.m-body{word-break:keep-all;overflow-wrap:anywhere}
.m-body>p{margin:0 0 6px;padding-left:16px;text-indent:-16px}
.m-body>p:not(.sb-note)::before{content:"* "}
.m-body b{font-weight:400;color:var(--yellow)}
.sb-note{font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.m-body>p.sb-note{padding-left:0;text-indent:0}
@media (max-width:520px){.m-face .spr{width:64px;height:80px}.m-top{gap:10px}}
.m-choices{display:flex;flex-direction:column;gap:2px;border-top:2px solid var(--fg);padding-top:10px}
.m-choices.wait{visibility:hidden}
.choice{display:flex;align-items:center;gap:10px;text-align:left;padding:5px 6px 5px 22px;position:relative;color:var(--fg)}
.choice .c-main{min-width:0;flex:1}
.choice strong{display:block;font-weight:400}
.choice strong::before{content:"* "}
.choice small{display:block;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.choice .c-tag{flex:none;color:var(--orange)}
.choice .c-face .spr{width:32px;height:40px}
.choice:hover:not(:disabled),.choice:focus{color:var(--yellow);outline:none}
.choice:hover:not(:disabled)::before,.choice:focus::before{content:"";position:absolute;left:4px;top:11px;width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.choice:disabled{color:var(--mute)}
.choice:disabled small{color:var(--mute)}
.choice.primary strong{color:var(--orange)}
.choice.primary:hover strong,.choice.primary:focus strong{color:var(--yellow)}
.result{padding-left:16px;text-indent:-16px;margin:4px 0 8px}
.result::before{content:"* "}
.m-sub{margin:12px 0 6px;font-weight:400;font-size:15px;color:var(--orange)}
.m-sub em{font-style:normal;font-family:var(--fs);font-size:12px;color:var(--dim);margin-left:6px}
.gig-board{border:2px solid var(--fg);padding:8px 10px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.gig-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.gig-top .venue{color:var(--yellow);word-break:keep-all}
.gig-top .cap{font-family:var(--fs);font-size:12px;color:var(--orange)}
.gig-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.gig-stats div{border:2px solid var(--mute);padding:2px 4px;text-align:center;min-width:0}
.gig-stats b{display:block;font-weight:400;color:var(--yellow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-stats span{font-family:var(--fs);font-size:12px;color:var(--dim)}
.gig-awards{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--fs);font-size:12px;color:var(--yellow)}
.gig-awards i{font-style:normal}
.gig-awards i::before{content:"★ "}
.setlist{border:2px solid var(--fg);padding:6px 10px;margin:4px 0 10px}
.setlist small{display:block;font-family:var(--fs);font-size:12px;color:var(--dim)}
.setlist ol{margin:2px 0 0;padding-left:22px}
.chart-res{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chart-res .rk{font-size:30px;line-height:36px;color:var(--yellow)}
.chart-res .rk small{font-size:15px;margin-left:2px}
.review{color:var(--yellow)}

/* picker grids, chips, inputs */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.pick-grid.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pick{text-align:left;border:2px solid var(--fg);padding:4px 8px;display:flex;flex-direction:column;min-width:0}
.pick b{font-weight:400}
.pick small{font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.pick small.fit{color:var(--green)}
.pick small.hot{color:var(--pink)}
.pick:hover:not(:disabled){border-color:var(--yellow)}
.pick[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.pick.neg b{color:var(--red)}
.pick:disabled{border-color:var(--mute);color:var(--mute)}
.title-sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chipb{border:2px solid var(--fg);padding:1px 8px;font-family:var(--fs);font-size:12px;line-height:20px}
.chipb:hover:not(:disabled){border-color:var(--yellow);color:var(--yellow)}
.chipb[aria-pressed="true"]{border-color:var(--yellow);color:var(--bg);background:var(--yellow)}
.chipb:disabled{border-color:var(--mute);color:var(--mute)}
.chipb.hand{font-family:var(--f);font-size:15px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lbl{font-size:15px;color:var(--orange)}
input[type=text]{width:100%;min-width:0;background:var(--bg);border:3px solid var(--fg);border-radius:0;color:var(--fg);padding:6px 10px;font-size:15px}
input[type=text]:focus{border-color:var(--yellow)}
input[type=range]{width:100%;accent-color:var(--yellow)}
.sel{width:100%;background:var(--bg);border:3px solid var(--fg);border-radius:0;color:var(--fg);padding:6px 8px}
.code{width:100%;min-width:0;background:var(--bg);border:2px solid var(--fg);border-radius:0;color:var(--fg);padding:6px 8px;font-family:var(--fs);font-size:12px;line-height:18px;resize:vertical;word-break:break-all}

/* rhythm */
.rg{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.rg-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--fs);font-size:12px;color:var(--dim)}
.rg-row b{font-weight:400;color:var(--fg)}
.rg-track{position:relative;height:76px;border:4px solid var(--fg);background:var(--bg);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
.rg-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,var(--mute) 0 6px,transparent 6px 12px)}
.rg-hit{position:absolute;top:0;bottom:0;left:12%;width:4px;margin-left:-2px;background:var(--red)}
.rg-hit::before{content:"";position:absolute;left:-6px;top:4px;width:16px;height:18px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.rg-hit.flash{background:var(--yellow);box-shadow:0 0 0 6px rgba(255,230,0,.25)}
.rg-note{position:absolute;top:50%;width:21px;height:24px;margin:-12px 0 0 -10px;color:var(--yellow)}
.rg-note svg{width:21px;height:24px;display:block;shape-rendering:crispEdges}
.rg-note.done{visibility:hidden}
.rg-note.missed{color:var(--mute)}
.rg-fb{text-align:center;font-size:30px;line-height:36px;min-height:36px;color:var(--dim)}
.rg-fb.perfect{color:var(--yellow)}.rg-fb.good{color:var(--green)}.rg-fb.miss{color:var(--red)}
.rg-hint{text-align:center}
.rg-go strong{font-size:15px}

/* ===== start ===== */
.start{max-width:900px;margin:0 auto;padding-block:28px 60px;display:flex;flex-direction:column;gap:16px}
.title-scr{text-align:center;padding:26px 10px 18px}
.title-scr h1{margin:0;font-weight:400;font-size:45px;line-height:54px;letter-spacing:2px;color:var(--fg);word-break:keep-all}
.title-scr .sub{display:block;font-family:var(--fs);font-size:12px;letter-spacing:6px;color:var(--dim);margin-top:6px}
.title-scr p{max-width:52ch;margin:16px auto 0;color:var(--dim);word-break:keep-all}
.title-band{display:flex;justify-content:center;gap:4px;margin-top:18px;flex-wrap:wrap}
.title-band .spr{width:64px;height:80px}
.blink{animation:blink 1s steps(1) infinite;color:var(--yellow)}
@keyframes blink{50%{opacity:0}}
.form{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:800px){.form{grid-template-columns:1.1fr 1fr}}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--fg);padding:3px 8px}
.seg button[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}
.inst-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:520px){.inst-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.inst-grid button{border:2px solid var(--fg);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.inst-grid .spr{width:48px;height:60px}
.inst-grid b{font-weight:400;font-family:var(--fs);font-size:12px;line-height:18px}
.inst-grid button[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
.inst-grid button:hover{border-color:var(--yellow)}
.gen{display:flex;flex-direction:column;gap:10px}
.gen-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--fg);padding-bottom:6px}
.gen-row span{color:var(--dim)}
.gen-row b{font-weight:400;color:var(--yellow)}
.trait-list{display:flex;flex-direction:column;gap:6px}
.trait-card{border:2px solid var(--fg);padding:4px 10px;font-family:var(--fs);font-size:12px;line-height:18px;color:var(--dim)}
.trait-card b{display:block;font-weight:400;font-family:var(--f);font-size:15px;line-height:24px;color:var(--fg)}
.trait-card.neg b{color:var(--red)}
.cta{border:4px solid var(--orange);color:var(--orange);padding:10px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:hover,.cta:focus-visible{border-color:var(--yellow);color:var(--yellow);outline:none}
.cta:hover::before,.cta:focus-visible::before{content:"";width:10px;height:12px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.continue{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:4px solid var(--yellow);padding:10px 14px}

function normLook(l){

function cap(s,k){
  const w=INST[s.inst].w[k]??0.04;
  let c=s.pot+(k==='stamina'?2:(w-0.12)*40);
  if(k==='vocal'&&has(s,'voice'))c+=8;
  if(k==='lyric'&&has(s,'poet'))c+=8;
  if(k==='stage'&&has(s,'stagey'))c+=8;
  if(k==='stamina'&&has(s,'iron'))c+=8;
  if(k==='compose'&&has(s,'pitch'))c+=5;
  if(k==='compose'&&has(s,'shy'))c+=6;
  if(k==='tech')c+=GEAR_CAP[s.gear||0];
  if(s.strengths&&s.strengths.includes(k))c+=6;
  return clamp(Math.round(c),25,99);
}
function mus(s){const w=INST[s.inst].w;let o=0;for(const k in w)o+=s.attr[k]*w[k];return clamp(Math.round(o),1,99);}
const potStars=p=>clamp(Math.round((p-45)/10),1,5);
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function lf(s,k,d){
  if(k==='insp'&&d>0){if(has(s,'poet'))d*=1.3;if(has(s,'wild'))d*=1.2;}
  if(k==='mental'&&d<0&&has(s,'shy'))d*=1.4;
  if(k==='health'&&d<0&&has(s,'iron'))d*=.7;
  s.life[k]=clamp(s.life[k]+d,0,100);
}
function at(s,k,d){s.attr[k]=clamp(s.attr[k]+d,1,99);}
function tr(s,k,base){
  const c=cap(s,k),v=s.attr[k];
  const room=clamp((c-v)/20,0.05,1.3);
  const am=s.age<13?.9:s.age<23?1.15:s.age<30?.9:s.age<40?.6:.4;
  let g=base*room*am*R(.75,1.25);
  if(has(s,'grinder'))g*=1.3;
  if(has(s,'lazy'))g*=.75;
  if(has(s,'pitch')&&['tech','vocal','rhythm'].includes(k))g*=1.2;
  if(s.life.health<30)g*=.7;
  s.attr[k]=Math.min(99,v+g);
  return g;
}

const SPR_W=32,SPR_H=40;

const rgbHex=(r,g,b)=>'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
function tone(h,a){const [r,g,b]=hexRgb(h);return a<0?rgbHex(r*(1+a),g*(1+a),b*(1+a)):rgbHex(r+(255-r)*a,g+(255-g)*a,b+(255-b)*a);}

const SPR_CACHE=new Map();
function spriteSVG(look,o={}){

  return `<svg class="spr ${o.cls||''}" viewBox="0 0 ${SPR_W} ${SPR_H}" shape-rendering="crispEdges" role="img" aria-label="${esc(o.label||'캐릭터')}">${body}</svg>`;
}
function moodOf(s){return s.life.happy>=62?'happy':s.life.happy<30||s.life.mental<25?'sad':'neutral';}

  const line=(x0,y0,x1,y1,c)=>{const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)P(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),c);};

function curPlace(s){
  if(s.stage==='army')return {city:'철원',label:s.flags.mband?'군악대 복무':'군 복무'};
  if(['high','college'].includes(s.stage)&&s.school)return {city:s.school.city,label:s.school.name};
  if(s.stage==='musician')return {city:s.flags.base||'서울',label:s.band?`${s.band.name} 합주실`:'작업실'};
  if(s.stage==='kid'||s.stage==='middle')return {city:s.home,label:s.school?.name||'고향'};
  return {city:s.flags.base||s.home,label:s.stage==='retired'?'은퇴 후의 집':'직장 근처'};
}
function trackPlace(s){
  s.places=s.places||[];const p=curPlace(s);const key=p.city+'|'+p.label;
  const last=s.places[s.places.length-1];
  if(!last||last.key!==key)s.places.push({key,city:p.city,label:p.label,age:s.age});
  if(s.places.length>40)s.places.splice(0,s.places.length-40);
}
function mapSVG(s){
  trackPlace(s);
  const land=KOR.map(([lo,la])=>prj(la,lo).join(',')).join(' ');
  const [jx,jy]=prj(33.38,126.55);
  const cur=s.places[s.places.length-1];
  const dots=Object.values(CITY).map(c=>{const [x,y]=prj(...c);return `<circle cx="${x}" cy="${y}" r="1.5" fill="#6a6a6a"/>`;}).join('');
  const home=CITY[s.home]?prj(...CITY[s.home]):null;
  let tour='';
  const T=s.lastTour;
  if(T&&s.year-T.year<=1){
    const base=prj(...CITY['서울']);
    const pts=[base,...T.stops.map(n=>CITY[n]?prj(...CITY[n]):ABROAD_PIN[n]).filter(Boolean)];
    tour=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ff9c1a" stroke-width="1.6" stroke-dasharray="4 3" stroke-opacity=".85"/>`+
      T.stops.map(n=>{const p=CITY[n]?prj(...CITY[n]):ABROAD_PIN[n];if(!p)return '';const ab=!CITY[n];return `<rect x="${p[0]-3.5}" y="${p[1]-3.5}" width="7" height="7" fill="#ff9c1a"/>${ab?`<text x="${clamp(p[0],14,226)}" y="${p[1]+(p[1]>200?-7:15)}" font-size="11" fill="#ffcf8a" text-anchor="middle" font-family="Galmuri11,monospace">${n}</text>`:''}`;}).join('');
  }
  let mark='';
  if(cur&&CITY[cur.city]){const [x,y]=prj(...CITY[cur.city]);mark=`<circle class="pulse" cx="${x}" cy="${y}" r="9" fill="none" stroke="#ffe600" stroke-width="2"/><circle cx="${x}" cy="${y}" r="5" fill="#ff2626" stroke="#fff" stroke-width="1.5"/>`;}
  return `<svg class="kmap" viewBox="0 0 240 400" role="img" aria-label="활동 지도">
    <polygon points="${land}" fill="#000" stroke="#fff" stroke-width="2" stroke-linejoin="miter"/>
    <ellipse cx="${jx}" cy="${jy}" rx="22" ry="12" fill="#000" stroke="#fff" stroke-width="2"/>
    ${dots}${tour}
    ${home?`<rect x="${home[0]-4}" y="${home[1]-4}" width="8" height="8" fill="none" stroke="#ffe600" stroke-width="1.5" transform="rotate(45 ${home[0]} ${home[1]})"/>`:''}
    ${mark}
  </svg>`;
}
function mapPanelHTML(s){
  const svg=mapSVG(s);const cur=s.places[s.places.length-1];
  const trail=s.places.slice(-4).reverse();
  const T=s.lastTour&&s.year-s.lastTour.year<=1?s.lastTour:null;
  return `<div class="panel p-map"><h3>활동 지도 <em>◇ 고향 ${esc(s.home)}${T?' · ■ 투어':''}</em></h3><div class="map-wrap">${svg}

    ${T?`<span class="tour-line">${T.year} ${esc(T.name)}: ${esc(T.stops.join(' · '))}</span>`:''}
    <ol class="trail">${trail.map(p=>`<li><i>${p.age}세</i>${esc(p.city)} · ${esc(p.label)}</li>`).join('')}</ol></div></div></div>`;

function rollGenetics(){
  const keys=Object.keys(TRAITS),t=[];
  while(t.length<2){
    const k=pick(keys);if(t.includes(k))continue;
    if(CONFLICT.some(([a,b])=>(a===k&&t.includes(b))||(b===k&&t.includes(a))))continue;
    t.push(k);
  }
  let pot=Math.round(gauss(70,9));
  if(t.includes('genius'))pot+=7;if(t.includes('lazy'))pot+=6;
  return {traits:t,pot:clamp(pot,45,97),strengths:[]};
}

function genreFit(s){if(!bandExists(s))return 0;const G=GENRES[s.band.genre];const have=new Set([s.inst,...activeMembers(s).map(m=>m.inst)]);return Math.min(G.fav.filter(i=>have.has(i)).length,3);}
function bandPower(s){
  if(!bandExists(s))return Math.round(mus(s)*.9);
  const ms=activeMembers(s);
  const arr=[mus(s),...ms.map(m=>m.skill)];
  let p=arr.reduce((a,b)=>a+b,0)/arr.length;
  CORE.forEach(c=>{if(!slotFilled(s,c))p-=5;});
  p+=genreFit(s)*1.7;
  p*=.86+s.band.chem/100*.28;
  return clamp(Math.round(p),1,99);
}
function memberLeave(s,m,why){
  s.band.members=s.band.members.filter(x=>x.id!==m.id);
  s.band.chem=clamp(s.band.chem-8,0,100);
  s.band.alumni=(s.band.alumni||[]).concat([{name:m.name,inst:m.inst,year:s.year}]);
  s.band.posted=s.band.posted||[];
  if(!s.band.posted.includes(m.inst)&&!s.band.members.some(x=>x.inst===m.inst))s.band.posted.push(m.inst);
  log(s,`${INST[m.inst].ko} ${J(m.name,'이/가')} 밴드를 떠났다. ${why||''}`.trim(),'bad');
}
const appBase=s=>clamp(bandPower(s)*.75+fameIdx(s)*.3+(s.age<19?-6:0),12,90);
function wantedInst(s){const b=s.band;const p=(b.posted||[]).filter(i=>INST[i]);return p.length?p:missingSlots(s);}
function makeApplicant(s,inst,src){
  const m=makeMember(s,inst,appBase(s)+R(-10,10)+(src==='팬'?6:0),s.age<19?s.age:clamp(s.age+R(-5,4),17,60));

function addApplicants(s,n,src){
  if(!bandExists(s))return 0;

    b.inbox.push(makeApplicant(s,inst,src));k++;

}
function cleanApplicant(m){['msg','src','exp','known','fee','est'].forEach(k=>delete m[k]);return m;}
function acceptApplicant(s,id){

  if(b.members.length>=MAX_MEMBERS)return '밴드가 꽉 찼다. 멤버는 나 포함 일곱 명까지.';

  b.inbox=b.inbox.filter(x=>x.id!==id);
  cleanApplicant(m);m.joined=s.year;b.members.push(m);b.chem=clamp(b.chem-3,0,100);
  b.posted=(b.posted||[]).filter(i=>i!==m.inst&&!(m.inst==='gv'&&(i==='vo'||i==='gt')));
  log(s,`${INST[m.inst].ko} ${J(m.name,'이/가')} ${b.name}에 합류했다.`,'good');
  return `${m.name} 합류! ${m.trait==='mood'?'첫 합주부터 웃음이 터졌다.':m.trait==='perfect'?'첫날부터 메트로놈을 꺼내 들었다.':'소리가 한층 단단해졌다.'}`;
}
function auditionApplicant(s,id){

function autoRecruit(s){

function themeHot(s){return s.flags.hotTheme||'청춘';}
const playable=(have,hook)=>HOOKS[hook].inst.some(i=>have.has(i));
function haveInsts(s){return new Set([s.inst,...activeMembers(s).map(m=>m.inst)]);}
function songParts(s,p){
  const G=GENRES[p.genre||genreOf(s)];
  const have=haveInsts(s);
  return {mood:G.mood.includes(p.mood),hook:G.hook.includes(p.hook),play:playable(have,p.hook),hot:p.theme===themeHot(s),off:bandExists(s)&&p.genre&&p.genre!==s.band.genre};
}
function songQuality(s,p){
  const a=s.attr,f=songParts(s,p);
  let q=a.compose*.34+a.lyric*.22+a.arrange*.2+a[INST[s.inst].main]*.08+bandPower(s)*.06+s.life.insp*.14;
  if(f.mood)q+=5;if(f.hook)q+=5;q+=f.play?3:-4;if(f.hot)q+=4;if(f.off)q-=3;
  if(hasItem(s,'home'))q+=3;if(hasItem(s,'studio'))q+=2;
  if(s.life.insp<20)q-=8;
  q+=gauss(0,6);
  return clamp(Math.round(q),5,99);
}
function makeSong(s,p,title){
  s.flags.songId=(s.flags.songId||0)+1;
  p.genre=p.genre||genreOf(s);
  const q=songQuality(s,p);
  const catchy=clamp(Math.round(q+(['chant','riff'].includes(p.hook)?6:0)+(p.mood==='bright'?4:0)+R(-6,6)),1,99);
  const depth=clamp(Math.round(q+(s.attr.lyric-50)*.25+(['calm','tender'].includes(p.mood)?4:0)+R(-6,6)),1,99);
  const song={id:s.flags.songId,title:(title||'무제').slice(0,24),genre:p.genre,theme:p.theme,mood:p.mood,hook:p.hook,q,catchy,depth,year:s.year,age:s.age,rid:null,peak:null,yr:0,total:0,by:bandName(s)};
  s.songs.push(song);
  lf(s,'insp',-16);tr(s,'compose',1.4);tr(s,'lyric',1.0);tr(s,'arrange',.6);
  return song;
}
function titleSugs(theme){return shuffle(THEMES[theme]||THEMES['청춘']).slice(0,3);}

/* ================= release & chart ================= */
const REL_KO={single:'싱글',ep:'EP',album:'정규 앨범'};
function relCost(s,type,mv){
  if(s.contract)return mv?0:0;
  const base={single:150,ep:600,album:1500}[type];
  return base+(mv?(type==='single'?300:500):0);
}
const promoOf=s=>s.contract?LABELS[s.contract.id].promo:0;
const shareOf=s=>s.contract?LABELS[s.contract.id].share:.9;
function powerToRank(p){const r=Math.round(100-(p-38)*1.75);return r>100?null:Math.max(1,r);}
function releaseNow(s,ids,type,title,mv){
  const songs=ids.map(id=>ownSong(s,id)).filter(Boolean).sort((a,b)=>b.q-a.q);
  s.flags.recId=(s.flags.recId||0)+1;
  const yearRel=s.releases.filter(r=>r.year===s.year).length;
  const L=s.contract?LABELS[s.contract.id]:null;
  const fi=fameIdx(s);
  const shortform=s.flags.shortform===s.year;
  let fans=0,best=null;
  songs.forEach((sg,i)=>{
    const title_=i===0;
    let p=sg.q*.55+fi*.45+(s.trend[sg.genre]-1)*30+promoOf(s)+(mv&&title_?5:0)+({single:0,ep:1,album:3}[type])+gauss(0,6)-yearRel*4-(title_?0:9);
    if(shortform)p+=(sg.catchy-60)*.12;
    p-=Math.max(0,s.age-34)*.6;
    if(s.flags.boom===s.year)p+=3;
    const rank=powerToRank(p);
    const pe=p>95?95+(p-95)*.4:p;
    const st=Math.round(Math.pow(10,pe/15)*12*(title_?1:.55)*R(.85,1.15));
    sg.rid=s.flags.recId;sg.peak=rank;sg.yr+=st;sg.total+=st;sg.relYear=s.year;
    fans+=st*.004;
    if(!best||(rank&&(!best.peak||rank<best.peak)))best=sg;
  });
  let review=null;
  if(type!=='single'){
    const avg=songs.reduce((a,b)=>a+b.depth*.6+b.q*.4,0)/songs.length;
    const coh=songs.filter(x=>x.genre===songs[0].genre).length/songs.length;
    review=clamp(Math.round(((avg-28)/12+coh*.6+(type==='album'?.3:0))*2)/2,1,5);
  }
  const rel={id:s.flags.recId,type,title:title||songs[0].title,year:s.year,age:s.age,songs:songs.map(x=>x.id),peak:best?.peak??null,review,mv:!!mv,label:L?L.name:'자체 제작',by:bandName(s)};
  s.releases.push(rel);
  const gained=addFans(s,fans+(review?Math.min(review*review*s.fans*.003,60000):0));
  const pk=rel.peak;
  const hits=s.flags.hits||0;
  if(pk===1){s.legacy+=hits?4:12;}else if(pk&&pk<=10)s.legacy+=hits>3?2:5;else if(pk&&pk<=50)s.legacy+=1.5;
  if(pk&&pk<=10)s.flags.hits=hits+1;
  if(review>=4.5)s.legacy+=6;else if(review>=4)s.legacy+=3;
  if(type==='album')s.legacy+=2;
  lf(s,'happy',pk&&pk<=20?10:4);lf(s,'insp',4);
  if(s.band)s.band.members.forEach(m=>m.bond=clamp(m.bond+(pk&&pk<=30?6:2),0,100));
  log(s,`${REL_KO[type]} 『${rel.title}』 발매. ${pk?`타이틀곡 「${best.title}」 차트 최고 ${pk}위.`:'차트 진입은 못 했다.'}${review?` 평론 ${review}점.`:''}`,pk&&pk<=10?'major':pk?'good':'');
  if(pk&&pk<=10)pushNews(s,`${bandName(s)} 「${best.title}」 ${pk}위… ${pk===1?'정상에 올랐다':'밴드 씬 새 얼굴'}`);
  return {rel,best,gained};
}
function releaseResultBody(s,r){

function releaseSpec(s,type,mv){

function autoRelease(s){
  if(s.age<15||!musicOn(s))return;
  const d=demos(s).sort((a,b)=>b.q-a.q);if(!d.length)return;
  const lastAlbum=Math.max(-99,...s.releases.filter(r=>r.type==='album').map(r=>r.year));
  let type=null,pickIds=[];
  if(d.length>=7&&s.year-lastAlbum>=2){type='album';pickIds=d.slice(0,10).map(x=>x.id);}
  else if(d.length>=4){type='ep';pickIds=d.slice(0,5).map(x=>x.id);}
  else if(!s.releases.some(r=>r.year===s.year)&&d[0].q>=Math.max(35,(s.releases.length?55:0))){type='single';pickIds=[d[0].id];}
  if(!type)return;
  const cost=relCost(s,type,false);if(wallet(s)<cost+(s.age>=19?500:0))return;
  spend(s,cost);
  releaseNow(s,pickIds,type,ownSong(s,pickIds[0]).title,false);
}
function catalogYear(s){
  // 올해 스트리밍 정산 → 다음 해 스트리밍 예상치로 굴린다
  const rel=s.songs.filter(x=>x.rid);
  if(!rel.length)return;
  const sum=rel.reduce((a,b)=>a+b.yr,0);
  const mine=rel.filter(x=>!x.sold).reduce((a,b)=>a+b.yr,0);
  const pay=Math.round(mine*.0004*shareOf(s)*(s.flags.rate||1));
  if(pay>=1){s.money+=pay;s.flags.lastRoyalty=pay;if(pay>=300)log(s,`음원 수익 정산 ${fmtMoney(pay)} (올해 스트리밍 ${fmtN(sum)}회).`);}
  rel.forEach(x=>{
    let n=x.yr*R(.35,.5);
    if(x.q>=58&&s.year-x.relYear>=2&&chance(.012+(s.flags.shortform===s.year?.02:0))){
      n=Math.max(n,Math.pow(10,(x.q*.6+fameIdx(s)*.4+8)/15)*12*R(.8,1.3));
      const rk=powerToRank(x.q*.6+fameIdx(s)*.4+10);
      if(rk&&(!x.peak||rk<x.peak))x.peak=rk;
      addFans(s,n*.004);s.legacy+=4;lf(s,'happy',8);
      log(s,`${x.relYear}년에 낸 「${x.title}」이(가) 숏폼에서 퍼지며 역주행했다.${rk?` 차트 ${rk}위.`:''}`,'major');
      pushNews(s,`${bandName(s)} 「${x.title}」 역주행… 발매 ${s.year-x.relYear}년 만`);
    }
    x.yr=Math.round(n);x.total+=x.yr;
  });
}
function rankings(s){
  const me=fameIdx(s)*.85+(()=>{const r=s.releases.filter(x=>x.year>=s.year-1&&x.peak);return r.length?(101-Math.min(...r.map(x=>x.peak)))*.14:0;})();
  const rows=s.rivals.map(r=>({n:r.n,g:r.g,p:r.p,real:r.real}));
  if(s.band||s.releases.length)rows.push({n:bandName(s),g:genreOf(s),p:me,me:true});
  return rows.sort((a,b)=>b.p-a.p);
}

function actAvailable(s,a){

function pickShow(s,small){
  const g=genreOf(s);
  if(!small){
    const fs=FESTS.filter(f=>s.fans>=f.fans*.5&&f.gen.includes(g)&&!(f.abroad&&s.age<18));
    if(fs.length&&chance(.6)){
      const f=fs[fs.length-1],ratio=s.fans/f.fans;
      const slot=ratio>=12?'헤드라이너':ratio>=3?'서브 헤드라이너':'낮 무대';
      const crowd=Math.round((slot==='헤드라이너'?35000:slot==='서브 헤드라이너'?14000:3000)*R(.8,1.15));
      const fee=({'낮 무대':150,'서브 헤드라이너':1200,'헤드라이너':7000}[slot])*(f.abroad?2:1);
      return {kind:'fest',name:f.n,city:f.city,abroad:f.abroad,slot,crowd,cap:crowd,fee,tier:VENUES.length};
    }
    if(inSchool(s)&&s.fans<400)return {kind:'school',name:`${s.school?.name||'학교'} 축제`,crowd:RI(150,400),cap:400,price:0,tier:1};
  }
  let ti=0;VENUES.forEach((x,i)=>{if(s.fans>=x.fans)ti=i;});
  if(small)ti=Math.max(0,Math.min(ti,3));
  const v=VENUES[ti];
  const demand=Math.round(s.fans*R(.1,.16)*(small?.6:1)+R(12,40));
  return {kind:'venue',name:v.n,cap:v.cap,crowd:Math.min(v.cap,demand),price:v.price,tier:ti};
}
function showBoard(show,res){
  const sold=res?res.crowd:show.crowd;
  return `<div class="gig-board"><div class="gig-top"><div class="venue">${esc(show.name)}</div><span class="cap">${show.kind==='fest'?`${esc(show.slot)} · ${esc(show.abroad||show.city)}`:`수용 ${show.cap.toLocaleString('ko-KR')}석`}</span></div>
    ${res?`<div class="gig-stats"><div><b>${fmtN(sold)}</b><span>관객</span></div><div><b>+${fmtN(res.fans)}</b><span>새 팬</span></div><div><b>${res.money?fmtMoney(res.money).replace(' 원',''):'0'}</b><span>수익</span></div><div><b>${Math.round(res.score*100)}%</b><span>판정</span></div></div>`
      :`<div class="sb-note">예상 관객 ${fmtN(sold)}명${show.kind==='fest'?` · 출연료 ${fmtMoney(show.fee)}`:show.price?` · 티켓 ${show.price}만 원`:''}</div>`}
    ${res&&res.tags.length?`<div class="gig-awards">${res.tags.map(t=>`<i>${esc(t)}</i>`).join('')}</div>`:''}</div>`;
}
function rgWindow(s){
  let w=118+(s.attr.stage-50)*.5+(s.attr.rhythm-50)*.6+(s.gear||0)*5;
  if(has(s,'stagey'))w+=25;if(has(s,'shy'))w-=25;if(s.life.mental<30)w-=15;
  return clamp(Math.round(w),70,195);
}
function autoP(s){return clamp(.28+(mus(s)-50)*.012+(s.attr.stage-50)*.006+(s.band?(s.band.chem-50)*.003:0)+(has(s,'stagey')?.06:0)-(has(s,'shy')?.08:0),.08,.93);}
function autoScore(s){return clamp(gauss(autoP(s)*.9+.08,.12),.05,.99);}
function liveCfg(s,show,song,small){
  return {kicker:`${show.name} · LIVE`,title:song?`「${song.title}」`:'떼창 커버곡',board:showBoard(show),
    notes:small?8:11+Math.min(show.tier||0,7),bpm:song?GENRES[song.genre].bpm:122,win:rgWindow(s),p:autoP(s),
    done:(q,score)=>{const r=liveResolve(s,show,song,score,small);return {text:r.text,board:showBoard(show,r),nolog:1};}};
}
function liveResolve(s,show,song,score,small){
  const bp=bandPower(s)/100,st=s.attr.stage/100;
  const perf=clamp(score*.55+bp*.3+st*.15,0,1);
  const crowd=show.crowd;
  const fanMul=show.kind==='fest'?1.6:show.kind==='school'?.6:small?.7:1;
  const sq=song?song.q/100:.45;
  const fans=addFans(s,crowd*(.04+perf*.22)*fanMul*(song?(.6+sq*.8):.7)+3);
  let money=0;
  if(show.kind==='fest')money=show.fee;
  else if(show.kind==='venue')money=Math.round(crowd*show.price*(s.contract?.4:.6)*(.7+perf*.5));
  if(s.band&&s.band.members.length)money=Math.round(money/(s.band.members.length+1)*1.6);
  earn(s,money);
  s.stats.gigs++;s.stats.crowd+=crowd;
  const tags=[];
  if(show.kind==='fest'){s.stats.fests++;if(show.slot==='헤드라이너'){s.legacy+=s.flags.headlined?3:10;s.flags.headlined=1;tags.push('헤드라이너');}else if(show.slot==='서브 헤드라이너'){s.legacy+=2;tags.push('서브 헤드라이너');}else s.legacy+=.5;}
  if(show.name==='KSPO DOME'&&!s.flags.kspo){s.flags.kspo=1;s.legacy+=8;tags.push('첫 체조경기장');}
  if(show.name==='고척스카이돔'&&!s.flags.dome){s.flags.dome=1;s.legacy+=12;tags.push('첫 돔 공연');}
  if(!small&&show.kind==='venue'&&crowd>=show.cap&&show.cap>=700){tags.push('전석 매진');s.legacy+=1;}
  lf(s,'mental',(perf-.5)*16);lf(s,'happy',perf*8);lf(s,'health',-3);lf(s,'insp',3);tr(s,'stage',small?.8:1.4);
  if(s.band)s.band.members.forEach(m=>m.bond=clamp(m.bond+(perf-.45)*12,0,100));
  if(score>=.9&&chance(.35)){const v=addFans(s,Math.min(s.fans*.05,30000)+200);tags.push('직캠 바이럴');log(s,`${show.name} 무대 직캠이 퍼졌다. 팬 ${fmtN(v)}명 증가.`,'good');}
  const rx=perf>=.8?'앵콜 함성이 그치지 않았다.':perf>=.62?'관객들이 끝까지 뛰었다. 좋은 공연이었다.':perf>=.45?'무난한 공연. 몇 군데 박자가 흔들렸다.':'실수가 이어졌다. 대기실이 조용했다.';
  const txt=`${show.name}${show.kind==='fest'?` ${show.slot}`:''}. ${song?`하이라이트 「${song.title}」. `:''}${rx}`;
  log(s,`${txt} 관객 ${fmtN(crowd)}명, 팬 +${fmtN(fans)}.`,show.kind==='fest'&&show.slot!=='낮 무대'||tags.some(t=>t.startsWith('첫'))?'major':perf>=.62?'good':perf<.45?'bad':'');
  s.flags.lastGig={name:show.name,year:s.year};
  if(bandExists(s)&&perf>=.6&&chance(.35)&&addApplicants(s,1,'공연을 보고'))tags.push('지원서 도착');
  return {text:txt,fans,money,crowd,score,tags};
}
function liveIntro(s){
  if(!musicOn(s)||s.age<14)return null;
  const show=pickShow(s);
  const songs=s.songs.slice().sort((a,b)=>b.q-a.q).slice(0,5);
  const top=songs.slice(0,3);
  const auto=()=>{const r=liveResolve(s,show,top[0]||null,autoScore(s));return {text:r.text,nolog:1};};
  if(s.flags.noLive===s.year)return null;
  if(s.routine?.on&&s.routine.liveAuto&&!UI.skip){const r=auto();toast('올해의 무대 · 자동',r.text,'');return null;}
  return {kicker:`${s.year} · 올해의 무대`,title:show.kind==='fest'?`페스티벌 ${show.slot} 섭외`:show.kind==='school'?'학교 축제 무대':`${bandName(s)} 단독 공연`,board:showBoard(show),
    body:`${songs.length?`<div class="setlist"><small>SETLIST · ${esc(bandName(s))}</small><ol>${songs.map(x=>`<li>${esc(x.title)}</li>`).join('')}</ol></div>`:'<p>아직 우리 곡이 없다. 커버곡으로 무대를 채운다.</p>'}
      <p class="sb-note">하이라이트 곡을 골라 직접 연주한다. 곡의 완성도가 높을수록 팬이 많이 늘고, BPM이 빠를수록 노트가 촘촘하다.</p>`,
    choices:[...top.map(x=>({label:`「${x.title}」`,sub:`${GENRES[x.genre].ko} · BPM ${GENRES[x.genre].bpm} · 완성도 ${gradeQ(x.q)}${x.rid?'':' · 미발매 신곡'}`,tag:gradeQ(x.q),act:()=>({rhythm:liveCfg(s,show,x)})})),
      {label:'떼창 커버곡',sub:'익숙한 노래라 분위기는 잡히지만 팬은 덜 는다',act:()=>({rhythm:liveCfg(s,show,null)})}],
    auto};
}
function gigSpec(s){
  const show=pickShow(s,true);
  const top=s.songs.slice().sort((a,b)=>b.q-a.q)[0]||null;
  return {kicker:`${s.year} · 클럽 공연`,title:show.name,board:showBoard(show),body:`<p>${top?`오늘의 마지막 곡은 「${esc(top.title)}」.`:'커버곡 세 곡으로 짧은 무대를 채운다.'}</p>`,
    choices:[{label:'무대에 오른다',primary:true,act:()=>({rhythm:liveCfg(s,show,top,true)})}],
    auto:()=>{const r=liveResolve(s,show,top,autoScore(s),true);return {text:r.text,nolog:1};}};
}

/* ================= tours ================= */
function tourCost(s,T){return Math.round(T.cost*(hasItem(s,'van')?.75:1)*(s.contract?.5:1));}
function tourGate(s,k){
  const T=TOURS[k];
  if(!bandOn(s)&&s.stage!=='musician')return '활동 중일 때만';
  if(s.age<18)return '18세 이상';
  if(s.flags.noLive===s.year)return '올해는 공연이 모두 중단됐다';
  if(s.fans<T.min)return `팬 ${fmtN(T.min)}명 필요`;
  if(s.flags.yearly.tour)return '올해 이미 투어를 돌았다';
  if(s.ap<T.ap)return `행동 ${T.ap} 필요`;
  if(wallet(s)<tourCost(s,T))return `경비 ${fmtMoney(tourCost(s,T))} 필요`;
  return '';
}
function tourSpec(s,k){
  const T=TOURS[k];const cost=tourCost(s,T);
  return {kicker:`${s.year} · 투어 기획`,title:T.n,
    body:`<p>${(T.cities||T.abroad).join(' → ')}</p><p class="sb-note">경비 ${fmtMoney(cost)} · 행동 ${T.ap} 소모 · 체력이 크게 깎인다. 관객 수는 팬 규모와 운에 달렸다.</p>`,
    choices:[{label:'투어를 떠난다',primary:true,act:()=>runTour(s,k)},{label:'다음에',act:()=>null}]};
}
function runTour(s,k){
  const T=TOURS[k];const cost=tourCost(s,T);
  if(!spend(s,cost))return '경비가 모자라다.';
  s.ap-=T.ap;s.flags.yearly.tour=1;
  const stops=(T.cities||T.abroad).slice();
  const capPer=k==='club'?600:k==='asia'?3000:k==='world'?12000:9000;
  let att=0;const rows=stops.map(n=>{const a=Math.round(Math.min(capPer,s.fans*T.fill*R(.55,1.25)+R(40,120)));att+=a;return [n,a];});
  const perf=clamp(bandPower(s)/100*.6+s.attr.stage/100*.4+R(-.1,.1),0,1);
  const gross=Math.round(att*T.price*(s.contract?.45:.65));
  earn(s,gross);
  const fans=addFans(s,att*(.12+perf*.2)*(T.abroad?1.4:1));
  s.stats.tours++;s.stats.crowd+=att;s.stats.gigs+=stops.length;
  const tk='tour_'+k;s.legacy+={club:1.5,arena:5,asia:4,world:10}[k]*(s.flags[tk]?.3:1);s.flags[tk]=1;
  lf(s,'health',-10);lf(s,'happy',6);lf(s,'insp',8);tr(s,'stage',2);tr(s,'stamina',1.2);
  if(s.band){s.band.chem=clamp(s.band.chem+(perf>.55?5:-6),0,100);s.band.members.forEach(m=>m.bond=clamp(m.bond+(perf>.55?4:-5),0,100));}
  s.lastTour={year:s.year,name:T.n,stops};
  const net=gross-cost;
  log(s,`${T.n} (${stops.join(', ')}) 완주. 관객 ${fmtN(att)}명, 순수익 ${fmtMoney(net)}.`,'major');
  return {text:`${stops.length}개 도시, 관객 ${fmtN(att)}명. ${net>=0?`순수익 ${fmtMoney(net)}.`:`적자 ${fmtMoney(-net)}. 그래도 팬은 늘었다.`} 새 팬 ${fmtN(fans)}명.`,nolog:1,
    board:`<div class="gig-board"><div class="gig-top"><div class="venue">${esc(T.n)}</div><span class="cap">${stops.length} CITIES</span></div>
      <div class="gig-stats" style="grid-template-columns:repeat(${Math.min(rows.length,3)},minmax(0,1fr))">${rows.map(([n,a])=>`<div><b>${fmtN(a)}</b><span>${esc(n)}</span></div>`).join('')}</div></div>`};
}

/* ================= labels ================= */
function makeOffer(s,id,resign){
  const L=LABELS[id];
  const adv=Math.round(R(L.adv[0],L.adv[1])*(.7+fameIdx(s)/150)*(resign?1.15:1)/10)*10;
  return {id,adv,years:RI(2,4),resign:!!resign};
}
function genOffers(s){
  const ok=Object.keys(LABELS).filter(id=>s.fans>=LABELS[id].min*R(.75,1.1)&&!(LABELS[id].abroad&&s.age<20));
  return shuffle(ok).sort((a,b)=>LABELS[b].tier-LABELS[a].tier).slice(0,3).map(id=>makeOffer(s,id));
}
function signLabel(s,o){
  const L=LABELS[o.id];
  s.contract={id:o.id,years:o.years,adv:o.adv,since:s.year};
  const got=earn(s,o.adv);
  lf(s,'happy',8);if(L.tier===3)s.legacy+=2;
  log(s,`${L.name}와(과) ${o.years}년 계약. 계약금 ${fmtMoney(got)}${s.age<19?'(가족 예산으로)':''}.`,'major');
  return `${L.name}. 사무실 벽에 우리 밴드 포스터가 붙었다.${L.control?' 다만 첫 미팅부터 콘셉트 회의가 길었다.':''}`;
}
function offerSpec(s,offers,why){
  const head=why==='expire'?'레이블 계약이 끝났다.':why==='pitch'?'데모를 들은 레이블에서 연락이 왔다.':'레이블들이 연락해 왔다.';
  return {kicker:`${s.year} · 레이블`,title:why==='expire'?'재계약 시즌':'계약 제안',
    body:`<p>${head}</p><p class="sb-note">수익 배분은 음원·공연 수익 중 우리 몫. 홍보력이 높을수록 차트 성적이 오른다. 계약하면 녹음·뮤직비디오 비용은 레이블이 낸다.</p>`,
    choices:[...offers.map(o=>{const L=LABELS[o.id];return {label:`${L.name}${o.resign?' · 재계약':''}`,
      sub:`계약금 ${fmtMoney(o.adv)} · ${o.years}년 · 우리 몫 ${Math.round(L.share*100)}% · 홍보력 ${'●'.repeat(L.tier)}${'○'.repeat(3-L.tier)}${L.control?' · 콘셉트 간섭':''}${L.abroad?` · ${L.abroad} 진출`:''}`,
      act:()=>signLabel(s,o)};}),
      {label:'자체 제작으로 간다',sub:'수익 90%가 우리 몫. 제작비는 직접 낸다',act:()=>{s.contract=null;s.flags.declined=s.year;lf(s,'happy',2);return '우리 음악은 우리가 만든다. 통장은 가볍지만 마음은 편하다.';}}]};
}
function pitchChance(s,id){
  const L=LABELS[id];const best=Math.max(0,...s.songs.map(x=>x.q));
  return clamp(.12+(s.fans/L.min-1)*.3+(best-60)*.012-(L.tier-1)*.05,.02,.9);
}
function pitchSpec(s){
  const ids=Object.keys(LABELS).filter(id=>!(LABELS[id].abroad&&s.age<20));
  return {kicker:`${s.year} · 데모 투고`,title:'레이블에 데모 보내기',
    body:`<p>가장 좋은 데모를 골라 메일을 보낸다. 1년에 한 번만 보낼 수 있다.</p>`,
    choices:[...ids.map(id=>{const L=LABELS[id],p=pitchChance(s,id);return {label:L.name,sub:`${L.desc} 팬 기준 ${fmtN(L.min)}명`,tag:`${Math.round(p*100)}%`,
      act:()=>{s.flags.yearly.pitch=1;if(chance(p)){return {spec:offerSpec(s,[makeOffer(s,id)],'pitch')};}lf(s,'mental',-3);return `${L.name}에서 답장이 왔다. "좋은데, 지금은 아닌 것 같아요."`;}};}),
      {label:'그만둔다',act:()=>null}]};
}

/* ================= news ================= */
function pushNews(s,t){s.news.push({year:s.year,t});if(s.news.length>40)s.news.shift();log(s,t,'news');}
const NEWS_RIVAL=[
  r=>`${r}, 정규 ${RI(2,5)}집으로 음원 차트 1위`,r=>`${r}, 데뷔 ${RI(3,9)}년 만에 첫 단독 공연 매진`,r=>`${r} 멤버 탈퇴… 새 멤버 공개 오디션`,
  r=>`${r}, 활동 중단 선언 "각자의 시간을 갖겠다"`,r=>`${r}, 일본 투어 전석 매진`,r=>`${r}, 신곡 뮤직비디오 1,000만 뷰 돌파`,r=>`${r} 보컬, 솔로 앨범 발표`];
const NEWS_IND=['홍대 라이브 클럽 대관료 1년 새 20% 올라','공연 암표 단속법 시행','음악 방송, 밴드 라이브 코너 신설','LP 공장 증설… 바이닐 붐 이어져','스트리밍 1회당 정산액 소폭 하락','인디 뮤지션 창작지원금 확대','악기 가격 환율 따라 줄줄이 인상','대학 축제 섭외 1순위는 밴드','숏폼 배경음악 저작권 정산 개편'];
const BIG_NEWS=[
  {id:'boom',title:'밴드 붐이 왔다',body:'음원 차트 100위 안에 밴드 곡이 서른 곡을 넘었다. 합주실 예약이 두 달 치 꽉 찼다.',
    apply:s=>{s.flags.boom=s.year;['bandpop','modern','alt','punk'].forEach(g=>s.trend[g]=clamp(s.trend[g]+.15,.6,1.6));addFans(s,Math.min(s.fans*.06,40000));}},
  {id:'shutdown',title:'공연장이 문을 닫았다',body:'감염병 확산으로 올해 모든 공연과 페스티벌이 취소됐다. 버스킹도 금지다.',cond:s=>s.year>=START_YEAR+3&&!s.flags.hadShutdown,
    apply:s=>{s.flags.noLive=s.year;s.flags.hadShutdown=1;lf(s,'happy',-6);s.flags.rate=(s.flags.rate||1)*1.05;}},
  {id:'shortform',title:'숏폼 챌린지가 차트를 흔든다',body:'15초짜리 챌린지에 쓰인 곡이 차트를 거꾸로 오른다. 대중성 높은 곡이 유리하고, 옛 곡의 역주행 확률이 오른다.',
    apply:s=>{s.flags.shortform=s.year;}},
  {id:'vinyl',title:'LP 판매 30년 만에 최고',body:'정규 앨범을 LP로 사는 사람들이 늘었다. 음원 수익이 조금 오른다.',apply:s=>{s.flags.rate=(s.flags.rate||1)*1.08;}},
  {id:'platform',title:'스트리밍 정산 방식 개편',body:'음원 플랫폼이 정산 기준을 바꿨다.',apply:s=>{const up=chance(.5);s.flags.rate=(s.flags.rate||1)*(up?1.15:.87);s.flags.tmpNews=up?'이용자 중심 정산으로 바뀌며 밴드 음악 몫이 늘었다.':'정산 단가가 떨어졌다. 음원 수익이 줄어든다.';}},
  {id:'survival',title:'오디션 「밴드 서바이벌」 방영 확정',body:'방송국이 밴드 오디션 프로그램 참가자를 모집한다. 우승 팀은 단숨에 전국구가 된다.',cond:s=>(bandOn(s)||s.stage==='musician')&&s.age>=16&&s.age<=40&&s.fans<120000,
    apply:s=>{s.flags.survivalYear=s.year;}},
];
function newsYear(s,quiet){
  for(const g in s.trend)s.trend[g]=clamp(s.trend[g]*R(.9,1.1)+(1-s.trend[g])*.12,.65,1.6);
  s.flags.hotTheme=pick(Object.keys(THEMES));
  s.rivals.forEach(r=>{r.p=clamp(r.p+(r.real?(s.year>2029?-R(.4,2):R(-1,1)):gauss(0,3)+(s.trend[r.g]-1)*4),20,99);});
  const top=Object.keys(s.trend).sort((a,b)=>s.trend[b]-s.trend[a])[0];
  if(top!==s.flags.topGenre){s.flags.topGenre=top;pushNews(s,`올해 음원 차트는 ${GENRES[top].ko} 강세`);}
  const fict=s.rivals.filter(r=>!r.real);
  if(chance(.85))pushNews(s,pick(NEWS_RIVAL)(pick(fict).n));
  if(chance(.5))pushNews(s,pick(NEWS_IND));
  const dead=fict.find(r=>r.p<28);

  if(s.year<=START_YEAR+1||!chance(.14))return null;

  if(quiet)return null;

function awardsCheck(s,yr){
  const rels=s.releases.filter(r=>r.year===yr);if(!rels.length)return [];
  const out=[];const songs=rels.flatMap(r=>r.songs.map(id=>ownSong(s,id))).filter(Boolean);
  const best=songs.slice().sort((a,b)=>b.q-a.q)[0];
  const pk=Math.min(...songs.map(x=>x.peak||999));
  const first=!s.releases.some(r=>r.year<yr);
  if(first&&(best.q>=62||pk<=40)&&chance(.45+(best.q-62)*.02))out.push({key:'rookie',name:`${yr} 올해의 신인`,leg:6});
  if(best.q>=78&&chance(clamp((best.q-74)*.05,.05,.7)))out.push({key:'song',name:`${yr} 올해의 노래 「${best.title}」`,leg:10});
  rels.filter(r=>r.review>=4&&r.type!=='single').forEach(r=>{if(chance((r.review-3.6)*.8))out.push({key:'album',name:`${yr} 올해의 앨범 『${r.title}』`,leg:12});});
  if((pk===1||(s.fans>=150000&&pk<=5))&&chance(.5))out.push({key:'artist',name:`${yr} 올해의 아티스트`,leg:14});
  return out;
}
function awardsSpec(s,list,yr){

  log(s,`밴드 뮤직 어워즈 ${list.map(a=>a.name.replace(/^\d+ /,'')).join(', ')} 수상.`,'major');
  lf(s,'happy',12);lf(s,'mental',6);

    body:`<div class="gig-awards" style="margin-bottom:10px">${list.map(a=>`<i>${esc(a.name)}</i>`).join('')}</div><p>무대 조명이 이쪽을 비췄다. 트로피가 생각보다 무겁다. 마이크 앞에서 무슨 말을 할까.</p>`,

function eligible(s,e){
  if(e.once&&s.flags['ev_'+e.id])return false;
  if(e.age&&(s.age<e.age[0]||s.age>e.age[1]))return false;
  if(e.stages&&!e.stages.includes(s.stage))return false;
  if(s.stage==='army'&&!['crush','parents_ill','enlist_think','trip','cat'].includes(e.id))return false;
  try{if(e.cond&&!e.cond(s))return false;}catch(err){return false;}
  return true;
}
function pickEvents(s,n){
  const pool=EVENTS.filter(e=>eligible(s,e)),out=[];
  while(out.length<n&&pool.length){
    const tot=pool.reduce((a,e)=>a+(e.w||1),0);let r=rnd()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w||1;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return out;
}
function eventSpec(s,e){
  if(!eligible(s,e))return null;
  if(e.pre)e.pre(s);
  if(e.once)s.flags['ev_'+e.id]=1;
  let face=null;try{face=e.face?e.face(s):null;}catch(err){face=null;}
  return {kicker:`${s.year} · ${s.age}세`,title:e.title,face:face||s.look,faceInst:face?null:s.inst,body:`<p>${typeof e.body==='function'?e.body(s):e.body}</p>`,
    choices:e.choices.map(c=>({label:c.t,sub:c.sub,disabled:!!(c.cond&&!c.cond(s)),reason:c.sub,act:()=>c.f(s)}))};
}

    if(a>=38){const dec={stamina:1.4,vocal:.9,tech:.6,rhythm:.5,stage:.3,arrange:-.2,compose:-.1,lyric:-.3}[k]*(1+(a-38)*.12);d-=dec*R(.5,1.2);}
    if(s.stage==='army'&&!s.flags.mband&&['tech','vocal','rhythm','stage'].includes(k))d-=R(1,2.4);

  if(s.age>=20){const living=Math.round(900+(hasItem(s,'officetel')||hasItem(s,'house')?0:500)+Math.max(0,s.career2?.income||0)*.12+(s.stage==='army'?-1400:0));s.money-=Math.max(0,living);}

const SNAP_LIFE={happy:'행복',health:'건강',mental:'멘탈',insp:'영감',smarts:'학업'};
function snap(s){const o={'음악성':mus(s),'팬':s.fans};for(const k in SNAP_LIFE)o[SNAP_LIFE[k]]=s.life[k];for(const k of ATTRS)o[ATTR_KO[k]]=s.attr[k];o['돈']=s.money;o['가족 예산']=famBudget(s);if(s.band)o['밴드 합']=s.band.chem;return o;}
function deltas(a,b){
  const out=[];
  for(const k in a){
    if(!(k in b))continue;
    const d=b[k]-a[k];
    if(k==='돈'||k==='가족 예산'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">${k} ${d>0?'+':'-'}${fmtMoney(Math.abs(d))}</i>`);continue;}
    if(k==='팬'){if(Math.abs(d)>=1)out.push(`<i class="${d<0?'neg':''}">팬 ${d>0?'+':'-'}${fmtN(Math.abs(d))}</i>`);continue;}
    const r=Math.round(d);
    if(r!==0)out.push(`<i class="${r<0?'neg':''}">${k} ${r>0?'+':''}${r}</i>`);
  }
  return out.length?`<div class="deltas">${out.join('')}</div>`:'';
}
function nextModal(){
  while(queue.length){
    if(!S.alive)break;
    let spec=null;
    try{spec=queue.shift()();}catch(e){console.error(e);}
    if(!spec)continue;
    if(UI.skip){
      if(autoResolve(spec))continue;
      const st=UI.skip.start;UI.skip=null;queue.unshift(()=>spec);save();
      showModal(skipSummarySpec(S,st,'decision'));return;
    }
    showModal(spec);return;
  }
  closeModal();
  save();render();
  if(UI.skip){
    if(!S||!S.alive){UI.skip=null;return;}
    if(UI.skip.left>0){UI.skip.left--;toast('시간 건너뛰는 중',`${S.age}세 · ${S.year}년`,'');setTimeout(()=>ageUp(true),15);}
    else{const st=UI.skip.start;UI.skip=null;showModal(skipSummarySpec(S,st,'done'));}
  }
}
/* ---- sound (square-wave beeps, off with the 소리 button) ---- */
const SND={on:true,ctx:null};
try{SND.on=localStorage.getItem(SAVE_KEY+':snd')!=='0';}catch(e){}
function sfx(type,f){
  if(!SND.on)return;
  try{
    if(!SND.ctx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;SND.ctx=new A();}
    const c=SND.ctx;if(c.state==='suspended')c.resume();
    const t=c.currentTime;
    const beep=(fr,d,v,wave,at)=>{const o=c.createOscillator(),g=c.createGain();o.type=wave||'square';o.frequency.setValueAtTime(fr,t+(at||0));
      g.gain.setValueAtTime(v,t+(at||0));g.gain.exponentialRampToValueAtTime(.0001,t+(at||0)+d);o.connect(g);g.connect(c.destination);o.start(t+(at||0));o.stop(t+(at||0)+d+.02);};
    if(type==='blip')beep(300+Math.random()*40,.03,.025);
    else if(type==='move')beep(660,.035,.03);
    else if(type==='ok')beep(990,.06,.035);
    else if(type==='note')beep(f||523,.14,.045,'triangle');
    else if(type==='miss')beep(98,.14,.04,'sawtooth');
    else if(type==='fan'){[523,659,784,1046].forEach((fr,i)=>beep(fr,.12,.035,'square',i*.09));}
  }catch(e){}
}
/* ---- typewriter ---- */
const TW={timer:0,finish:null};
const reduceMotion=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
function stopType(){if(TW.timer){clearInterval(TW.timer);TW.timer=0;}TW.finish=null;}
function typeIn(root,onDone){
  stopType();
  const texts=[];
  root.querySelectorAll(':scope > p:not(.sb-note), :scope > .result').forEach(el=>{
    const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){if(n.nodeValue.trim()){texts.push([n,n.nodeValue]);n.nodeValue='';}}});
  const done=()=>{stopType();texts.forEach(([n,v])=>n.nodeValue=v);onDone&&onDone();};
  if(!texts.length||reduceMotion()||UI.skip){done();return;}
  let i=0,j=0,tick=0;
  TW.finish=done;
  TW.timer=setInterval(()=>{
    for(let k=0;k<2;k++){
      if(i>=texts.length){done();return;}
      const [n,v]=texts[i];j++;n.nodeValue=v.slice(0,j);
      if(j>=v.length){i++;j=0;}
    }
    if(++tick%2===0)sfx('blip');
  },30);
}
function revealChoices(){const box=$('#mChoices');box.classList.remove('wait');const f=box.querySelector('button:not(:disabled)');f&&f.focus({preventScroll:true});}
function setFace(spec){

  else{el.innerHTML='';el.hidden=true;}
}
function stopRG(){if(RG.active||RG.raf){RG.active=false;cancelAnimationFrame(RG.raf);RG.raf=0;}if(RG.key){window.removeEventListener('keydown',RG.key);RG.key=null;}}
function showModal(spec){

    b.onclick=()=>{if(TW.finish){TW.finish();return;}sfx('ok');const before=snap(S);let r;try{r=c.act();}catch(e){console.error(e);r=null;}handleResult(spec,r,before);};
    box.appendChild(b);

function handleResult(spec,r,before){
  const d=deltas(before,snap(S));
  render();
  if(r==null){nextModal();return;}
  if(typeof r==='string'){log(S,`${spec.title}: ${r}`);resultView(spec,r,d,null);return;}
  if(r.rhythm){showRhythm(r.rhythm,before);return;}
  if(r.spec){showModal(r.spec);return;}
  if(r.text){if(!r.nolog)log(S,`${spec.title}: ${r.text}`);resultView(spec,r.text,d,r.next||null,r.board);return;}
  nextModal();
}

function closeModal(){stopRG();stopType();UI.modalOpen=false;UI.spec=null;$('#modal').hidden=true;}
/* keyboard: arrows move, Z / Enter confirm, typing skips */
window.addEventListener('keydown',e=>{
  if($('#modal').hidden||RG.active)return;
  const tag=(e.target&&e.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  const k=e.key;
  if(TW.finish&&(k==='z'||k==='Z'||k==='Enter'||k===' '||k==='x'||k==='X')){e.preventDefault();TW.finish();return;}
  const list=[...document.querySelectorAll('#mChoices .choice:not(:disabled)')];
  if(!list.length)return;
  const i=list.indexOf(document.activeElement);
  if(k==='ArrowDown'||k==='ArrowRight'){e.preventDefault();list[(i+1)%list.length].focus();sfx('move');}
  else if(k==='ArrowUp'||k==='ArrowLeft'){e.preventDefault();list[(i-1+list.length)%list.length].focus();sfx('move');}
  else if(k==='z'||k==='Z'){e.preventDefault();(i>=0?list[i]:list[0]).click();}
});

/* ---- rhythm game ---- */
const RG={raf:0,active:false,key:null};
const SCALE=[523,587,659,784,880,1046,880,784,659,587];
function noteSVG(){return `<svg viewBox="0 0 7 8" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M3 0h3v1h-3zM3 1h1v5h-1zM6 1h1v2h-1zM1 5h2v1h-2zM0 6h4v1h-4zM1 7h2v1h-2z"/></svg>`;}
function showRhythm(cfg,before){
  stopRG();stopType();UI.modalOpen=true;$('#modal').hidden=false;
  $('#mKicker').textContent=cfg.kicker||'';
  $('#mTitle').textContent=cfg.title||'';
  setFace(null);
  const n=cfg.notes||10,beat=60000/(cfg.bpm||120);
  const unit=beat<420?beat*2:beat;
  const times=[];let t=1600;
  for(let i=0;i<n;i++){times.push(t);t+=Math.max(230,unit*pick([1,1,1,.5,1.5,2]));}
  const travel=clamp(1900-(cfg.bpm||120)*3.2,1150,1650);
  const win=cfg.win||120,perfW=Math.max(45,win*.42);
  $('#mBody').innerHTML=`${cfg.board||''}${cfg.body?`<p class="sb-note">${cfg.body}</p>`:''}
    <div class="rg"><div class="rg-row"><span>BPM <b>${cfg.bpm||120}</b> · 노트 <b>${n}</b></span><span>PERFECT <b id="rgP">0</b> GOOD <b id="rgG">0</b> MISS <b id="rgM">0</b></span></div>
    <div class="rg-track" id="rgTrack" aria-label="리듬 트랙"><div class="rg-hit" id="rgHit"></div>${times.map((_,i)=>`<div class="rg-note" data-i="${i}" style="left:110%">${noteSVG()}</div>`).join('')}</div>
    <div class="rg-fb" id="rgFb">READY?</div><p class="sb-note rg-hint">${esc(cfg.hint||'음표가 빨간 선에 닿을 때 누르기 · 스페이스바 / Z / 화면 탭')}</p></div>`;
  const box=$('#mChoices');box.innerHTML='';box.classList.remove('wait');
  const go=document.createElement('button');go.className='choice primary rg-go';go.innerHTML='<span class="c-main"><strong>연주 시작</strong></span>';
  const auto=document.createElement('button');auto.className='choice';auto.innerHTML=`<span class="c-main"><strong>감에 맡기기</strong><small>미니게임 없이 실력으로 판정</small></span><span class="c-tag">${Math.round((cfg.p??.5)*100)}%</span>`;
  box.append(go,auto);
  const notes=[...document.querySelectorAll('.rg-note')];
  const judged=new Array(n).fill(null);const cnt={perfect:0,good:0,miss:0};
  let t0=0,started=false,hitN=0;const HIT=.12;
  const fb=q=>{const el=$('#rgFb');el.textContent=q.toUpperCase();el.className='rg-fb '+q;const h=$('#rgHit');h.classList.add('flash');setTimeout(()=>h&&h.classList.remove('flash'),90);};
  const upd=()=>{$('#rgP').textContent=cnt.perfect;$('#rgG').textContent=cnt.good;$('#rgM').textContent=cnt.miss;};
  const judge=(i,q)=>{judged[i]=q;cnt[q]++;notes[i].classList.add(q==='miss'?'missed':'done');upd();fb(q);if(q==='miss')sfx('miss');else sfx('note',SCALE[(hitN++)%SCALE.length]*(q==='perfect'?1:.5));};
  const finish=()=>{
    stopRG();
    const score=(cnt.perfect+cnt.good*.6)/n;
    const q=score>=.85?'perfect':score>=.55?'good':'miss';
    const el=$('#rgFb');el.textContent=`${Math.round(score*100)}%`;el.className='rg-fb '+q;
    go.disabled=true;auto.disabled=true;if(q!=='miss')sfx('fan');
    setTimeout(()=>{let r;try{r=cfg.done(q,score,false);}catch(e){console.error(e);r=null;}handleResult(cfg,r,before);},750);
  };
  const tick=now=>{
    if(!RG.active)return;
    if(!document.body.contains(notes[0])){stopRG();return;}
    const el=now-t0;
    for(let i=0;i<n;i++){const dt=times[i]-el;notes[i].style.left=((HIT+dt/travel*(1-HIT+.05))*100)+'%';if(!judged[i]&&dt<-win)judge(i,'miss');}
    if(el>times[n-1]+win+400){finish();return;}
    RG.raf=requestAnimationFrame(tick);
  };
  const press=()=>{
    if(!RG.active)return;
    const el=performance.now()-t0;let bi=-1,bd=1e9;
    for(let i=0;i<n;i++){if(judged[i])continue;const d=Math.abs(times[i]-el);if(d<bd){bd=d;bi=i;}}
    if(bi<0||bd>win+60)return;
    judge(bi,bd<=perfW?'perfect':bd<=win?'good':'miss');
  };
  const begin=()=>{if(started)return;started=true;RG.active=true;t0=performance.now();go.innerHTML='<span class="c-main"><strong>HIT!</strong></span>';$('#rgFb').textContent='';RG.raf=requestAnimationFrame(tick);};
  go.addEventListener('pointerdown',e=>{e.preventDefault();if(!started)begin();else press();});
  go.addEventListener('click',e=>{if(e.detail===0&&!started)begin();});
  $('#rgTrack').addEventListener('pointerdown',e=>{e.preventDefault();if(!started)begin();else press();});
  auto.onclick=()=>{if(started&&!RG.active)return;stopRG();go.disabled=true;auto.disabled=true;
    const sc=clamp(gauss(cfg.p??.5,.1),0,1);let r;try{r=cfg.done(sc>=.85?'perfect':sc>=.55?'good':'miss',sc,true);}catch(e){console.error(e);r=null;}handleResult(cfg,r,before);};
  RG.key=e=>{if(e.code==='Space'||e.key===' '||e.key==='z'||e.key==='Z'||e.key==='j'||e.key==='f'){e.preventDefault();if(e.repeat)return;if(!started)begin();else press();}};
  window.addEventListener('keydown',RG.key);
  setTimeout(()=>go.focus({preventScroll:true}),30);
}

let toastT=null;
function toast(title,text,d){const t=$('#toast');t.innerHTML=`<b>${esc(title)}</b><p>${esc(text)}</p>${d||''}`;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3600);}
const PRESETS={
  grind:{n:'연습 위주',slots:['practice','vocal','jam','practice','rest']},
  writer:{n:'작곡가',slots:['write','dig','write','record','rest']},
  live:{n:'라이브',slots:['gig','busk','jam','practice','rest']},
  sns:{n:'인플루언서',slots:['cover','gig','cover','write','rest']},
  money:{n:'생계형',slots:['job','session','practice','write','rest']},
};
function routineOf(s){if(!s.routine)s.routine={on:false,slots:PRESETS.grind.slots.slice(),liveAuto:false,autoRel:false,autoRecruit:false};return s.routine;}
function actUsable(s,a){if(!a||!actAvailable(s,a))return false;if(a.yearly&&s.flags.yearly?.[a.id])return false;const c=a.cost?a.cost(s):0;if(c&&wallet(s)<c)return false;return true;}
function performAct(s,a,manual){
  const cost=a.cost?a.cost(s):0;
  if(cost&&!spend(s,cost))return null;
  s.ap--;if(a.yearly)s.flags.yearly[a.id]=1;
  if(a.id==='write')return manual?{spec:composeSpec(s)}:autoWrite(s);
  if(a.id==='gig'){if(manual)return {spec:gigSpec(s)};const sp=gigSpec(s);return sp.auto().text;}
  return a.run(s);
}
function runRoutine(s,showToast,slots){
  const r=routineOf(s);const list=(slots||r.slots).slice(0,s.ap);const done=[];const before=snap(s);
  for(let i=0;i<list.length&&s.ap>0;i++){
    let a=ACTS.find(x=>x.id===list[i]);
    if(!actUsable(s,a))a=ACTS.find(x=>x.id==='rest');
    if(!actUsable(s,a))break;
    const res=performAct(s,a,false);
    if(typeof res==='string'){done.push(a.name);log(s,`${a.name}: ${res}`);}
  }
  if(showToast&&done.length)toast('자동 루틴',done.join(' · '),deltas(before,snap(s)));
}
function doAct(id){
  if(UI.modalOpen||!S||S.ap<=0)return;
  const a=ACTS.find(x=>x.id===id);if(!actUsable(S,a))return;
  const before=snap(S);
  const r=performAct(S,a,true);
  if(r==null){render();return;}
  if(typeof r==='string'){log(S,`${a.name}: ${r}`);save();render();toast(a.name,r,deltas(before,snap(S)));return;}
  if(r.spec){queue=[];showModal(r.spec);}
}

function itemReq(s,it){
  if(it.minAge&&s.age<it.minAge)return `${it.minAge}세 이상`;
  if(!it.repeat&&hasItem(s,it.id))return '보유 중';
  if(it.gear&&(s.gear||0)>=it.gear)return '더 좋은 악기가 있다';
  if(wallet(s)<it.cost)return '돈이 부족하다';
  return '';
}
function buyItem(id){
  if(UI.modalOpen||!S)return;
  const s=S,it=ITEMS.find(x=>x.id===id);if(!it||itemReq(s,it))return;
  spend(s,it.cost);
  if(it.gear){s.gear=it.gear;if(it.id==='gear3')at(s,'stage',4);}
  if(it.id==='pedal'){at(s,'stage',3);lf(s,'insp',8);}
  if(it.id==='officetel'||it.id==='house')lf(s,'happy',it.id==='house'?14:8);
  if(it.id==='fund'){s.legacy+=20;lf(s,'happy',10);log(s,'청소년 음악 장학재단을 세웠다.','major');}
  if(it.id==='donate'){s.legacy+=2;lf(s,'happy',4);}
  if(it.id==='mylabel'){s.legacy+=6;log(s,'인디 레이블을 설립했다.','major');}
  if(it.id==='bar'){s.legacy+=3;log(s,'라이브 바를 열었다.','major');}
  if(!it.repeat)s.assets.push({id:it.id,name:it.name,value:it.value||Math.round(it.cost*.4),bought:s.year});
  log(s,`${it.name} 구입 (${fmtMoney(it.cost)}).`);

function sellAsset(i){
  if(UI.modalOpen||!S)return;
  const a=S.assets[i];if(!a)return;
  const v=Math.round((a.value||0)*R(.85,1.05));S.money+=v;S.assets.splice(i,1);
  if(a.id.startsWith('gear'))S.gear=Math.max(0,...S.assets.filter(x=>x.id.startsWith('gear')).map(x=>+x.id.slice(4)));
  log(S,`${a.name}을(를) ${fmtMoney(v)}에 처분했다.`);save();render();
}
function financeYear(s){
  const iv=s.invest;
  if(iv.dep>0)iv.dep=Math.round(iv.dep*1.03);
  if(iv.stock>0){const r=gauss(.06,.2);iv.stock=Math.max(0,Math.round(iv.stock*(1+r)));if(Math.abs(r)>.25)log(s,`주식 ${r>0?'대박':'폭락'}: ${Math.round(r*100)}%.`,r>0?'good':'bad');}
  s.assets.forEach(a=>{
    const it=ITEMS.find(x=>x.id===a.id);if(!it)return;
    if(it.upkeep)s.money-=it.upkeep;
    if(it.income){const m=Math.round(R(it.income[0],it.income[1]));s.money+=m;if(a.id==='bar')s.legacy+=.6;if(a.id==='mylabel')s.legacy+=1.2;}
    if(a.id==='officetel'||a.id==='house')a.value=Math.round(a.value*R(.98,1.06));
  });
}

function routineHTML(s){

  const opts=id=>`<option value="none" ${id==='none'?'selected':''}>— 비워 둠 —</option>`+ACTS.map(a=>`<option value="${a.id}" ${a.id===id?'selected':''}>${a.name}${actAvailable(s,a)?'':' (불가)'}</option>`).join('');
  return `<div class="routine">
    <div class="rt-head"><label class="switch"><input type="checkbox" id="rtOn" ${r.on?'checked':''}><span></span><b>자동 루틴</b></label>
      <span class="small" style="color:var(--dim)">${r.on?'1년 보내기를 누르면 남은 행동을 아래 순서대로 실행':'켜면 매년 아래 순서대로 행동을 자동 실행'}</span></div>
    <div class="rt-slots">${Array.from({length:n},(_,i)=>`<label class="rt-slot"><span>${i+1}</span><select data-slot="${i}" aria-label="루틴 ${i+1}번">${opts(r.slots[i]||'none')}</select></label>`).join('')}</div>
    <div class="rt-foot"><div class="rt-presets">${Object.entries(PRESETS).map(([k,p])=>`<button class="btn sm" data-preset="${k}">${p.n}</button>`).join('')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px"><label class="switch"><input type="checkbox" id="rtLive" ${r.liveAuto?'checked':''}><span></span>올해의 무대 자동</label><label class="switch"><input type="checkbox" id="rtRel" ${r.autoRel?'checked':''}><span></span>데모 자동 발매</label><label class="switch"><input type="checkbox" id="rtRec" ${r.autoRecruit?'checked':''}><span></span>빈자리 자동 충원</label></div>
      <button class="btn hot" id="rtNow" ${s.ap<=0||UI.modalOpen?'disabled':''}>지금 실행</button></div>
  </div>`;
}
function actHTML(s){
  const list=ACTS.filter(a=>actAvailable(s,a));
  return `${routineHTML(s)}<div class="ap-head"><span>올해 남은 행동 <b>${s.ap}</b> / ${s.apMax} · 다 쓰지 않아도 1년은 흘러간다</span><span>${s.age<19?'비용은 용돈(가족 지원)에서 나간다':''}</span></div>
  <div class="acts">${list.map(a=>{const cost=a.cost?a.cost(s):0;const used=a.yearly&&s.flags.yearly?.[a.id];const poor=cost&&wallet(s)<cost;
    return `<button class="act" data-act="${a.id}" ${s.ap<=0||used||poor||UI.modalOpen?'disabled':''}><strong>${a.name}</strong><p>${typeof a.sub==='function'?a.sub(s):a.sub}</p><div class="tags">${a.tags.map(t=>`<i>${t}</i>`).join('')}${a.mini?'<i class="mini">직접 플레이</i>':''}</div>${cost?`<span class="cost">${fmtMoney(cost)}${poor?' · 부족':''}</span>`:''}${used?'<span class="cost">올해 이미 참가</span>':''}</button>`;}).join('')}</div>`;
}
function memberCard(s,m){

    <div class="mem-info"><div class="mem-top"><b>${esc(m.name)}</b><i>${INST[m.inst].en}</i></div>
      <small>${m.age}세 · ${INST[m.inst].ko} · 실력 ${Math.round(m.skill)} · ${MTRAITS[m.trait].ko}${m.army?` · 군 복무(${m.army}년)`:''}</small>
      <div>${hearts(m.bond)}</div>
      <div class="mem-btns"><button class="btn sm" data-band="talk" data-arg="${m.id}" ${s.flags.relDone['m'+m.id]||m.army?'disabled':''}>속 얘기</button><button class="btn sm warn" data-band="kick" data-arg="${m.id}">${UI.arm==='kick'+m.id?'정말?':'내보내기'}</button></div></div></div>`;
}

    <div class="mem-info"><div class="mem-top"><b>${esc(m.name)}</b><i>${INST[m.inst].en}</i></div>
      <small>${m.age}세 · ${INST[m.inst].ko} · ${m.known?`실력 ${m.skill} · 성장 ${'★'.repeat(potStars(m.pot))}`:`실력 약 ${m.est[0]}~${m.est[1]}`} · ${MTRAITS[m.trait].ko} · ${esc(m.src)}</small>

      <div class="mem-btns"><button class="btn sm" data-band="audition" data-arg="${m.id}" ${m.known||s.ap<1?'disabled':''}>${m.known?'오디션 완료':'합주 오디션 · AP 1'}</button>
        <button class="btn sm hot" data-band="accept" data-arg="${m.id}" ${full||m.fee>wallet(s)?'disabled':''}>합격${m.fee?` · ${fmtMoney(m.fee)}`:''}</button>
        <button class="btn sm warn" data-band="reject" data-arg="${m.id}">거절</button></div></div></div>`;
}
function bandHTML(s){

    return `<div class="sec"><div class="band-name">${b?`${esc(b.name)}`:'아직 밴드가 없다'}</div>
      <p class="note">${b?`${b.formed}년 결성, 지금은 해체 상태. 은퇴 후 재결합 제의가 올 수도 있다.`:'밴드를 만들면 공고를 붙이고 지원서를 받아 멤버를 뽑는다. 다른 밴드에서 영입 제안이 오기도 한다.'}</p>
      <div class="btn-row"><button class="btn hot" data-band="form" ${can?'':'disabled'}>${b?'새 밴드 결성':'밴드 결성하기'}</button>${s.age<13?'<span class="note">13세부터</span>':''}</div></div>
      ${soloTools(s)}${quitHTML(s)}`;

  const fit=genreFit(s);
