    <div class="kv" style="min-width:220px;flex:1;max-width:360px"><div><span>밴드 실력</span><b class="num">${bandPower(s)}</b></div><div><span>밴드 합</span><b class="num">${Math.round(b.chem)}</b></div><div><span>장르 궁합</span><b class="num">${'♪'.repeat(fit)||'-'}</b></div></div></div>
  <div class="sec"><div class="sec-h"><h4>라인업 · ${b.members.length+1}명</h4><span>♥ 유대가 바닥나면 떠난다 · 최대 7명</span></div>
    <div class="lineup">
      <div class="mem me">${spriteSVG(s.look,{inst:s.inst,mood:moodOf(s),age:s.age,label:s.name})}<div class="mem-info"><div class="mem-top"><b>${esc(s.name)} (나)</b><i>${INST[s.inst].en}</i></div><small>${INST[s.inst].ko} · 음악성 ${mus(s)}</small></div></div>
      ${b.members.map(m=>memberCard(s,m)).join('')}
      ${miss.map(c=>`<div class="slots-empty"><span>${CORE_KO[c]} 자리가 비었다</span></div>`).join('')}
    </div>
    <p class="note">${GENRES[b.genre].ko}와(과) 잘 맞는 포지션: ${GENRES[b.genre].fav.map(i=>INST[i].ko).join(', ')}. 있으면 밴드 실력이 오른다.</p></div>
  <div class="sec"><div class="sec-h"><h4>지원서함 ✉ ${inbox.length}</h4><span>공고를 보고 매년 지원서가 온다 · 1년 지나면 사라진다</span></div>

    <div class="post">${Object.entries(INST).filter(([k])=>k!==s.inst).map(([k,v])=>`<button class="btn sm" data-band="scout" data-arg="${k}" ${s.ap<1||full||b.hiatus?'disabled':''}>${v.ko}</button>`).join('')}</div></div>
  ${soloTools(s)}
  <div class="sec"><div class="sec-h"><h4>밴드 관리</h4></div>
    <div class="btn-row" style="margin-top:0">
      <button class="btn" data-band="hiatus" ${b.hiatus==='army'?'disabled':''}>${b.hiatus&&b.hiatus!=='army'?'활동 재개':'활동 중단'}</button>
      <button class="btn warn" data-band="disband">${UI.arm==='disband'?'정말 해체할까?':'해체하고 솔로로'}</button>
    </div>

    <div class="title-sugs">${Object.entries(GENRES).map(([k,g])=>`<button class="chipb" data-band="genre" data-arg="${k}" aria-pressed="${k===b.genre}" ${k===b.genre?'disabled':''}>${g.ko}${s.trend[k]>=1.15?' ↑':''}</button>`).join('')}</div></div>${quitHTML(s)}`;
}
function soloTools(s){
  const active=musicOn(s)&&s.age>=16;
  const tours=Object.entries(TOURS).map(([k,T])=>{const g=tourGate(s,k);return `<div class="own-row"><div><b>${T.n}</b><small>${(T.cities||T.abroad).join(' · ')} · 팬 ${fmtN(T.min)}명 이상 · 경비 ${fmtMoney(tourCost(s,T))} · AP ${T.ap}</small></div><div class="own-btns"><button class="btn ${g?'':'hot'}" data-band="tour" data-arg="${k}" ${g?'disabled':''}>${g?esc(g):'기획'}</button></div></div>`;}).join('');
  return `<div class="sec"><div class="sec-h"><h4>레이블</h4><span>${s.contract?`${esc(LABELS[s.contract.id].name)} · ${s.contract.years}년 남음 · 우리 몫 ${Math.round(LABELS[s.contract.id].share*100)}%`:'계약 없음 · 음원 수익 90%가 우리 몫'}</span></div>
      <div class="btn-row" style="margin-top:0"><button class="btn" data-band="pitch" ${!active||s.flags.yearly.pitch||s.contract||!s.songs.length?'disabled':''}>데모 투고${s.flags.yearly.pitch?' (올해 완료)':''}</button>
      ${s.contract?`<button class="btn warn" data-band="breakc">${UI.arm==='breakc'?`위약금 ${fmtMoney(Math.round(s.contract.adv*.6))}. 해지?`:'계약 해지'}</button>`:''}</div></div>
    <div class="sec"><div class="sec-h"><h4>투어</h4><span>1년에 한 번</span></div><div class="own-list">${tours}</div></div>`;
}
function quitHTML(s){return ['musician','civil','college'].includes(s.stage)&&s.age>=19?`<div class="sec"><div class="sec-h"><h4>은퇴</h4><span>다른 직업으로 두 번째 인생을 시작한다</span></div><div class="btn-row" style="margin-top:0"><button class="btn warn" data-band="quit">음악을 내려놓는다…</button></div></div>`:'';}
function musicHTML(s){

      <div class="field" style="margin-top:10px"><label for="relTitle">앨범 제목 <span class="small" style="color:var(--dim)">비우면 타이틀곡 제목</span></label><input type="text" id="relTitle" maxlength="24" placeholder="예: 형광등 아래서"></div>
      <div class="btn-row"><label class="switch"><input type="checkbox" id="relMv" ${s.contract?'checked disabled':''}><span></span>뮤직비디오 ${s.contract?'(레이블 제작)':'(+300~500만 원)'}</label></div>
      <div class="btn-row">
        <button class="btn ${n===1?'hot':''}" data-rel="single" ${n===1&&canRel?'':'disabled'}>싱글 · 1곡${s.contract?'':` · ${fmtMoney(cost('single'))}`}</button>
        <button class="btn ${n>=3&&n<=6?'hot':''}" data-rel="ep" ${n>=3&&n<=6&&canRel?'':'disabled'}>EP · 3~6곡${s.contract?'':` · ${fmtMoney(cost('ep'))}`}</button>
        <button class="btn ${n>=7?'hot':''}" data-rel="album" ${n>=7&&n<=14&&canRel?'':'disabled'}>정규 · 7곡+${s.contract?'':` · ${fmtMoney(cost('album'))}`}</button></div>
      <p class="note">선택 ${n}곡. ${s.ap<1?'올해 AP를 다 써서 발매할 수 없다. ':''}완성도가 가장 높은 곡이 타이틀곡이 된다. 같은 장르로 묶으면 평론 점수가 오른다.</p>`
      :`<p class="empty">아직 데모가 없다. 활동 탭에서 곡을 써 보자${s.age<12?' (12세부터)':''}.</p>`}</div>

    ${rels.length?`<div class="own-list">${rels.slice(0,12).map(r=>`<div class="rel-card"><div class="rel-top"><b>${REL_KO[r.type]} 『${esc(r.title)}』</b><span>${r.year} · ${esc(r.label)}${r.review?` · 평론 ${r.review.toFixed(1)}`:''}</span></div>
      <div class="rel-songs">${r.songs.map(id=>{const x=ownSong(s,id);return x?`<span>${esc(x.title)}<em>${x.peak?x.peak+'위':'-'}</em></span>`:'';}).join('')}</div></div>`).join('')}</div>`:'<p class="empty">아직 발매한 음반이 없다.</p>'}

/* ================= persistence ================= */
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function migrate(s){
  if(!s)return;
  s.look=normLook(s.look);
  if(!INST[s.inst])s.inst='gt';
  if(s.band){s.band.members.forEach(m=>{if(!m.look)m.look=randomLook(m.gender||'f');if(!INST[m.inst])m.inst='kb';});s.band.inbox=s.band.inbox||[];s.band.posted=s.band.posted||[];}
  s.songs.forEach(x=>{if(!GENRES[x.genre])x.genre='modern';});
  if(s.band&&!GENRES[s.band.genre])s.band.genre='modern';
  if(!GENRES[s.genre])s.genre='modern';
}
function start(data){
