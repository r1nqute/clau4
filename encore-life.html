function bindGame(){
  const s=S;
  $('#btnNext').onclick=()=>{UI.arm=null;sfx('ok');ageUp(false);};
  $('#btnSkip').onclick=()=>{if(UI.modalOpen)return;queue=[];showModal(skipMenuSpec(s));};
  $('#btnSave').onclick=()=>saveMenu();
  $('#btnSnd').onclick=()=>{SND.on=!SND.on;try{localStorage.setItem(SAVE_KEY+':snd',SND.on?'1':'0');}catch(e){}if(SND.on)sfx('ok');render();};
  $('#btnSettle').onclick=()=>{if(UI.modalOpen)return;if(UI.arm!=='settle'){UI.arm='settle';render();return;}UI.arm=null;s.settled=true;s.alive=false;log(s,`${s.age}세에 인생을 정산했다.`,'major');save();render();};
  $('#btnNew').onclick=()=>{if(UI.modalOpen)return;if(UI.arm!=='new'){UI.arm='new';render();return;}UI.arm=null;S=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}render();};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;UI.arm=null;sfx('move');try{localStorage.setItem(SAVE_KEY+':tab',UI.tab);}catch(e){}render();});
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{sfx('ok');doAct(b.dataset.act);});
  document.querySelectorAll('[data-band]').forEach(b=>b.onclick=()=>{const a=b.dataset.arg;bandBtn(b.dataset.band,a&&/^\d+$/.test(a)?+a:a);});
  document.querySelectorAll('[data-sel]').forEach(c=>c.onchange=()=>{const id=+c.dataset.sel;UI.relSel=c.checked?[...new Set([...UI.relSel,id])]:UI.relSel.filter(x=>x!==id);const t=$('#relTitle')?.value;sfx('move');render();if(t&&$('#relTitle'))$('#relTitle').value=t;});
  document.querySelectorAll('[data-rel][data-ra]').forEach(b=>b.onclick=()=>relAct(+b.dataset.rel,b.dataset.ra));
  document.querySelectorAll('button[data-rel]:not([data-ra])').forEach(b=>b.onclick=()=>doRelease(b.dataset.rel));
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyItem(b.dataset.buy));
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellAsset(+b.dataset.sell));
  document.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>finMove(b.dataset.fin,+b.dataset.amt||0));
  document.querySelectorAll('[data-mtab]').forEach(b=>b.onclick=()=>{UI.mtab=b.dataset.mtab;render();});
  document.querySelectorAll('[data-rankc]').forEach(b=>b.onclick=()=>{UI.rankC=b.dataset.rankc;sfx('move');render();});
  document.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>connAct(b.dataset.conn,b.dataset.n));
  document.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{UI.connC=b.dataset.cc;sfx('move');render();});
  const cat=$('#btnCatalog');if(cat)cat.onclick=sellCatalog;
  const love=$('#btnLove');if(love)love.onclick=findLove;
  const r=routineOf(s);
  const on=$('#rtOn');if(on)on.onchange=()=>{r.on=on.checked;save();render();};
  const lv=$('#rtLive');if(lv)lv.onchange=()=>{r.liveAuto=lv.checked;save();};
  const rl=$('#rtRel');if(rl)rl.onchange=()=>{r.autoRel=rl.checked;save();};
  const rc=$('#rtRec');if(rc)rc.onchange=()=>{r.autoRecruit=rc.checked;save();};
  document.querySelectorAll('[data-slot]').forEach(sel=>sel.onchange=()=>{r.slots[+sel.dataset.slot]=sel.value;save();});
  document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{r.slots=PRESETS[b.dataset.preset].slots.slice();save();render();});
  const now=$('#rtNow');if(now)now.onclick=()=>{if(UI.modalOpen||s.ap<=0)return;runRoutine(s,true);save();render();};
}

      <div class="title-band">${UI.titleBand.map(x=>spriteSVG(x.l,{inst:x.k,mood:'happy'})).join('')}</div>
      <p>열 살, 처음 잡은 악기. 멤버를 모아 만든 밴드, 반지하 합주실, 첫 클럽 공연, 차트와 페스티벌, 그리고 마지막 앙코르까지. 한 뮤지션의 인생을 1년씩 살아 본다.</p></div>
    ${saved&&saved.alive?`<div class="continue"><p>이어서 하기 · <b>${esc(saved.name)}</b> · ${saved.age}세 · ${esc(saved.band&&!saved.band.disbanded?saved.band.name:STAGE_KO[saved.stage])}</p><button class="btn hot" id="btnCont">계속하기</button></div>`:''}
    ${slots.length?`<div class="panel"><h3>저장 슬롯</h3><div class="own-list" id="slotList">${slotRowsHTML(false)}</div></div>`:''}
    <div class="form">
      <div class="box" style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="fName">이름</label><input type="text" id="fName" maxlength="10" placeholder="예: ${esc(koName(DRAFT.gender))}" value="${esc(DRAFT.name)}"></div>
        <div class="field"><span class="lbl">성별</span><div class="seg">${[['f','여성'],['m','남성']].map(([k,n])=>`<button data-gender="${k}" aria-pressed="${DRAFT.gender===k}">${n}</button>`).join('')}</div></div>
        <div class="field"><span class="lbl">포지션</span><div class="inst-grid">${Object.entries(INST).map(([k,v])=>`<button data-inst="${k}" aria-pressed="${DRAFT.inst===k}">${spriteSVG(L,{inst:k,label:v.ko})}<b>${v.ko}</b></button>`).join('')}</div>
          <p class="note">기타 보컬은 노래와 기타를 함께 맡는다. 밴드에 꼭 필요한 자리는 보컬 · 기타 · 베이스 · 드럼.</p></div>
        <div class="field"><span class="lbl">좋아하는 장르</span><div class="pick-grid">${Object.entries(GENRES).map(([k,v])=>`<button class="pick" data-genre="${k}" aria-pressed="${DRAFT.genre===k}"><b>${v.ko}</b><small>BPM ${v.bpm}</small></button>`).join('')}</div></div>
        <div class="field"><label for="fHome">고향</label><select id="fHome" class="sel">${HOME_CITIES.map(c=>`<option ${c===DRAFT.home?'selected':''}>${c}</option>`).join('')}</select></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
        <div class="box"><h3>생김새 <button class="chipb" id="btnLookRnd">무작위</button></h3><div class="look-wrap"><div class="look-prev">${spriteSVG(L,{inst:DRAFT.inst,mood:'happy'})}</div>
          <div class="look-rows">
            <div class="look-row"><span>피부</span><div>${sw('skin',SKIN)}</div></div>
            <div class="look-row"><span>머리</span><div>${ch('hair',HAIRS)}</div></div>
            <div class="look-row"><span>머리색</span><div>${sw('hc',HAIRC,HAIRC_KO)}</div></div>
            <div class="look-row"><span>눈</span><div>${ch('eye',EYES)}</div></div>
            <div class="look-row"><span>눈동자</span><div>${sw('ec',EYEC,EYEC_KO)}</div></div>
            <div class="look-row"><span>옷</span><div>${ch('fit',FITS)}</div></div>
            <div class="look-row"><span>옷 색</span><div>${sw('fc',FITC)}</div></div>
          </div></div></div>
        <div class="box gen"><h3>타고난 재능 <em>${DRAFT.custom?'직접 정하기':'랜덤'}</em></h3>
          <div class="seg">${[['0','랜덤으로 뽑기'],['1','직접 정하기']].map(([k,n])=>`<button data-custom="${k}" aria-pressed="${String(+DRAFT.custom)===k}">${n}</button>`).join('')}</div>
          ${DRAFT.custom?customGenHTML(g):`<div class="gen-row"><span>잠재력</span><b>${g.pot} <span class="stars">${starStr(potStars(g.pot))}</span></b></div>
            <div class="trait-list">${g.traits.map(t=>`<div class="trait-card ${TRAITS[t].neg?'neg':''}"><b>${TRAITS[t].ko}</b>${TRAITS[t].desc}</div>`).join('')}</div>
            <button class="btn" id="btnReroll">다시 뽑기</button>`}
        </div>
      </div>
    </div>
    <button class="cta" id="btnStart">첫 악기를 잡는다</button>
    <p class="how"><b>하는 법</b> · 매년 정해진 AP만큼 <b>활동</b>(연습, 곡 쓰기, 합주, 클럽 공연…)을 고르고 <b>1년 보내기</b>를 누른다. 열세 살부터 <b>밴드</b>를 만들 수 있다. 공고를 붙이면 지원서가 오고, 오디션을 보고 뽑는다. 데모가 쌓이면 <b>음악</b> 탭에서 발매해 차트에 올린다. 해마다 <b>올해의 무대</b>에서 리듬 게임으로 직접 연주한다. 대화창에서는 방향키로 고르고 Z나 Enter로 정한다.</p>
  </div></div>`;
}
function customGenHTML(g){
  const sel=g.traits;
  const blocked=k=>!sel.includes(k)&&(sel.length>=2||CONFLICT.some(([a,b])=>(a===k&&sel.includes(b))||(b===k&&sel.includes(a))));
  return `<div class="field"><label for="fPot">잠재력 ${g.pot}</label><input type="range" id="fPot" min="45" max="97" value="${g.pot}"></div>
    <div class="field"><span class="lbl">재능 두 가지</span><div class="pick-grid wide">${Object.entries(TRAITS).map(([k,t])=>`<button class="pick ${t.neg?'neg':''}" data-trait="${k}" aria-pressed="${sel.includes(k)}" ${blocked(k)?'disabled':''}><b>${t.ko}</b><small>${t.desc}</small></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">강점 능력치 (최대 2개, 각 +6)</span><div class="title-sugs">${ATTRS.map(k=>`<button class="chipb" data-str="${k}" aria-pressed="${(g.strengths||[]).includes(k)}">${ATTR_KO[k]}</button>`).join('')}</div></div>`;
}
function bindStart(){
  const keepName=()=>{const n=$('#fName');if(n)DRAFT.name=n.value;};
  const re=()=>{keepName();sfx('move');const y=window.scrollY;render();window.scrollTo(0,y);};
  const c=$('#btnCont');if(c)c.onclick=()=>{try{S=JSON.parse(localStorage.getItem(SAVE_KEY));migrate(S);UI.tab=localStorage.getItem(SAVE_KEY+':tab')||'feed';}catch(e){S=null;}sfx('ok');render();};
  const sl=$('#slotList');if(sl)bindSlots(sl,()=>{sl.innerHTML=slotRowsHTML(false);bindSlots(sl,()=>render());});
  document.querySelectorAll('[data-gender]').forEach(b=>b.onclick=()=>{DRAFT.gender=b.dataset.gender;re();});
  document.querySelectorAll('[data-inst]').forEach(b=>b.onclick=()=>{DRAFT.inst=b.dataset.inst;re();});
  document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{DRAFT.genre=b.dataset.genre;re();});
  document.querySelectorAll('[data-look]').forEach(b=>b.onclick=()=>{const k=b.dataset.look;DRAFT.look[k]=['hair','eye','fit'].includes(k)?b.dataset.v:+b.dataset.v;re();});
  const lr=$('#btnLookRnd');if(lr)lr.onclick=()=>{DRAFT.look=randomLook(DRAFT.gender);re();};
  document.querySelectorAll('[data-custom]').forEach(b=>b.onclick=()=>{DRAFT.custom=b.dataset.custom==='1';if(DRAFT.custom&&!DRAFT.gen.strengths)DRAFT.gen.strengths=[];re();});
  const rr=$('#btnReroll');if(rr)rr.onclick=()=>{DRAFT.gen=rollGenetics();re();};
  const pot=$('#fPot');if(pot){pot.oninput=()=>{DRAFT.gen.pot=+pot.value;$('label[for="fPot"]').textContent=`잠재력 ${pot.value}`;};pot.onchange=re;}
  document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{const k=b.dataset.trait,t=DRAFT.gen.traits;DRAFT.gen.traits=t.includes(k)?t.filter(x=>x!==k):[...t,k].slice(0,2);re();});
  document.querySelectorAll('[data-str]').forEach(b=>b.onclick=()=>{const k=b.dataset.str;const st=DRAFT.gen.strengths=DRAFT.gen.strengths||[];DRAFT.gen.strengths=st.includes(k)?st.filter(x=>x!==k):[...st,k].slice(-2);re();});
  const home=$('#fHome');if(home)home.onchange=()=>{DRAFT.home=home.value;};
  $('#btnStart').onclick=()=>{
    keepName();sfx('fan');
    const name=(DRAFT.name||'').trim()||koName(DRAFT.gender);
    const gen={traits:DRAFT.gen.traits.slice(),pot:DRAFT.gen.pot,strengths:DRAFT.custom?(DRAFT.gen.strengths||[]).slice():[]};
    while(gen.traits.length<2){const k=pick(Object.keys(TRAITS));if(!gen.traits.includes(k)&&!CONFLICT.some(([a,b])=>(a===k&&gen.traits.includes(b))||(b===k&&gen.traits.includes(a))))gen.traits.push(k);}
    S=newGame({name,gender:DRAFT.gender,inst:DRAFT.inst,genre:DRAFT.genre,home:DRAFT.home,gen,look:{...DRAFT.look}});
    UI.tab='act';DRAFT.gen=null;DRAFT.name='';save();render();window.scrollTo(0,0);
  };
}

/* ================= ending ================= */
function grade(L){return L>=450?['S+','록의 전설']:L>=280?['S','시대의 목소리']:L>=160?['A','헤드라이너']:L>=85?['B','차트 단골']:L>=40?['C','홍대의 터줏대감']:L>=12?['D','무대 위의 노동자']:['F','이루지 못한 꿈'];}
function endHTML(s){
  const [g,t]=grade(s.legacy);
  const relSongs=s.songs.filter(x=>x.rid);
  const best=relSongs.slice().sort((a,b)=>(a.peak||999)-(b.peak||999)||b.q-a.q)[0];
  const pk=best?.peak;
  const albums=s.releases.filter(r=>r.type==='album').length;
  let ep;
  if(s.awards.some(a=>a.key==='artist'))ep='올해의 아티스트. 한 시대의 사운드트랙을 만든 사람.';
  else if(pk===1)ep=`「${best.title}」로 차트 정상에 섰던 사람.`;
  else if(s.flags.dome)ep='돔을 가득 채운 함성 속에 서 봤던 사람.';
  else if(s.flags.hof)ep='명예의 전당에 이름을 남겼다.';
  else if(s.stats.fests>=5)ep=`페스티벌 무대 ${s.stats.fests}번. 여름마다 그 이름이 라인업에 있었다.`;
  else if(albums>=3)ep=`정규 앨범 ${albums}장. 끝까지 앨범 단위로 이야기한 뮤지션.`;
  else if(pk&&pk<=30)ep=`「${best.title}」. 그해 여름, 누군가의 플레이리스트에 있던 노래.`;
  else if(s.stats.gigs>=50)ep=`${s.stats.gigs}번의 공연. 관객이 몇 명이든 무대에 올랐다.`;
  else if(s.band)ep=`${s.band.name}. 합주실 형광등 아래의 날들이 있었다.`;
  else if(s.settled&&inSchool(s))ep='아직 쓰이지 않은 노래. 여기서 기록을 멈췄다.';
  else ep='무대의 꿈은 이루지 못했지만, 그 시절의 소리는 남았다.';
  const majors=s.log.filter(e=>e.tone==='major').slice(-14);
  return `<div class="wrap"><div class="end">
    <div class="box end-hero"><div class="end-av">${spriteSVG(s.look,{age:s.age,inst:s.inst,mood:'happy',label:s.name})}<div class="grade">${g}</div></div>
      <h1>${esc(s.name)}</h1><div class="life">${START_YEAR-START_AGE} – ${s.deathYear||s.year} · ${s.settled?`${s.age}세에 정산`:`향년 ${s.age}세`} · ${INST[s.inst].ko}${s.band?` · ${esc(s.band.name)}`:''}</div>
      <div class="title">${t}</div><p class="epitaph">${esc(ep)}</p></div>
    <div class="panel"><h3>커리어 요약</h3><div class="kv">
      <div><span>발매곡 · 음반</span><b class="num">${relSongs.length} · ${s.releases.length}</b></div>
      <div><span>최고 순위</span><b class="num">${pk?pk+'위':'-'}</b></div>
      <div><span>누적 스트리밍</span><b class="num">${fmtN(s.songs.reduce((a,b)=>a+b.total,0))}</b></div>
      <div><span>공연 · 누적 관객</span><b class="num">${s.stats.gigs} · ${fmtN(s.stats.crowd)}</b></div>
      <div><span>최다 팬</span><b class="num">${fmtN(s.peakFans||0)}</b></div>
      <div><span>수상</span><b class="num">${s.awards.length}</b></div>
      <div><span>레거시</span><b class="num">${Math.round(s.legacy)}</b></div>
      <div><span>최종 자산</span><b class="num">${fmtMoney(netWorth(s))}</b></div>
    </div>${best?`<div class="setlist" style="margin-top:12px"><small>대표곡</small><ol><li>${esc(best.title)}</li></ol></div>`:''}</div>
    ${s.band&&s.band.members.length?`<div class="panel"><h3>마지막 라인업</h3><div class="title-band" style="justify-content:flex-start;margin:0">${s.band.members.map(m=>spriteSVG(m.look,{inst:m.inst,label:m.name})).join('')}</div></div>`:''}
    ${s.awards.length?`<div class="panel"><h3>트로피</h3><div class="gig-awards">${s.awards.map(a=>`<i>${esc(a.name)}</i>`).join('')}</div></div>`:''}
    <div class="panel"><h3>결정적 순간들</h3><div class="feed">${majors.reduce((g,e)=>{const l=g[g.length-1];if(l&&l.age===e.age)l.items.push(e);else g.push({age:e.age,year:e.year,items:[e]});return g;},[]).map(g=>`<div class="yr"><div class="yr-h">${g.age}세 · ${g.year}</div><ul>${g.items.map(e=>`<li class="major">${esc(e.text)}</li>`).join('')}</ul></div>`).join('')}</div></div>
    <button class="cta" id="btnAgain">새 인생 시작</button>
  </div></div>`;
}
function bindEnd(){$('#btnAgain').onclick=()=>{S=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}render();window.scrollTo(0,0);};}

/* ================= persistence ================= */
function save(){try{if(S)localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function migrate(s){
  if(!s)return;
  s.look=normLook(s.look);
  if(!INST[s.inst])s.inst='gt';
  if(s.band){s.band.members.forEach(m=>{if(!m.look)m.look=randomLook(m.gender||'f');if(!INST[m.inst])m.inst='kb';});s.band.inbox=s.band.inbox||[];s.band.posted=s.band.posted||[];}
  s.songs.forEach(x=>{if(!GENRES[x.genre])x.genre='modern';});
  if(s.band&&!GENRES[s.band.genre])s.band.genre='modern';
  if(!GENRES[s.genre])s.genre='modern';
  s.rivals.forEach(r=>{if(r.real){if(!r.c)r.c='KR';if(r.active===undefined)r.active=true;if(!r.base)r.base=r.p;}});
  REAL_BANDS.forEach(([n,g,p,c,st])=>{if(!s.rivals.some(r=>r.n===n))s.rivals.push({n,g,p,base:p,c,real:true,legend:st==='L',active:st!=='L'});});
  s.conns=s.conns||[];s.flags.scene=s.flags.scene||{};
}
function start(data){
  if(data&&data.S){S=data.S;migrate(S);}
  if(data&&data.UI)Object.assign(UI,{tab:data.UI.tab||'feed'});
  UI.modalOpen=false;
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,UI:{tab:UI.tab}}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
